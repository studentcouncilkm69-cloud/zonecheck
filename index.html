                                    </div>
                                    <div>
                                        <label className="text-[11px] font-black text-gray-600 block mb-1">ระดับชั้นของใบประเมิน</label>
                                        <select
                                            value={omrScannerModal.scanGradeFilter}
                                            onChange={e => handleUpdateOmrFilterConfig(omrScannerModal.scanTypeFilter, e.target.value, omrScannerModal.scanCustomRoomIds)}
                                            className="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs font-bold bg-white"
                                        >
                                            <option value="all">รวมทุกระดับชั้น ({rooms.length} ห้อง)</option>
                                            {['1', '2', '3', '4', '5', '6'].map(g => (
                                                <option key={g} value={g}>เฉพาะสายชั้น ม.{g}</option>
                                            ))}
                                            <option value="custom">กำหนดห้องเอง (ตามที่พิมพ์ไป)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-black text-gray-600 block mb-1">ความไวในการอ่านรอยหมึก ({omrScannerModal.sensitivity}%)</label>
                                        <input
                                            type="range"
                                            min="10"
                                            max="90"
                                            value={omrScannerModal.sensitivity}
                                            onChange={e => {
                                                const v = Number(e.target.value);
                                                setOmrScannerModal(prev => ({ ...prev, sensitivity: v }));
                                                if (omrRawImageRef.current) {
                                                    processOmrImageWithSensitivity(omrRawImageRef.current, v, null, null, null, omrCorners);
                                                }
                                            }}
                                            className="w-full accent-[#C8102E]"
                                        />
                                    </div>
                                </div>

                                {/* Step 2: Upload & Interactive Corner Drag */}
                                <div className="bg-gray-50 border border-gray-200 rounded-2xl p-4 flex flex-col gap-3">
                                    <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                                        <div className="flex items-center gap-3">
                                            <div className="w-11 h-11 rounded-xl bg-white border border-gray-200 flex items-center justify-center text-[#C8102E] shadow-sm shrink-0">
                                                <i className="ph ph-corners-out text-2xl"></i>
                                            </div>
                                            <div>
                                                <p className="text-xs sm:text-sm font-black text-gray-800">
                                                    {omrScannerModal.imagePreview ? 'ใช้นิ้วหรือเมาส์แตะลากจุดมุมสีเขียว (TL, TR, BL, BR) เพื่อขยับให้ตรงมุมกระดาษได้ทันที' : '2. ถ่ายรูปใบประเมินให้เห็นจุดมาร์คสีดำทั้ง 4 มุมกระดาษ'}
                                                </p>
                                                <p className="text-[11px] text-gray-500 mt-0.5">
                                                    หากมุมไม่ตรง สามารถลากจุดสีเขียว TL, TR, BL, BR บนภาพด้านล่าง หรือกดปุ่มขยายเต็มจอเพื่อลากปรับอย่างละเอียด
                                                </p>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-2 w-full sm:w-auto">
                                            {omrScannerModal.imagePreview && (
                                                <button type="button" onClick={handleResetOmrAutoCorners} className="px-3 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-bold text-xs shrink-0 transition-all">
                                                    รีเซ็ตมุม
                                                </button>
                                            )}
                                            <label className="flex-1 sm:flex-initial px-4 py-3 bg-[#C8102E] hover:bg-red-800 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-2 cursor-pointer shadow-md shrink-0 transition-all active:scale-95">
                                                <i className="ph ph-camera text-base"></i>
                                                <span>{omrScannerModal.imagePreview ? 'เปลี่ยนรูป' : 'ถ่ายรูป / เลือกรูปใบตรวจ'}</span>
                                                <input type="file" accept="image/*" ref={omrFileInputRef} onChange={handleOmrImageUpload} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    {(omrScannerModal.annotatedPreview || omrScannerModal.imagePreview) && (
                                        <div className="relative w-full bg-gray-900 rounded-xl overflow-hidden border-2 border-gray-300 shadow-md select-none touch-none">
                                            <img
                                                ref={omrPreviewImgRef}
                                                src={omrScannerModal.annotatedPreview || omrScannerModal.imagePreview}
                                                draggable="false"
                                                onMouseDown={(e) => handleStartDragOmrCorner(e, omrPreviewImgRef.current)}
                                                onMouseMove={(e) => handleMoveDragOmrCorner(e, omrPreviewImgRef.current)}
                                                onMouseUp={handleEndDragOmrCorner}
                                                onMouseLeave={handleEndDragOmrCorner}
                                                onTouchStart={(e) => handleStartDragOmrCorner(e, omrPreviewImgRef.current)}
                                                onTouchMove={(e) => handleMoveDragOmrCorner(e, omrPreviewImgRef.current)}
                                                onTouchEnd={handleEndDragOmrCorner}
                                                className="w-full max-h-[360px] object-contain mx-auto block cursor-crosshair select-none"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setOmrZoomPreviewUrl(omrScannerModal.annotatedPreview || omrScannerModal.imagePreview)}
                                                className="absolute bottom-2.5 right-2.5 bg-gray-900/90 hover:bg-black backdrop-blur-sm text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg border border-white/20"
                                            >
                                                <i className="ph ph-magnifying-glass-plus text-sm text-amber-300"></i> ขยายเต็มจอเพื่อดู/ลากมุม
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {/* Step 3: Results Table */}
                                <div className="space-y-3">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <h3 className="text-xs sm:text-sm font-black text-gray-800">
                                            3. ตรวจสอบห้องที่จะบันทึก ({omrScannerModal.results.filter(r => r.selectedForSave).length} / {omrScannerModal.results.length} ห้อง)
                                        </h3>
                                        <div className="flex flex-wrap gap-1.5">
                                            <button
                                                type="button"
                                                onClick={() => setOmrScannerModal(prev => ({
                                                    ...prev,
                                                    results: prev.results.map(item => ({ ...item, selectedForSave: item.hasDetectedMark }))
                                                }))}
                                                className="px-2.5 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 border border-indigo-200 text-[11px] font-bold"
                                            >
                                                ☑️ เลือกเฉพาะห้องที่มีรอยฝน/กากบาท
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setOmrScannerModal(prev => ({
                                                    ...prev,
                                                    results: prev.results.map(item => ({ ...item, selectedForSave: true }))
                                                }))}
                                                className="px-2.5 py-1.5 rounded-xl bg-gray-100 text-gray-700 text-[11px] font-bold"
                                            >
                                                เลือกทั้งหมด
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setOmrScannerModal(prev => ({
                                                    ...prev,
                                                    results: prev.results.map(item => ({ ...item, selectedForSave: false }))
                                                }))}
                                                className="px-2.5 py-1.5 rounded-xl bg-gray-100 text-gray-700 text-[11px] font-bold"
                                            >
                                                ล้างทั้งหมด
                                            </button>
                                        </div>
                                    </div>

                                    <div className="max-h-72 overflow-y-auto border border-gray-200 rounded-2xl custom-scrollbar">
                                        <table className="w-full text-xs text-center border-collapse">
                                            <thead className="bg-gray-100 text-gray-700 font-bold sticky top-0 z-10">
                                                <tr>
                                                    <th className="py-2 px-2 border-r border-gray-200">บันทึก</th>
                                                    <th className="py-2 px-2 border-r border-gray-200">ที่</th>
                                                    <th className="py-2 px-3 text-left border-r border-gray-200">ห้อง</th>
                                                    {(omrScannerModal.scanTypeFilter === 'both' || omrScannerModal.scanTypeFilter === 'room') && (
                                                        <>
                                                            <th className="py-2 px-2 border-r border-gray-200">หมวดห้องเรียน (เต็ม 10 / ข้อละ 2)</th>
                                                            <th className="py-2 px-2 border-r border-gray-200">รวมห้อง</th>
                                                        </>
                                                    )}
                                                    {(omrScannerModal.scanTypeFilter === 'both' || omrScannerModal.scanTypeFilter === 'zone') && (
                                                        <th className="py-2 px-2">หมวดเขตพื้นที่</th>
                                                    )}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {omrScannerModal.results.map(item => {
                                                    const rs = item.roomScores;
                                                    const roomSum = rs.skip ? 'ข้าม' : (rs.noDuty ? -5 : (rs.full ? 10 : (rs.c1 + rs.c2 + rs.c3 + rs.c4 + rs.c5)));
                                                    return (
                                                        <tr key={item.room.id} className={`border-b border-gray-100 ${item.selectedForSave ? 'bg-emerald-50/30' : 'opacity-50 bg-gray-50'}`}>
                                                            <td className="py-2 px-2 border-r border-gray-100">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={item.selectedForSave}
                                                                    onChange={e => {
                                                                        const checked = e.target.checked;
                                                                        setOmrScannerModal(prev => ({
                                                                            ...prev,
                                                                            results: prev.results.map(r => r.room.id === item.room.id ? { ...r, selectedForSave: checked } : r)
                                                                        }));
                                                                    }}
                                                                    className="w-4 h-4 accent-[#C8102E] rounded cursor-pointer"
                                                                />
                                                            </td>
                                                            <td className="py-2 px-2 font-bold text-gray-500 border-r border-gray-100">{item.index}</td>
                                                            <td className="py-2 px-3 font-black text-gray-800 text-left border-r border-gray-100 whitespace-nowrap">{item.room.name}</td>
                                                            {(omrScannerModal.scanTypeFilter === 'both' || omrScannerModal.scanTypeFilter === 'room') && (
                                                                <>
                                                                    <td className="py-2 px-2 border-r border-gray-100">
                                                                        <div className="flex items-center justify-center gap-1 flex-wrap">
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => toggleOmrResultCriterion(item.room.id, 'full')}
                                                                                className={`px-2 py-1 rounded-lg font-bold text-[10px] transition-all ${!rs.noDuty && !rs.skip && rs.full ? 'bg-emerald-600 text-white shadow-sm ring-2 ring-emerald-300' : 'bg-gray-100 text-gray-500'}`}
                                                                            >
                                                                                เต็ม (10)
                                                                            </button>
                                                                            {[
                                                                                { k: 'c1', l: 'โต๊ะ' },
                                                                                { k: 'c2', l: 'ขยะ' },
                                                                                { k: 'c3', l: 'ไฟ' },
                                                                                { k: 'c4', l: 'พื้น' },
                                                                                { k: 'c5', l: 'บอร์ด' }
                                                                            ].map(crit => {
                                                                                const active = !rs.noDuty && !rs.skip && rs[crit.k] > 0;
                                                                                return (
                                                                                    <button
                                                                                        key={crit.k}
                                                                                        type="button"
                                                                                        onClick={() => toggleOmrResultCriterion(item.room.id, crit.k)}
                                                                                        className={`px-2 py-1 rounded-lg font-bold text-[10px] transition-all ${active ? 'bg-emerald-500 text-white shadow-sm' : 'bg-red-100 text-red-600'}`}
                                                                                    >
                                                                                        {crit.l}
                                                                                    </button>
                                                                                );
                                                                            })}
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => toggleOmrResultCriterion(item.room.id, 'noDuty')}
                                                                                className={`px-2 py-1 rounded-lg font-bold text-[10px] transition-all ${rs.noDuty ? 'bg-red-600 text-white shadow-sm' : 'bg-gray-100 text-gray-400'}`}
                                                                            >
                                                                                ไม่ทำ (-5)
                                                                            </button>
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => toggleOmrResultCriterion(item.room.id, 'skip')}
                                                                                className={`px-2 py-1 rounded-lg font-bold text-[10px] transition-all ${rs.skip ? 'bg-gray-700 text-white shadow-sm' : 'bg-gray-100 text-gray-400'}`}
                                                                            >
                                                                                ข้าม
                                                                            </button>
                                                                        </div>
                                                                    </td>
                                                                    <td className="py-2 px-2 font-black border-r border-gray-100 text-blue-700">{roomSum}</td>
                                                                </>
                                                            )}
                                                            {(omrScannerModal.scanTypeFilter === 'both' || omrScannerModal.scanTypeFilter === 'zone') && (
                                                                <td className="py-2 px-2">
                                                                    {item.room.hasZone === false ? (
                                                                        <span className="text-[10px] text-gray-400">ไม่มีเขตพื้นที่</span>
                                                                    ) : (
                                                                        <div className="flex items-center justify-center gap-1 flex-wrap">
                                                                            {[10, 8, 5, 2, -5].map(zv => (
                                                                                <button
                                                                                    key={zv}
                                                                                    type="button"
                                                                                    onClick={() => setOmrResultZone(item.room.id, zv)}
                                                                                    className={`px-2 py-1 rounded-lg font-bold text-[10px] ${!item.zoneSkip && item.zoneScore === zv ? 'bg-fuchsia-600 text-white shadow-sm' : 'bg-gray-100 text-gray-500'}`}
                                                                                >
                                                                                    {zv}
                                                                                </button>
                                                                            ))}
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => setOmrResultZone(item.room.id, 'skip')}
                                                                                className={`px-2 py-1 rounded-lg font-bold text-[10px] ${item.zoneSkip ? 'bg-gray-700 text-white' : 'bg-gray-100 text-gray-400'}`}
                                                                            >
                                                                                ข้าม
                                                                            </button>
                                                                        </div>
                                                                    )}
                                                                </td>
                                                            )}
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button onClick={() => setOmrScannerModal(prev => ({ ...prev, isOpen: false }))} className="px-4 py-2.5 rounded-xl bg-gray-100 text-gray-600 text-xs font-bold">
                                            ยกเลิก
                                        </button>
                                        <button onClick={handleSaveOmrBatchResults} className="px-5 py-2.5 rounded-xl bg-[#C8102E] hover:bg-red-800 text-white text-xs font-black shadow-md">
                                            ✅ บันทึกผลสแกน ({omrScannerModal.results.filter(r => r.selectedForSave).length} ห้อง)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal ขยายดูรูปใบประเมินที่สแกนแล้วแบบเต็มจอ (รองรับการแตะลากมุม TL, TR, BL, BR ในโหมดขยายด้วย) */}
                    {omrZoomPreviewUrl && (
                        <div className="fixed inset-0 z-[99999] bg-black/95 backdrop-blur-md flex flex-col items-center justify-center p-2 sm:p-6 animate-in fade-in" onClick={() => setOmrZoomPreviewUrl(null)}>
                            <div className="w-full max-w-6xl flex flex-wrap justify-between items-center text-white mb-3 px-2 gap-2" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center gap-2">
                                    <i className="ph ph-scan text-amber-400 text-xl"></i>
                                    <span className="font-bold text-xs sm:text-sm">แตะลากจุดสีเขียวทั้ง 4 มุม (TL, TR, BL, BR) ให้ทับสี่เหลี่ยมสีดำบนมุมกระดาษได้โดยตรง</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={handleResetOmrAutoCorners} className="px-3 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-bold">
                                        รีเซ็ตมุมอัตโนมัติ
                                    </button>
                                    <button onClick={() => setOmrZoomPreviewUrl(null)} className="px-4 py-1.5 rounded-xl bg-[#C8102E] hover:bg-red-800 text-white text-xs font-bold flex items-center gap-1">
                                        <i className="ph ph-x"></i> ปิดหน้าต่างขยาย
                                    </button>
                                </div>
                            </div>
                            <div className="flex-1 w-full overflow-auto flex items-center justify-center p-2 select-none touch-none" onClick={e => e.stopPropagation()}>
                                <img
                                    ref={omrZoomImgRef}
                                    src={omrScannerModal.annotatedPreview || omrZoomPreviewUrl}
                                    draggable="false"
                                    onMouseDown={(e) => handleStartDragOmrCorner(e, omrZoomImgRef.current)}
                                    onMouseMove={(e) => handleMoveDragOmrCorner(e, omrZoomImgRef.current)}
                                    onMouseUp={handleEndDragOmrCorner}
                                    onMouseLeave={handleEndDragOmrCorner}
                                    onTouchStart={(e) => handleStartDragOmrCorner(e, omrZoomImgRef.current)}
                                    onTouchMove={(e) => handleMoveDragOmrCorner(e, omrZoomImgRef.current)}
                                    onTouchEnd={handleEndDragOmrCorner}
                                    className="max-w-none w-[1122px] h-auto rounded-lg shadow-2xl border border-white/20 bg-white cursor-crosshair select-none"
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
