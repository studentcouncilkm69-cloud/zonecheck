        const DEFAULT_GEMINI_KEY = ["AQ.Ab8RN6IYK", "_MZisi6uunj98GG", "OCNmmzHLofcgqJY", "zNyt6k6YfkQ"].join("");

        const safeGetItem = (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } };
        const safeSetItem = (key, val) => { try { localStorage.setItem(key, val); } catch(e) {} };
        const safeRemoveItem = (key) => { try { localStorage.removeItem(key); } catch(e) {} };
        const safeSessionGet = (key) => { try { return sessionStorage.getItem(key); } catch(e) { return null; } };
        const safeSessionSet = (key, val) => { try { sessionStorage.setItem(key, val); } catch(e) {} };
        const safeSessionRemove = (key) => { try { sessionStorage.removeItem(key); } catch(e) {} };
        const SESSION_TIMEOUT_MS = 5 * 60 * 1000;
        const getValidSessionState = () => {
            try {
                const raw = safeSessionGet('zc26_active_session');
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || !parsed.mode || parsed.mode === 'guest') return null;
                const now = Date.now();
                if (parsed.lastActive && (now - parsed.lastActive) > SESSION_TIMEOUT_MS) {
                    safeSessionRemove('zc26_active_session');
                    return null;
                }
                return parsed;
            } catch (e) { return null; }
        };

        const safeParse = (data, fallback) => {
            if (!data) return fallback;
            try {
                const parsed = JSON.parse(data);
                if (Array.isArray(fallback) && !Array.isArray(parsed)) return fallback;
                return parsed;
            } catch (e) { return fallback; }
        };

        const generateId = (prefix) => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).substr(2, 5)}`;
        
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }

                if (this.state.hasError) {
                    return (

                            <i className="ph ph-warning-circle text-red-500 mb-4 text-6xl"></i>
                            <h1 className="text-3xl font-bold text-red-600 mb-2">⚠️ ระบบขัดข้อง</h1>
                            <p className="text-red-500 mb-4 text-sm font-medium">ตรวจพบข้อผิดพลาด หรืออินเทอร์เน็ตไม่เสถียร<br/>กรุณากดปุ่มด้านล่างเพื่อเริ่มใหม่</p>
                            <button onClick={() => { 
                                safeRemoveItem('zc26_rooms'); safeRemoveItem('zc26_inspectors');

                        </div>

        const initialSettings = {

            ai_bot_name: "น้องสภาฯ"

        const ROOM_CRITERIA = [
            { id: 'c1', name: "โต๊ะ" }, { id: 'c2', name: "ขยะ" },
            { id: 'c3', name: "ไฟ/หน้าต่าง" }, { id: 'c4', name: "พื้น" }, { id: 'c5', name: "กระดาน" }
        ];

        const formatThaiDateForFile = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${String(d.getDate()).padStart(2,'0')}_${months[d.getMonth()]}_${d.getFullYear()+543}`;
        };

        const formatDateObj = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return 'วันที่ไม่ระบุ';
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
        };

        const formatMonthYearShort = (dateStr) => {
            if(!dateStr) return '';
            const parts = dateStr.split('-');
            if(parts.length !== 2) return dateStr;
            const [year, month] = parts;
            const monthsShort = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${monthsShort[parseInt(month)-1] || month} ${parseInt(year)+543}`;
        };
        
        const formatMonthYearThai = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            return `${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`;
        };

        const getPodiumFontSize = (name, isFirst = false) => {
            const len = (name || '').length;
            if (len > 7) return isFirst ? 'text-xs md:text-sm' : 'text-[10px] md:text-xs';
            if (len > 5) return isFirst ? 'text-sm md:text-base' : 'text-xs md:text-sm';
            return isFirst ? 'text-base md:text-xl' : 'text-sm md:text-lg';
        };

        const compareRoomNames = (a, b) => {
            const nameA = String(a?.name || a || '').trim();
            const nameB = String(b?.name || b || '').trim();
            const parseRoom = (str) => {
                const m = str.match(/(\d+)\s*\/\s*([0-9]+|[A-Za-zก-ฮ]+)/);
                if (!m) return { grade: 999, subNum: 999, subOrder: 999, subText: str };
                const grade = parseInt(m[1], 10);
                const rawSub = m[2];
                const isNum = /^\d+$/.test(rawSub);
                const subText = isNum ? '' : rawSub.toLowerCase();
                let subOrder = 500;
                if (!isNum) {
                    if (grade >= 1 && grade <= 3) {
                        // ม.ต้น (ม.1 - ม.3): Sp ขึ้นก่อน Sm
                        if (subText === 'sp') subOrder = 1;
                        else if (subText === 'sm') subOrder = 2;
                    } else {
                        // ม.ปลาย (ม.4 - ม.6): Sm ขึ้นก่อน Sp
                        if (subText === 'sm') subOrder = 1;
                        else if (subText === 'sp') subOrder = 2;
                    }
                }
                return {
                    grade,
                    subNum: isNum ? parseInt(rawSub, 10) : 999,
                    subOrder,
                    subText
                };
            };
            const pa = parseRoom(nameA);
            const pb = parseRoom(nameB);
            if (pa.grade !== pb.grade) return pa.grade - pb.grade;
            if (pa.subNum !== pb.subNum) return pa.subNum - pb.subNum;
            if (pa.subOrder !== pb.subOrder) return pa.subOrder - pb.subOrder;
            return pa.subText.localeCompare(pb.subText, 'th');
        };

        const sortRoomsNaturally = (roomList) => {
            if (!Array.isArray(roomList)) return [];
            return [...roomList].sort(compareRoomNames);
        };

            // States สำหรับหน้าตั้งค่าคลังผู้ลงนามและเซตลายเซ็น (แอดมิน)
            const [newSignerName, setNewSignerName] = useState('');

            const [historyViewMode, setHistoryViewMode] = useState('table');

รายละเอียดรายห้อง:

            const generateLocalSmartAiReply = (rawQuery) => {
                const q = String(rawQuery || '').trim();
                const qLower = q.toLowerCase();
                const targetDateStr = filterDate || new Date().toISOString().split('T')[0];
                const validRooms = Array.isArray(rooms) ? rooms : [];
                const validInspections = Array.isArray(inspections) ? inspections : [];
                const dayInsps = validInspections.filter(i => i.date && String(i.date).startsWith(targetDateStr));

                // 1. ตรวจสอบว่าถามถึงห้องเรียนห้องใดห้องหนึ่งหรือไม่ (เช่น 1/1, ม.2/5, 3/sp, 4/sm)
                const roomRegex = /(?:ม\.?\s*)?(\d+)\s*(?:\/|-|\s)\s*([0-9]+|sp|sm)/i;
                const roomMatch = q.match(roomRegex);
                if (roomMatch) {
                    const gradeNum = roomMatch[1];
                    const subStr = roomMatch[2].toLowerCase();
                    const matchedRoom = validRooms.find(r => {
                        const m = String(r.name || '').match(/(\d+)\s*\/\s*([0-9]+|[A-Za-zก-ฮ]+)/);
                        if (!m) return false;
                        return m[1] === gradeNum && m[2].toLowerCase() === subStr;
                    });

                    if (matchedRoom) {
                        const rInsp = dayInsps.find(i => i.roomId === matchedRoom.id && i.type === 'room');
                        const zInsp = dayInsps.find(i => i.roomId === matchedRoom.id && i.type === 'zone');
                        const rankAll = leaderboardDataAllTime.find(item => item.room?.id === matchedRoom.id);
                        const rankMonth = monthlyDashboardData.find(item => item.room?.id === matchedRoom.id);
                        const rPin = mapPinsData?.room?.[matchedRoom.id];
                        const zPin = mapPinsData?.zone?.[matchedRoom.id];

                        let rDetail = 'ยังไม่ได้ตรวจในวันนี้';
                        if (rInsp) {
                            if (rInsp.totalScore === null) {
                                rDetail = `ข้ามการตรวจ (${rInsp.comment || 'ไม่ระบุสาเหตุ'})`;

                                rDetail = `ไม่ปฏิบัติหน้าที่ (-5 คะแนน)`;
                            } else {
                                const deducted = ROOM_CRITERIA.filter(c => rInsp.scores?.[c.id] === 0).map(c => c.name);
                                rDetail = `ได้ +${rInsp.totalScore} / 10 คะแนน` + (deducted.length > 0 ? ` (หักหมวด: ${deducted.join(', ')})` : ' (สะอาดครบทุกจุด)');
                            }
                        }

                        let zDetail = matchedRoom.hasZone === false ? 'ไม่มีเขตพื้นที่รับผิดชอบ' : 'ยังไม่ได้ตรวจในวันนี้';
                        if (matchedRoom.hasZone !== false && zInsp) {
                            if (zInsp.totalScore === null) {
                                zDetail = `ข้ามการตรวจ (${zInsp.comment || 'ไม่ระบุสาเหตุ'})`;
                            } else {
                                zDetail = `${zInsp.scores?.status || 'ประเมินแล้ว'} (${zInsp.totalScore > 0 ? '+' + zInsp.totalScore : zInsp.totalScore} / 10 คะแนน)`;
                            }
                        }

                        const actions = [];
                        actions.push({
                            label: `ดูพิกัดห้อง ${matchedRoom.name}`,
                            type: 'open_map',
                            roomObj: matchedRoom,
                            mapType: 'room'
                        });
                        if (matchedRoom.hasZone !== false) {
                            actions.push({
                                label: `ดูพิกัดเขต ${matchedRoom.name}`,
                                type: 'open_map',
                                roomObj: matchedRoom,
                                mapType: 'zone'
                            });
                        }
                        if (appMode !== 'guest') {
                            actions.push({
                                label: `ประเมินห้อง ${matchedRoom.name}`,
                                type: 'inspect_room',
                                roomObj: matchedRoom
                            });
                        }

                        const lines = [
                            `ข้อมูลของห้อง ${matchedRoom.name} (ประจำวันที่ ${formatDateObj(targetDateStr)})`,
                            `• หมวดห้องเรียน: ${rDetail}`,
                            `• หมวดเขตพื้นที่: ${zDetail}`
                        ];
                        if (rInsp?.comment || zInsp?.comment) {
                            lines.push(`• หมายเหตุ: ${[rInsp?.comment, zInsp?.comment].filter(Boolean).join(', ')}`);
                        }
                        if (rankAll) {
                            lines.push(`• คะแนนสะสมรวม: ${rankAll.score} คะแนน (อันดับที่ ${rankAll.trueRank})`);
                        }
                        if (rankMonth) {
                            lines.push(`• คะแนนประจำเดือนนี้: ${rankMonth.score} คะแนน (อันดับที่ ${rankMonth.trueRank})`);
                        }
                        if (rPin?.note) lines.push(`• ตำแหน่งห้องเรียน: ${rPin.note}`);
                        if (zPin?.note && matchedRoom.hasZone !== false) lines.push(`• ตำแหน่งเขตพื้นที่: ${zPin.note}`);

                        return { text: lines.join('\n'), actions };

                // 2. ถามถึงสายชั้นทั้งสายชั้น เช่น "ม.1", "ม.2", "ม.ต้น", "ม.ปลาย"
                const gradeOnlyMatch = q.match(/^(?:ชั้น\s*)?ม\.?\s*([1-6]|ต้น|ปลาย)$/i);
                if (gradeOnlyMatch) {
                    const gKey = gradeOnlyMatch[1];
                    const targetRooms = validRooms.filter(r => {
                        const m = String(r.name || '').match(/(\d+)/);
                        const g = m ? parseInt(m[1], 10) : 0;
                        if (gKey === 'ต้น') return g >= 1 && g <= 3;
                        if (gKey === 'ปลาย') return g >= 4 && g <= 6;
                        return String(g) === gKey;
                    });
                    if (targetRooms.length > 0) {
                        const lines = [`สรุปข้อมูลสายชั้น ม.${gKey} (วันที่ ${formatDateObj(targetDateStr)}):`];
                        targetRooms.forEach(r => {
                            const rInsp = dayInsps.find(i => i.roomId === r.id && i.type === 'room');
                            const zInsp = dayInsps.find(i => i.roomId === r.id && i.type === 'zone');

                            const zTxt = r.hasZone === false ? 'ไม่มีเขต' : (zInsp ? (zInsp.totalScore === null ? 'ข้าม' : `${zInsp.totalScore}`) : '-');
                            lines.push(`• ${r.name}: ห้อง [${rTxt}] | เขต [${zTxt}]`);

                        return { text: lines.join('\n'), actions: [] };

                // 3. ถามถึงห้องที่ยังไม่ได้ตรวจ / ความคืบหน้าวันนี้
                if (qLower.includes('ยังไม่ตรวจ') || qLower.includes('ยังไม่ได้ตรวจ') || qLower.includes('เหลือห้องไหน') || qLower.includes('ความคืบหน้า') || qLower.includes('ตรวจหรือยัง') || qLower.includes('ตรวจไปกี่ห้อง')) {
                    const uncheckedRooms = validRooms.filter(r => !dayInsps.some(i => i.roomId === r.id && i.type === 'room'));
                    const uncheckedZones = validRooms.filter(r => r.hasZone !== false && !dayInsps.some(i => i.roomId === r.id && i.type === 'zone'));

                    const lines = [
                        `สรุปความคืบหน้าการตรวจ ประจำวันที่ ${formatDateObj(targetDateStr)}`,
                        `• หมวดห้องเรียน: ตรวจแล้ว ${inspectProgress.roomDone} / ${inspectProgress.roomTotal} ห้อง (${inspectProgress.roomPct}%)`,
                        uncheckedRooms.length === 0

                            : `  -> เหลือยังไม่ตรวจ (${uncheckedRooms.length} ห้อง): ${uncheckedRooms.slice(0, 18).map(r => r.name).join(', ')}${uncheckedRooms.length > 18 ? ` และอีก ${uncheckedRooms.length - 18} ห้อง` : ''}`,
                        `• หมวดเขตพื้นที่: ตรวจแล้ว ${inspectProgress.zoneDone} / ${inspectProgress.zoneTotal} เขต (${inspectProgress.zonePct}%)`,
                        uncheckedZones.length === 0
                            ? `  -> ตรวจครบทุกเขตพื้นที่แล้ว`
                            : `  -> เหลือยังไม่ตรวจ (${uncheckedZones.length} เขต): ${uncheckedZones.slice(0, 18).map(r => r.name).join(', ')}${uncheckedZones.length > 18 ? ` และอีก ${uncheckedZones.length - 18} เขต` : ''}`
                    ];
                    return { text: lines.join('\n'), actions: [] };
                }

                return null;
            };

            const getRoomAiInsight = (roomId, roomName = '') => {
                if (!roomId) return null;
                const validInspections = Array.isArray(inspections) ? inspections : [];
                const roomHistory = validInspections.filter(i => i.roomId === roomId && i.totalScore !== null && i.totalScore !== undefined);
                const rInsps = roomHistory.filter(i => i.type === 'room');
                const zInsps = roomHistory.filter(i => i.type === 'zone');

                if (rInsps.length === 0 && zInsps.length === 0) {
                    return {
                        hasData: false,
                        summary: 'ยังไม่มีสถิติการตรวจสะสมเพียงพอสำหรับการวิเคราะห์',
                        weaknessText: '-',
                        strengthText: '-',
                        zoneTrendText: '-',
                        roomCheckedCount: 0,
                        zoneCheckedCount: 0
                    };
                }

                const failCounts = { c1: 0, c2: 0, c3: 0, c4: 0, c5: 0 };
                let noDutyCount = 0;
                let perfectRoomCount = 0;

                rInsps.forEach(insp => {
                    if (insp.scores?.status === 'ไม่ปฏิบัติหน้าที่' || insp.totalScore === -5) {
                        noDutyCount++;
                    } else {
                        if (Number(insp.totalScore) === 10) perfectRoomCount++;
                        ROOM_CRITERIA.forEach(c => {
                            if (insp.scores && insp.scores[c.id] === 0) {
                                failCounts[c.id] = (failCounts[c.id] || 0) + 1;
                            }
                        });
                    }
                });

                const sortedFails = ROOM_CRITERIA
                    .map(c => ({ id: c.id, name: c.name, count: failCounts[c.id] || 0 }))
                    .sort((a, b) => b.count - a.count);

                const topWeaknesses = sortedFails.filter(f => f.count > 0);
                const topStrengths = sortedFails.filter(f => f.count === 0).map(f => f.name);

                let weaknessText = 'ยังไม่เคยถูกหักคะแนนรายจุดเลย รักษามาตรฐานได้ดีเยี่ยม';
                if (topWeaknesses.length > 0) {
                    const topList = topWeaknesses.slice(0, 2).map(w => `${w.name} (${w.count} ครั้ง)`).join(', ');
                    weaknessText = `มักถูกหักเรื่อง ${topList}`;
                    if (noDutyCount > 0) {
                        weaknessText += ` และไม่ปฏิบัติหน้าที่เวร ${noDutyCount} ครั้ง`;
                    }
                } else if (noDutyCount > 0) {
                    weaknessText = `ไม่ปฏิบัติหน้าที่เวร ${noDutyCount} ครั้ง`;
                }

                let strengthText = '-';
                if (rInsps.length > 0) {
                    if (perfectRoomCount === rInsps.length) {
                        strengthText = `ได้คะแนนห้องเรียนเต็ม 10 ทุกครั้งที่ตรวจ (${perfectRoomCount} ครั้ง)`;
                    } else if (topStrengths.length > 0) {
                        strengthText = `หมวดที่ทำได้ดีไม่เคยถูกหักเลย: ${topStrengths.join(', ')}`;
                    } else {
                        const leastFail = sortedFails[sortedFails.length - 1];
                        strengthText = `หมวดที่ดูแลได้ดีที่สุด: ${leastFail.name} (พลาดเพียง ${leastFail.count} ครั้ง)`;
                    }
                }

                let zoneTrendText = 'ยังไม่มีประวัติตรวจเขตพื้นที่';
                if (zInsps.length > 0) {
                    const statusCounts = {};
                    let zNoDuty = 0;
                    zInsps.forEach(z => {
                        const st = z.scores?.status || (z.totalScore === 10 ? 'ดีเยี่ยม' : z.totalScore === 8 ? 'ดี' : z.totalScore === 5 ? 'พอใช้' : z.totalScore === 2 ? 'ปรับปรุง' : 'ไม่ปฏิบัติหน้าที่');
                        statusCounts[st] = (statusCounts[st] || 0) + 1;
                        if (st === 'ไม่ปฏิบัติหน้าที่' || z.totalScore === -5) zNoDuty++;
                    });
                    const topZStatus = Object.entries(statusCounts).sort((a, b) => b[1] - a[1])[0];
                    zoneTrendText = `ส่วนใหญ่ได้ระดับ "${topZStatus[0]}" (${topZStatus[1]} จาก ${zInsps.length} ครั้ง)` + (zNoDuty > 0 ? ` • ขาดเวรเขต ${zNoDuty} ครั้ง` : '');
                }

                let adviceText = 'รักษามาตรฐานความสะอาดนี้ไว้ต่อไปได้เลย';
                if (topWeaknesses.length > 0) {
                    adviceText = `ควรกำชับเวรประจำวันให้เน้นตรวจเช็คเรื่อง "${topWeaknesses[0].name}" ก่อนออกจากห้องเรียน`;
                } else if (noDutyCount > 0) {
                    adviceText = 'ควรกำชับให้เวรประจำวันเข้าทำหน้าที่อย่างสม่ำเสมอเพื่อไม่ให้ติดลบคะแนน';
                }

                return {
                    hasData: true,
                    roomCheckedCount: rInsps.length,
                    zoneCheckedCount: zInsps.length,
                    perfectRoomCount,
                    noDutyCount,
                    weaknessText,
                    strengthText,
                    zoneTrendText,
                    adviceText
                };
            };

            const handleSendAiMessage = async (presetQuery = null) => {
                const queryText = String(presetQuery !== null ? presetQuery : aiChatInput).trim();
                if (!queryText || isAiTyping) return;

                const userMsg = { id: generateId('msg'), sender: 'user', text: queryText };
                setAiMessages(prev => [...prev, userMsg]);
                if (presetQuery === null) setAiChatInput('');
                setIsAiTyping(true);

                // หากสมองกลในระบบมีคำตอบที่ตรงประเด็นเป๊ะอยู่แล้ว ให้ตอบกลับทันทีอย่างรวดเร็วและแม่นยำ 100%
                const localReply = generateLocalSmartAiReply(queryText);
                if (localReply) {
                    setTimeout(() => {
                        setAiMessages(prev => [...prev, {
                            id: generateId('msg'),

                        }]);

                }

                const botName = (settings?.ai_bot_name || 'น้องสภาฯ').trim() || 'น้องสภาฯ';
                const activeApiKey = (settings?.gemini_api_key || DEFAULT_GEMINI_KEY).trim();
                const systemPrompt = `คุณชื่อ "${botName}" เป็นผู้ช่วยอัจฉริยะที่น่ารัก สุภาพ เป็นกันเอง และฉลาดมากของสภานักเรียนโรงเรียนคำม่วง อำเภอคำม่วง จังหวัดกาฬสินธุ์ แทนตัวเองว่า "${botName}" หรือ "ผม" ห้ามใช้อิโมจิโดยเด็ดขาด สามารถชวนคุยเล่น ตอบคำถามความรู้ทั่วไป ช่วยคิดงานสภานักเรียน และตอบคำถามเกี่ยวกับข้อมูลการตรวจความสะอาดของโรงเรียนตามข้อมูลจริงด้านล่างนี้ได้อย่างเป็นธรรมชาติ:\n\n${buildSystemContextForAi()}`;

                let aiText = null;

                // 1. ลองเรียกผ่าน Gemini API (รองรับทั้ง API Key ปกติ และ OAuth Token)
                const modelsToTry = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
                for (const modelName of modelsToTry) {
                    try {
                        const isOAuthToken = activeApiKey.startsWith('AQ.') || activeApiKey.startsWith('ya29.');
                        const apiUrl = isOAuthToken
                            ? `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`
                            : `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeApiKey}`;
                        const headers = { 'Content-Type': 'application/json' };
                        if (isOAuthToken) headers['Authorization'] = `Bearer ${activeApiKey}`;

                        const res = await fetch(apiUrl, {
                            method: 'POST',
                            headers,
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: queryText }] }],
                                systemInstruction: { parts: [{ text: systemPrompt }] }
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            const candidateText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                            if (candidateText) {
                                aiText = candidateText.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
                                break;
                            }
                        }
                    } catch (e) {}
                }

                // 2. หากคีย์ติดข้อจำกัด ให้สลับมาใช้ Cloud AI สำรองอัตโนมัติ เพื่อให้คุยโต้ตอบได้ทุกเรื่อง 100%
                if (!aiText) {
                    try {
                        const fallbackRes = await fetch('https://text.pollinations.ai/openai', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: 'openai',
                                messages: [
                                    { role: 'system', content: systemPrompt },
                                    { role: 'user', content: queryText }
                                ],
                                temperature: 0.7
                            })
                        });
                        if (fallbackRes.ok) {
                            const fbData = await fallbackRes.json();
                            const fbContent = fbData?.choices?.[0]?.message?.content;
                            if (fbContent) {
                                aiText = fbContent.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
                            }
                        }
                    } catch (e) {}
                }

                if (aiText) {
                    setAiMessages(prev => [...prev, {
                        id: generateId('msg'),
                        sender: 'bot',
                        text: aiText,
                        actions: []
                    }]);
                } else {
                    setAiMessages(prev => [...prev, {
                        id: generateId('msg'),
                        sender: 'bot',
                        text: [
                            `${botName}ขอสรุปข้อมูลด่วนในระบบตอนนี้ให้ก่อนนะครับ:`,
                            `• ความคืบหน้าวันนี้: ห้องเรียนตรวจแล้ว ${inspectProgress.roomDone}/${inspectProgress.roomTotal} ห้อง, เขตพื้นที่ ${inspectProgress.zoneDone}/${inspectProgress.zoneTotal} เขต`,
                            `• อันดับ 1 คะแนนสะสมสูงสุดตอนนี้: ${top5AllTime[0]?.room?.name || '-'} (${top5AllTime[0]?.score || 0} คะแนน)`,
                            `\nสามารถพิมพ์ชื่อห้อง เช่น "ม.1/1", "คิดคำนวณคะแนนยังไง", "ใครตรวจวันนี้" หรือกดปุ่มด้านบนได้เลยครับ!`
                        ].join('\n'),
                        actions: [
                            { label: 'ดูความคืบหน้าวันนี้', type: 'route', route: 'dashboard' },
                            { label: 'ดูตารางอันดับคะแนน', type: 'route', route: 'leaderboard' }
                        ]
                    }]);
                }
                setIsAiTyping(false);
            };

            const handleAiActionClick = (action) => {
                if (!action) return;
                if (action.type === 'open_map' && action.roomObj) {
                    handleOpenMapForSpecificRoom(action.roomObj, action.mapType || 'room');
                } else if (action.type === 'inspect_room' && action.roomObj) {
                    setIsAiChatOpen(false);
                    setCurrentRoute('inspect');
                        if (rPin?.note) lines.push(`• ตำแหน่งห้องเรียน: ${rPin.note}`);
                        if (zPin?.note && matchedRoom.hasZone !== false) lines.push(`• ตำแหน่งเขตพื้นที่: ${zPin.note}`);

                        const insight = getRoomAiInsight(matchedRoom.id, matchedRoom.name);
                        if (insight && insight.hasData) {
                            lines.push(`\nวิเคราะห์สถิติสะสมของห้อง ${matchedRoom.name} (ตรวจห้อง ${insight.roomCheckedCount} ครั้ง / เขต ${insight.zoneCheckedCount} ครั้ง):`);
                            lines.push(`• จุดแข็ง: ${insight.strengthText}`);
                            lines.push(`• จุดอ่อนที่ควรระวัง: ${insight.weaknessText}`);
                            if (matchedRoom.hasZone !== false) {
                                lines.push(`• แนวโน้มเขตพื้นที่: ${insight.zoneTrendText}`);
                            }
                            lines.push(`• คำแนะนำ: ${insight.adviceText}`);
                        }

                        return { text: lines.join('\n'), actions };
                    }
                }
            };

            const handleOpenMapForSpecificRoom = (roomObj, type) => {
                if (!roomObj) return;
                setMapZoom(1);
                setMapPan({ x: 0, y: 0 });
                setMapSearchQuery('');
                setIsAdminPinMode(false);
                if (type === 'room') {
                    setShowZoneMap(false);
                    setShowRoomMap(true);
                } else {
                    setShowRoomMap(false);
                    setShowZoneMap(true);
                }
                setTimeout(() => {
                    handleFocusRoomOnMap(roomObj, type);
                }, 80);
            };

            const currentMapType = showRoomMap ? 'room' : 'zone';

            const clampMapPan = (panX, panY, zoomLevel) => {
                if (zoomLevel <= 1) return { x: 0, y: 0 };
                const container = mapContainerRef.current;
                if (!container) return { x: panX, y: panY };
                const rect = container.getBoundingClientRect();
                const maxX = Math.max(0, ((zoomLevel - 1) * rect.width) / 2);
                const maxY = Math.max(0, ((zoomLevel - 1) * rect.height) / 2);
                return {
                    x: Math.max(-maxX, Math.min(maxX, panX)),
                    y: Math.max(-maxY, Math.min(maxY, panY))
                };
            };

            const handleFocusRoomOnMap = (roomObj, forcedType = null) => {
                if (!roomObj) return;
                const targetMapType = forcedType || currentMapType;
                setSelectedMapRoomId(roomObj.id);
                const matchGrade = (roomObj.name || '').match(/(\d+)/);
                if (matchGrade && mapGradeFilter !== 'all') {
                    setMapGradeFilter(matchGrade[1]);
                }

                const existingPin = mapPinsData?.[targetMapType]?.[roomObj.id];
                if (isAdminPinMode) {
                    setPinTargetRoomId(roomObj.id);
                    setPinNoteInput(existingPin?.note || '');
                }

                setIsAiSearchingMap(true);
                setTimeout(() => {
                    setIsAiSearchingMap(false);
                    const pinInfo = mapPinsData?.[targetMapType]?.[roomObj.id];
                    if (pinInfo && typeof pinInfo.x === 'number' && typeof pinInfo.y === 'number') {
                        const container = mapContainerRef.current;
                        const targetZoom = 1.85;
                        setMapZoom(targetZoom);
                        if (container) {
                            const rect = container.getBoundingClientRect();
                            const rawOffsetX = ((50 - pinInfo.x) / 100) * rect.width * targetZoom;
                            const rawOffsetY = ((50 - pinInfo.y) / 100) * rect.height * targetZoom;
                            setMapPan(clampMapPan(rawOffsetX, rawOffsetY, targetZoom));
                        }
                    } else {
                        setMapZoom(1);
                        setMapPan({ x: 0, y: 0 });
                    }
                }, 180);
            };

            const handleMapPinClick = async (e) => {
                if (!isAdminPinMode || appMode !== 'admin') return;
                if (!pinTargetRoomId) {
                    showToast('กรุณาเลือกห้องที่ต้องการปักหมุดก่อนครับ', 'warning');
                    return;
                }
                const wrapper = mapImgWrapperRef.current;
                if (!wrapper) return;
                const rect = wrapper.getBoundingClientRect();
                const xPct = Math.max(2, Math.min(98, +(((e.clientX - rect.left) / rect.width) * 100).toFixed(2)));
                const yPct = Math.max(2, Math.min(98, +(((e.clientY - rect.top) / rect.height) * 100).toFixed(2)));

                const nextPins = {
                    ...mapPinsData,
                    [currentMapType]: {
                        ...(mapPinsData[currentMapType] || {}),
                        [pinTargetRoomId]: {
                            x: xPct,
                            y: yPct,
                            note: pinNoteInput.trim() || ''
                        }
                    }
                };
                setMapPinsData(nextPins);
                setSelectedMapRoomId(pinTargetRoomId);
                const jsonStr = JSON.stringify(nextPins);
                setSettings(prev => ({ ...prev, map_pins_json: jsonStr }));
                try {
                    await syncToGASAsync('updateSettings', { key: 'map_pins_json', val: jsonStr });
                    const rName = rooms.find(r => r.id === pinTargetRoomId)?.name || '';
                    showToast(`ปักหมุดและบันทึกคำอธิบายของห้อง ${rName} สำเร็จ!`, 'success');
                } catch (err) {
                    showToast('บันทึกพิกัดลงเครื่องแล้ว (แต่ซิงค์ออนไลน์ไม่สำเร็จ)', 'warning');
                }
            };

            const handleSavePinNoteOnly = async () => {
                if (!pinTargetRoomId) {
                    showToast('กรุณาเลือกห้องก่อนครับ', 'warning');
                    return;
                }
                const currentPin = mapPinsData?.[currentMapType]?.[pinTargetRoomId];
                const nextPins = {
                    ...mapPinsData,
                    [currentMapType]: {
                        ...(mapPinsData[currentMapType] || {}),
                        [pinTargetRoomId]: {
                            x: currentPin && typeof currentPin.x === 'number' ? currentPin.x : 50,
                            y: currentPin && typeof currentPin.y === 'number' ? currentPin.y : 50,
                            note: pinNoteInput.trim() || ''
                        }
                    }
                };
                setMapPinsData(nextPins);
                setSelectedMapRoomId(pinTargetRoomId);
                const jsonStr = JSON.stringify(nextPins);
                setSettings(prev => ({ ...prev, map_pins_json: jsonStr }));
                try {
                    await syncToGASAsync('updateSettings', { key: 'map_pins_json', val: jsonStr });
                    const rName = rooms.find(r => r.id === pinTargetRoomId)?.name || '';
                    showToast(`บันทึกคำอธิบายของห้อง ${rName} สำเร็จ!`, 'success');
                } catch (err) {
                    showToast('บันทึกคำอธิบายลงเครื่องเรียบร้อยแล้ว', 'info');
                }
            };

            const handleRemoveRoomPin = async (roomId) => {
                if (!roomId) return;
                const nextTypePins = { ...(mapPinsData[currentMapType] || {}) };
                delete nextTypePins[roomId];
                const nextPins = { ...mapPinsData, [currentMapType]: nextTypePins };
                setMapPinsData(nextPins);
                const jsonStr = JSON.stringify(nextPins);
                setSettings(prev => ({ ...prev, map_pins_json: jsonStr }));
                try {
                    await syncToGASAsync('updateSettings', { key: 'map_pins_json', val: jsonStr });
                    showToast('ลบหมุดพิกัดเรียบร้อยแล้ว', 'success');
                } catch (err) {
                    showToast('ลบหมุดในเครื่องเรียบร้อยแล้ว', 'info');
                }
            };

            const handleMapZoomIn = () => {
                setMapZoom(prev => {
                    const next = Math.min(3.5, +(prev + 0.4).toFixed(2));
                    setMapPan(p => clampMapPan(p.x, p.y, next));
                    return next;
                });
            };

            const handleMapZoomOut = () => {
                setMapZoom(prev => {
                    const next = Math.max(1, +(prev - 0.4).toFixed(2));
                    if (next === 1) setMapPan({ x: 0, y: 0 });
                    else setMapPan(p => clampMapPan(p.x, p.y, next));
                    return next;
                });
            };

            const handleMapReset = () => {
                setMapZoom(1);
                setMapPan({ x: 0, y: 0 });
            };

            const handleMapTouchStart = (e) => {
                if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    mapTouchStateRef.current.initialPinchDist = Math.hypot(dx, dy);
                    mapTouchStateRef.current.initialZoom = mapZoom;
                    mapTouchStateRef.current.isDragging = false;
                } else if (e.touches.length === 1) {
                    const now = Date.now();
                    if (now - mapTouchStateRef.current.lastTap < 280) {
                        if (mapZoom > 1) {
                            setMapZoom(1);
                            setMapPan({ x: 0, y: 0 });
                        } else {
                            setMapZoom(1.85);
                            setMapPan({ x: 0, y: 0 });
                        }
                        mapTouchStateRef.current.lastTap = 0;
                        return;
                    }
                    mapTouchStateRef.current.lastTap = now;
                    if (mapZoom > 1) {
                        mapTouchStateRef.current.isDragging = true;
                        mapTouchStateRef.current.startX = e.touches[0].clientX - mapPan.x;
                        mapTouchStateRef.current.startY = e.touches[0].clientY - mapPan.y;
                    }
                }
            };

            const handleMapTouchMove = (e) => {
                if (e.touches.length === 2 && mapTouchStateRef.current.initialPinchDist) {
                    if (e.cancelable) e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.hypot(dx, dy);
                    const scaleFactor = dist / mapTouchStateRef.current.initialPinchDist;
                    const nextZoom = Math.max(1, Math.min(3.5, +(mapTouchStateRef.current.initialZoom * scaleFactor).toFixed(2)));
                    setMapZoom(nextZoom);
                    if (nextZoom === 1) setMapPan({ x: 0, y: 0 });
                    else setMapPan(p => clampMapPan(p.x, p.y, nextZoom));
                } else if (e.touches.length === 1 && mapTouchStateRef.current.isDragging && mapZoom > 1) {
                    if (e.cancelable) e.preventDefault();
                    const nextX = e.touches[0].clientX - mapTouchStateRef.current.startX;
                    const nextY = e.touches[0].clientY - mapTouchStateRef.current.startY;
                    setMapPan(clampMapPan(nextX, nextY, mapZoom));
                }
            };

            const handleMapTouchEnd = () => {
                mapTouchStateRef.current.isDragging = false;
                mapTouchStateRef.current.initialPinchDist = null;
            };

            const handleMapMouseDown = (e) => {
                if (mapZoom <= 1) return;
                e.preventDefault();
                mapTouchStateRef.current.isDragging = true;
                mapTouchStateRef.current.startX = e.clientX - mapPan.x;
                mapTouchStateRef.current.startY = e.clientY - mapPan.y;
            };

            const handleMapMouseMove = (e) => {
                if (!mapTouchStateRef.current.isDragging || mapZoom <= 1) return;
                e.preventDefault();
                const nextX = e.clientX - mapTouchStateRef.current.startX;
                const nextY = e.clientY - mapTouchStateRef.current.startY;
                setMapPan(clampMapPan(nextX, nextY, mapZoom));
            };

            const handleMapMouseUp = () => {
                mapTouchStateRef.current.isDragging = false;
            };

            const handleMapWheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.25 : -0.25;
                setMapZoom(prev => {
                    const next = Math.max(1, Math.min(3.5, +(prev + delta).toFixed(2)));
                    if (next === 1) setMapPan({ x: 0, y: 0 });
                    else setMapPan(p => clampMapPan(p.x, p.y, next));
                    return next;
                });
            };

            const canViewBanner = (visibilitySetting) => {

                    return {
                        x: (e.touches[0].clientX - rect.left) * scaleX,
                        y: (e.touches[0].clientY - rect.top) * scaleY

                const reader = new FileReader();

                            let width = img.width; let height = img.height;
                            
                            if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                            else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                            
                            canvas.width = width; canvas.height = height;

                            const roomName = inspectModal.room ? (inspectModal.room.name || '').replace('ม.', '') : 'ไม่ระบุ';
                            const now = new Date();
                            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

                            const text1 = `ห้อง: ม.${roomName}`;

                            ctx.font = "bold 36px 'Noto Sans Thai', sans-serif";
                            const text1Width = ctx.measureText(text1).width;
                            ctx.font = "24px 'Noto Sans Thai', sans-serif";
                            const text2Width = ctx.measureText(text2).width;
                            
                            const padding = 20;
                            const boxWidth = Math.max(text1Width, text2Width) + (padding * 2);
                            const boxHeight = 110; 
                            
                            const boxX = 20; const boxY = height - boxHeight - 20;

                            ctx.fillStyle = "rgba(200, 16, 46, 0.75)";
                            ctx.beginPath();
                            if(ctx.roundRect) ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 14);

                        } finally {

            const handleResetTodayInspection = (roomId, roomName) => {
                const targetDateStr = filterDate || new Date().toISOString().split('T')[0];
                const cleanRoom = (roomName || '').replace('ม.', '');
                showConfirm(`ต้องการลบผลตรวจ [ทั้งหมด (ทั้งห้องเรียนและเขตพื้นที่)] ของห้อง ม.${cleanRoom}\nประจำวันที่ ${formatDateObj(targetDateStr)} ใช่หรือไม่?`, async () => {

                    return matchGroup && matchSearch;
                });
            }, [rooms, guestFilterGroup, guestSearch]);

            const calculateRanking = (data, mode) => {
                const usePercentageSort = (mode === 'leaderboard') && (appMode !== 'guest') && (exportSortOrder !== 'raw_score');

                data.sort((a, b) => {
                    if (mode === 'leaderboard') {
                        if (usePercentageSort) {
                            const pctA = parseFloat(a.percentage) || 0;
                            const pctB = parseFloat(b.percentage) || 0;
                            if (Math.abs(pctB - pctA) > 0.0001) return pctB - pctA;
                        }
                        if (b.score !== a.score) return b.score - a.score;
                        const pctA = parseFloat(a.percentage) || 0;
                        const pctB = parseFloat(b.percentage) || 0;
                        if (Math.abs(pctB - pctA) > 0.0001) return pctB - pctA;
                        return a.originalIndex - b.originalIndex;
                    }
                    let scoreA = ((a.roomInsp?.totalScore || 0) + (a.zoneInsp?.totalScore || 0));
                    let scoreB = ((b.roomInsp?.totalScore || 0) + (b.zoneInsp?.totalScore || 0));
                    if (scoreB !== scoreA) return scoreB - scoreA;
                    return a.originalIndex - b.originalIndex; 
                });

                if (mode === 'leaderboard') {
                    for (let i = 0; i < data.length; i++) {
                        const isTie = usePercentageSort

                            : (i > 0 && data[i].score === data[i-1].score);
                        if (isTie) { 
                            data[i].trueRank = data[i-1].trueRank; 
                        } else { 
                            data[i].trueRank = i + 1; 
                        }
                    }
                } else {
                    for (let i = 0; i < data.length; i++) {
                        let currentScore = (data[i].roomInsp?.totalScore || 0) + (data[i].zoneInsp?.totalScore || 0);
                        let prevScore = i > 0 ? ((data[i-1].roomInsp?.totalScore || 0) + (data[i-1].zoneInsp?.totalScore || 0)) : null;
                        if (i > 0 && currentScore === prevScore) { data[i].trueRank = data[i-1].trueRank; } 
                        else { data[i].trueRank = i + 1; }
                    }
                }

                if (exportSortOrder === 'room') { data.sort((a, b) => a.originalIndex - b.originalIndex); }
                return data;

            const mergedHistoryData = useMemo(() => {

                const targetDate = dateMode === 'today' ? todayStr : filterDate;

                const data = filteredRooms.map(room => {
                    const dayInspections = validInspections.filter(i => i.roomId === room.id && i.date && String(i.date).startsWith(targetDate));

                const monthlyDayMap = {};

                validInspections.forEach(insp => {

                        stats[dayRecord.roomId].maxRoomScore += 10;
                        stats[dayRecord.roomId].maxScore += 10;

                        stats[dayRecord.roomId].zoneScore += s;
                        stats[dayRecord.roomId].maxZoneScore += 10;
                        stats[dayRecord.roomId].maxScore += 10;

                    let medal = '';

                    return { ...item, percentage: pct.toFixed(2), medal };

                        });

                    const entry = teamMap.get(teamKey);
                    if (insp.inspectorSignature && !entry.signatureUrl) {
                        entry.signatureUrl = insp.inspectorSignature;
                    }
                    if (insp.date && (!entry.latestTime || insp.date > entry.latestTime)) {
                        entry.latestTime = insp.date;
                    }
                    const rName = roomNameMap[insp.roomId] || insp.roomId;
                    if (insp.type === 'room') entry.checkedRooms.add(rName);
                    if (insp.type === 'zone') entry.checkedZones.add(rName);
                });

                const teams = Array.from(teamMap.values()).map(t => ({
                    ...t,
                    roomList: Array.from(t.checkedRooms),
                    zoneList: Array.from(t.checkedZones)
                }));

                const uniquePersonSet = new Set();
                teams.forEach(t => t.allMembers.forEach(m => uniquePersonSet.add(m)));

                return {
                    dateStr: targetDateStr,
                    totalUniqueInspectors: uniquePersonSet.size,
                    teams
                };
            }, [inspections, rooms, currentRoute, dateMode, filterDate]);

            const handleOpenOmrScanner = () => {
                const initType = paperSheetTypeFilter || 'both';
                const initGrade = paperSheetGradeFilter || 'all';
                const initCustom = Array.isArray(paperCustomRoomIds) && paperCustomRoomIds.length > 0 ? [...paperCustomRoomIds] : (Array.isArray(rooms) ? rooms.map(r => r.id) : []);
                const initialResults = buildOmrInitialResults(initType, initGrade, initCustom);
                omrRawImageRef.current = null;
                setOmrCorners(null);
                setDraggingOmrCorner(null);
                setOmrScannerModal({
                    isOpen: true,
                    isScanning: false,
                    imagePreview: null,
                    annotatedPreview: null,
                    sensitivity: 50,
                    scanTypeFilter: initType,
                    scanGradeFilter: initGrade,
                    scanCustomRoomIds: initCustom,
                    showRoomPicker: false,
                    onlySaveMarked: true,
                    results: initialResults
                });
            };

            const handleUpdateOmrFilterConfig = (nextType, nextGrade, nextCustomIds) => {
                const rebuilt = buildOmrInitialResults(nextType, nextGrade, nextCustomIds);
                setOmrScannerModal(prev => ({
                    ...prev,
                    scanTypeFilter: nextType,
                    scanGradeFilter: nextGrade,
                    scanCustomRoomIds: nextCustomIds,
                    results: rebuilt
                }));
                if (omrRawImageRef.current) {
                    setTimeout(() => {
                        processOmrImageWithSensitivity(omrRawImageRef.current, omrScannerModal.sensitivity, nextType, nextGrade, nextCustomIds, omrCorners);
                    }, 60);
                }
            };

            const processOmrImageWithSensitivity = (imgElement, sensValue = 50, overrideType = null, overrideGrade = null, overrideCustomIds = null, customCorners = null) => {
                if (!imgElement) return;
                try {
                    const activeType = overrideType ?? omrScannerModal.scanTypeFilter ?? 'both';
                    const activeGrade = overrideGrade ?? omrScannerModal.scanGradeFilter ?? 'all';
                    const activeCustomIds = overrideCustomIds ?? omrScannerModal.scanCustomRoomIds ?? [];

                    const W = 1122;
                    const H = 793;
                    const canvas = document.createElement('canvas');
                    canvas.width = W;
                    canvas.height = H;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(imgElement, 0, 0, W, H);
                    const imgData = ctx.getImageData(0, 0, W, H).data;

                    const getPixelDarkness = (x, y) => {
                        const px = Math.max(0, Math.min(W - 1, Math.round(x)));
                        const py = Math.max(0, Math.min(H - 1, Math.round(y)));
                        const idx = (py * W + px) * 4;
                        const r = imgData[idx];
                        const g = imgData[idx + 1];
                        const b = imgData[idx + 2];
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        const colorSpread = Math.max(r, g, b) - Math.min(r, g, b);
                        return Math.min(255, (255 - lum) + (colorSpread * 0.65));
                    };

                    const findFiducialCornerMark = (startX, endX, startY, endY, defaultX, defaultY) => {
                        let bestX = defaultX;
                        let bestY = defaultY;
                        let bestScore = -1;
                        const step = 2;
                        for (let y = startY; y <= endY; y += step) {
                            for (let x = startX; x <= endX; x += step) {
                                let centerSum = 0;
                                let centerCnt = 0;
                                for (let dy = -4; dy <= 4; dy += 2) {
                                    for (let dx = -4; dx <= 4; dx += 2) {
                                        centerSum += getPixelDarkness(x + dx, y + dy);
                                        centerCnt++;
                                    }
                                }
                                const centerDarkness = centerSum / centerCnt;
                                if (centerDarkness < 120) continue;

                                let ringSum = 0;
                                let ringCnt = 0;
                                const ringOffsets = [
                                    [-13, -13], [0, -13], [13, -13],
                                    [-13, 0],             [13, 0],
                                    [-13, 13],  [0, 13],  [13, 13]
                                ];
                                for (let k = 0; k < ringOffsets.length; k++) {
                                    ringSum += getPixelDarkness(x + ringOffsets[k][0], y + ringOffsets[k][1]);
                                    ringCnt++;
                                }
                                const ringDarkness = ringSum / ringCnt;
                                const contrastScore = centerDarkness - ringDarkness;

                                if (ringDarkness < 75 && contrastScore > bestScore) {
                                    bestScore = contrastScore;
                                    bestX = x;
                                    bestY = y;
                                }
                            }
                        }
                        if (bestScore < 80) return { x: defaultX, y: defaultY, found: false };
                        return { x: bestX, y: bestY, found: true };
                    };

                    let tl, tr, bl, br;
                    if (customCorners && customCorners.tl && customCorners.tr && customCorners.bl && customCorners.br) {
                        tl = { ...customCorners.tl, found: true };
                        tr = { ...customCorners.tr, found: true };
                        bl = { ...customCorners.bl, found: true };
                        br = { ...customCorners.br, found: true };
                    } else {
                        tl = findFiducialCornerMark(15, Math.floor(W * 0.18), 10, Math.floor(H * 0.18), 43, 23);
                        tr = findFiducialCornerMark(Math.floor(W * 0.82), W - 15, 10, Math.floor(H * 0.18), W - 43, 23);
                        bl = findFiducialCornerMark(15, Math.floor(W * 0.18), Math.floor(H * 0.75), H - 10, 43, H - 27);
                        br = findFiducialCornerMark(Math.floor(W * 0.82), W - 15, Math.floor(H * 0.75), H - 10, W - 43, H - 27);

                        if (!tl.found && bl.found) { tl.x = bl.x; tl.y = Math.max(18, bl.y - 742); }
                        if (!tr.found && br.found) { tr.x = br.x; tr.y = Math.max(18, br.y - 742); }
                        setOmrCorners({ tl, tr, bl, br });
                    }

                    const mapUV = (u, v) => {
                        const topX = tl.x + u * (tr.x - tl.x);
                        const topY = tl.y + u * (tr.y - tl.y);
                        const botX = bl.x + u * (br.x - bl.x);
                        const botY = bl.y + u * (br.y - bl.y);
                        return {
                            x: topX + v * (botX - topX),
                            y: topY + v * (botY - topY)
                        };
                    };

                    const evaluateBubbleScore = (cx, cy) => {
                        let bgSamples = [];
                        for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                            bgSamples.push(getPixelDarkness(cx + Math.cos(angle) * 8.5, cy + Math.sin(angle) * 8.5));
                        }
                        bgSamples.sort((a, b) => a - b);
                        const localBg = bgSamples[2] || 10;

                        let innerSum = 0;
                        let innerCount = 0;
                        let heavyInkPixels = 0;
                        for (let dy = -4; dy <= 4; dy++) {
                            for (let dx = -4; dx <= 4; dx++) {
                                if (dx * dx + dy * dy <= 20) {
                                    const netDark = Math.max(0, getPixelDarkness(cx + dx, cy + dy) - localBg);
                                    innerSum += netDark;
                                    innerCount++;
                                    if (netDark > 65) heavyInkPixels++;
                                }
                            }
                        }
                        const avgNetDarkness = innerCount > 0 ? innerSum / innerCount : 0;
                        const inkCoveragePct = innerCount > 0 ? (heavyInkPixels / innerCount) * 100 : 0;
                        return (avgNetDarkness * 0.45) + (inkCoveragePct * 0.85);
                    };

                    // วาดเส้นกรอบเชื่อมจุดมาร์คทั้ง 4 มุมและปุ่มลากให้เห็นชัดเจนบนภาพสแกน
                    ctx.save();
                    ctx.strokeStyle = 'rgba(16, 185, 129, 0.7)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath();
                    ctx.moveTo(tl.x, tl.y);
                    ctx.lineTo(tr.x, tr.y);
                    ctx.lineTo(br.x, br.y);
                    ctx.lineTo(bl.x, bl.y);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.restore();

                    [
                        { pt: tl, label: 'TL' },
                        { pt: tr, label: 'TR' },
                        { pt: bl, label: 'BL' },
                        { pt: br, label: 'BR' }
                    ].forEach(({ pt, label }) => {
                        ctx.strokeStyle = pt.found ? '#10b981' : '#f59e0b';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(pt.x - 13, pt.y - 13, 26, 26);
                        ctx.beginPath();
                        ctx.moveTo(pt.x - 18, pt.y); ctx.lineTo(pt.x + 18, pt.y);
                        ctx.moveTo(pt.x, pt.y - 18); ctx.lineTo(pt.x, pt.y + 18);
                        ctx.stroke();
                        ctx.fillStyle = pt.found ? '#059669' : '#d97706';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.fillText(label, pt.x + 15, pt.y + 4);
                    });

                    const validRooms = Array.isArray(rooms) ? rooms : [];
                    const targetRooms = validRooms.filter(r => {
                        if (activeType === 'zone' && r.hasZone === false) return false;
                        if (activeGrade === 'custom') return activeCustomIds.includes(r.id);
                        if (activeGrade !== 'all') {
                            const match = (r.name || '').match(/(\d+)/);
                            return match && match[1] === activeGrade;
                        }
                        return true;
                    });

                    const half = Math.ceil(Math.max(targetRooms.length, 1) / 2);

                    // คอลัมน์: ที่ (6%) + ห้อง (13%) = 19% (หลังตัดวงเล็บ ม.4/6 ออก ทำให้ช่องห้องกระชับขึ้น)
                    // หมวดห้องเรียน 8 ช่อง (เต็ม, โต๊ะ, ขยะ, ไฟ, พื้น, บอร์ด, ไม่ทำ, ข้าม) = 46%
                    // หมวดเขตพื้นที่ 6 ช่อง (ดีเยี่ยม, ดี, พอใช้, ปรับปรุง, ไม่ทำ, ข้าม) = 35%
                    let colRelativeCenters = [];
                    if (activeType === 'both') {
                        const roomCols = Array.from({ length: 8 }, (_, idx) => 0.19 + ((idx + 0.5) * (0.46 / 8)));
                        const zoneCols = Array.from({ length: 6 }, (_, idx) => 0.65 + ((idx + 0.5) * (0.35 / 6)));
                        colRelativeCenters = [...roomCols, ...zoneCols];
                    } else if (activeType === 'room') {
                        colRelativeCenters = Array.from({ length: 8 }, (_, idx) => 0.19 + ((idx + 0.5) * (0.81 / 8)));
                    } else {
                        colRelativeCenters = Array.from({ length: 6 }, (_, idx) => 0.19 + ((idx + 0.5) * (0.81 / 6)));
                    }

                    const markThreshold = Math.max(22, 54 - (sensValue * 0.48));
                    const tableTopV = 0.1552;
                    const rowStepV = 0.02142;

                    const scannedResults = targetRooms.map((r, i) => {
                        const isRightCol = i >= half;
                        const rowIdx = isRightCol ? (i - half) : i;
                        const vRow = tableTopV + ((rowIdx + 0.5) * rowStepV);

                        const uTableLeft = isRightCol ? 0.505 : -0.006;
                        const uTableWidth = 0.501;

                        const bubbleScores = colRelativeCenters.map(colRel => {
                            const uBubble = uTableLeft + (colRel * uTableWidth);
                            const pt = mapUV(uBubble, vRow);
                            const score = evaluateBubbleScore(pt.x, pt.y);
                            return { x: pt.x, y: pt.y, score };
                        });

                        let roomBubbles = [];
                        let zoneBubbles = [];
                        if (activeType === 'both') {
                            roomBubbles = bubbleScores.slice(0, 8);
                            zoneBubbles = bubbleScores.slice(8, 14);
                        } else if (activeType === 'room') {
                            roomBubbles = bubbleScores;
                        } else {
                            zoneBubbles = bubbleScores;
                        }

                        // [0]=เต็ม(10), [1]=โต๊ะ, [2]=ขยะ, [3]=ไฟ, [4]=พื้น, [5]=บอร์ด, [6]=ไม่ทำ(-5), [7]=ข้าม(-)
                        let full = false, c1 = 2, c2 = 2, c3 = 2, c4 = 2, c5 = 2, noDuty = false, skip = false;
                        let anyRoomMarked = false;
                        if (roomBubbles.length > 0) {
                            const markedRoom = roomBubbles.map(b => b.score >= markThreshold);
                            anyRoomMarked = markedRoom.some(Boolean);
                            if (anyRoomMarked) {
                                if (markedRoom[7]) {
                                    skip = true;
                                } else if (markedRoom[6]) {
                                    noDuty = true;
                                } else {
                                    full = markedRoom[0];
                                    c1 = markedRoom[1] ? 0 : 2;
                                    c2 = markedRoom[2] ? 0 : 2;
                                    c3 = markedRoom[3] ? 0 : 2;
                                    c4 = markedRoom[4] ? 0 : 2;
                                    c5 = markedRoom[5] ? 0 : 2;
                                }
                            }
                            roomBubbles.forEach((b, bIdx) => {
                                const isHit = markedRoom[bIdx];
                                ctx.beginPath();
                                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                                ctx.strokeStyle = isHit ? (bIdx === 0 ? '#10b981' : (bIdx === 7 ? '#6b7280' : '#ef4444')) : 'rgba(59, 130, 246, 0.35)';
                                ctx.lineWidth = isHit ? 2.2 : 1;
                                ctx.stroke();
                            });
                        }

                        const zoneValues = [10, 8, 5, 2, -5, null];
                        let zScore = null;
                        let zSkip = false;
                        let anyZoneMarked = false;
                        if (zoneBubbles.length > 0 && r.hasZone !== false) {
                            let maxZVal = -1;
                            let maxZIdx = -1;
                            zoneBubbles.forEach((b, idx) => {
                                if (b.score > maxZVal) {
                                    maxZVal = b.score;
                                    maxZIdx = idx;
                                }
                            });
                            if (maxZVal >= markThreshold && maxZIdx !== -1) {
                                anyZoneMarked = true;
                                if (zoneValues[maxZIdx] === null) zSkip = true;
                                else zScore = zoneValues[maxZIdx];
                            } else {
                                maxZIdx = -1;
                            }

                            zoneBubbles.forEach((b, bIdx) => {
                                const isHit = bIdx === maxZIdx;
                                ctx.beginPath();
                                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                                ctx.strokeStyle = isHit ? '#d946ef' : 'rgba(217, 70, 239, 0.35)';
                                ctx.lineWidth = isHit ? 2.2 : 1;
                                ctx.stroke();
                            });
                        }

                        const hasAnyMark = anyRoomMarked || anyZoneMarked;

                        return {
                            room: r,
                            index: i + 1,
                            selectedForSave: hasAnyMark,
                            hasDetectedMark: hasAnyMark,
                            includeRoom: (activeType === 'both' || activeType === 'room') && anyRoomMarked,
                            includeZone: (activeType === 'both' || activeType === 'zone') && r.hasZone !== false && anyZoneMarked,
                            roomScores: { full, c1, c2, c3, c4, c5, noDuty, skip },
                            zoneScore: zScore,
                            zoneSkip: zSkip
                        };
                    });

                    const annotatedUrl = canvas.toDataURL('image/jpeg', 0.88);
                    setOmrScannerModal(prev => ({
                        ...prev,
                        isScanning: false,
                        annotatedPreview: annotatedUrl,
                        results: scannedResults
                    }));
                    if (omrZoomPreviewUrl) {
                        setOmrZoomPreviewUrl(annotatedUrl);
                    }
                } catch (err) {
                    setOmrScannerModal(prev => ({ ...prev, isScanning: false }));
                    showToast('อ่านภาพเสร็จสิ้น กรุณาตรวจสอบคะแนนด้านล่าง', 'info');
                }
            };

            // ฟังก์ชันคำนวณพิกัดและลากจุดมาร์ค 4 มุม (TL, TR, BL, BR) ด้วยนิ้วหรือเมาส์
            const getImageRelativeCoords = (e, imgEl) => {
                if (!imgEl) return null;
                const rect = imgEl.getBoundingClientRect();
                if (!rect.width || !rect.height) return null;
                const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
                const x = Math.max(8, Math.min(1114, ((clientX - rect.left) / rect.width) * 1122));
                const y = Math.max(8, Math.min(785, ((clientY - rect.top) / rect.height) * 793));
                return { x, y };
            };

            const handleStartDragOmrCorner = (e, imgEl, forcedCornerKey = null) => {
                if (!omrCorners || !imgEl) return;
                if (forcedCornerKey) {
                    if (e.cancelable) e.preventDefault();
                    e.stopPropagation();
                    setDraggingOmrCorner(forcedCornerKey);
                    return;
                }
                const pt = getImageRelativeCoords(e, imgEl);
                if (!pt) return;
                let nearestKey = null;
                let minDist = 80;
                ['tl', 'tr', 'bl', 'br'].forEach(key => {
                    const c = omrCorners[key];
                    if (c) {
                        const d = Math.hypot(pt.x - c.x, pt.y - c.y);
                        if (d < minDist) {
                            minDist = d;
                            nearestKey = key;
                        }
                    }
                });
                if (nearestKey) {
                    if (e.cancelable) e.preventDefault();
                    setDraggingOmrCorner(nearestKey);
                }
            };

            const handleMoveDragOmrCorner = (e, imgEl) => {
                if (!draggingOmrCorner || !omrCorners || !imgEl) return;
                if (e.cancelable) e.preventDefault();
                const pt = getImageRelativeCoords(e, imgEl);
                if (!pt) return;
                const nextCorners = {
                    ...omrCorners,
                    [draggingOmrCorner]: { x: pt.x, y: pt.y, found: true }
                };
                setOmrCorners(nextCorners);
                if (omrRawImageRef.current) {
                    processOmrImageWithSensitivity(
                        omrRawImageRef.current,
                        omrScannerModal.sensitivity,
                        omrScannerModal.scanTypeFilter,
                        omrScannerModal.scanGradeFilter,
                        omrScannerModal.scanCustomRoomIds,
                        nextCorners
                    );
                }
            };

            const handleEndDragOmrCorner = () => {
                if (draggingOmrCorner) {
                    setDraggingOmrCorner(null);
                }
            };

            const handleResetOmrAutoCorners = () => {
                setOmrCorners(null);
                if (omrRawImageRef.current) {
                    processOmrImageWithSensitivity(
                        omrRawImageRef.current,
                        omrScannerModal.sensitivity,
                        omrScannerModal.scanTypeFilter,
                        omrScannerModal.scanGradeFilter,
                        omrScannerModal.scanCustomRoomIds,
                        null
                    );
                    showToast('รีเซ็ตจุดมาร์ค 4 มุมอัตโนมัติเรียบร้อย', 'info');
                }
            };

            const handleOmrImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const dataUrl = ev.target.result;
                    setOmrCorners(null);
                    setOmrScannerModal(prev => ({ ...prev, isScanning: true, imagePreview: dataUrl }));
                    showToast('กำลังค้นหาจุดมาร์ค 4 มุมและอ่านค่าวงกลม...', 'info');

                    const img = new Image();
                    img.onload = () => {
                        omrRawImageRef.current = img;
                        setTimeout(() => {
                            processOmrImageWithSensitivity(img, omrScannerModal.sensitivity, null, null, null, null);
                            showToast('สแกนเสร็จสิ้น! หากมุมไม่ตรงสามารถใช้นิ้วแตะลากจุดมุมสีเขียว TL, TR, BL, BR ได้เลย', 'success');
                        }, 300);
                    };
                    img.src = dataUrl;
                };
                reader.readAsDataURL(file);
            };

            const toggleOmrResultCriterion = (roomId, key) => {
                setOmrScannerModal(prev => ({
                    ...prev,
                    results: prev.results.map(item => {
                        if (item.room.id !== roomId) return item;
                        const rs = { ...item.roomScores };
                        if (key === 'full') {
                            rs.full = true;
                            rs.skip = false;
                            rs.noDuty = false;
                            rs.c1 = 2; rs.c2 = 2; rs.c3 = 2; rs.c4 = 2; rs.c5 = 2;
                        } else if (key === 'skip') {
                            rs.skip = !rs.skip;
                            if (rs.skip) { rs.noDuty = false; rs.full = false; }
                        } else if (key === 'noDuty') {
                            rs.noDuty = !rs.noDuty;
                            if (rs.noDuty) { rs.skip = false; rs.full = false; }
                        } else {
                            rs.skip = false;
                            rs.noDuty = false;
                            rs.full = false;
                            rs[key] = rs[key] === 2 ? 0 : 2;
                        }
                        return { ...item, hasDetectedMark: true, selectedForSave: true, includeRoom: true, roomScores: rs };
                    })
                }));
            };

            const setOmrResultZone = (roomId, val) => {
                setOmrScannerModal(prev => ({
                    ...prev,
                    results: prev.results.map(item => {
                        if (item.room.id !== roomId) return item;
                        if (val === 'skip') {
                            const nextSkip = !item.zoneSkip;
                            return { ...item, zoneSkip: nextSkip, zoneScore: null, hasDetectedMark: true, selectedForSave: true, includeZone: nextSkip };
                        }
                        if (!item.zoneSkip && item.zoneScore === val && item.includeZone) {
                            return { ...item, zoneSkip: false, zoneScore: null, includeZone: false };
                        }
                        return { ...item, zoneSkip: false, zoneScore: val, hasDetectedMark: true, selectedForSave: true, includeZone: true };
                    })
                }));
            };

            const toggleOmrRowSelection = (roomId) => {
                setOmrScannerModal(prev => ({
                    ...prev,
                    results: prev.results.map(item => item.room.id === roomId ? { ...item, selectedForSave: !item.selectedForSave } : item)
                }));
            };

            const handleSaveOmrScannedResults = () => {
                const targetDateStr = filterDate || new Date().toISOString().split('T')[0];
                const recordsToSave = [];
                const timePart = new Date().toISOString().split('T')[1];
                const finalDateISO = `${targetDateStr}T${timePart}`;
                const inspectorTeam = getActiveInspectorTeamString();

                omrScannerModal.results.forEach(item => {
                    if (!item.selectedForSave) return;
                    if (omrScannerModal.onlySaveMarked && !item.hasDetectedMark) return;

                    if (item.includeRoom) {
                        let totalScore = 10;
                        let breakdown = {};
                        if (item.roomScores.skip) {
                            totalScore = null;
                            breakdown = { status: 'ข้ามการตรวจ' };
                        } else if (item.roomScores.noDuty) {
                            totalScore = -5;
                            breakdown = { status: 'ไม่ปฏิบัติหน้าที่' };
                        } else {
                            totalScore = item.roomScores.c1 + item.roomScores.c2 + item.roomScores.c3 + item.roomScores.c4 + item.roomScores.c5;
                            breakdown = {
                                c1: item.roomScores.c1,
                                c2: item.roomScores.c2,
                                c3: item.roomScores.c3,
                                c4: item.roomScores.c4,
                                c5: item.roomScores.c5
                            };
                        }
                        recordsToSave.push({
                            id: generateId('insp'),

                            const canvas = await window.html2canvas(element, canvasOpts);

                                const res = await fetch(dataUrl);

                                margin:       0, 
                                filename:     fileName,
                                image:        { type: 'jpeg', quality: 1.0 },
                                html2canvas:  canvasOpts,

                            </button>
                            <button onClick={() => setCurrentRoute('leaderboard')} className={`flex flex-col items-center p-1.5 flex-1 transition-all ${currentRoute === 'leaderboard' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                <div className={`p-1.5 rounded-xl mb-0.5 flex items-center justify-center ${currentRoute === 'leaderboard' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'leaderboard' ? 'ph-trophy ph-fill' : 'ph-trophy'} text-[22px]`}></i></div>
                                <span className="text-[10px] font-bold">อันดับ</span>
                            </button>

                            {(appMode === 'admin' || appMode === 'inspector') && (
                                <button onClick={() => setCurrentRoute('inspect')} className="flex flex-col items-center justify-center flex-1 py-1">
                                    <div className={`w-11 h-11 rounded-full flex items-center justify-center shadow-md transition-transform active:scale-95 ${currentRoute === 'inspect' ? 'bg-[#C8102E] text-white ring-4 ring-red-100' : 'bg-[#C8102E] text-white'}`}>
                                        <i className="ph ph-clipboard-text ph-fill text-[22px]"></i>
                                    </div>
                                    <span className={`text-[10px] font-bold mt-0.5 ${currentRoute === 'inspect' ? 'text-[#C8102E]' : 'text-gray-600'}`}>ประเมิน</span>
                                </button>
                            )}

                            <button onClick={() => setCurrentRoute('history')} className={`flex flex-col items-center p-1.5 flex-1 transition-all ${currentRoute === 'history' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                <div className={`p-1.5 rounded-xl mb-0.5 flex items-center justify-center ${currentRoute === 'history' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'history' ? 'ph-clock-counter-clockwise ph-fill' : 'ph-clock-counter-clockwise'} text-[22px]`}></i></div>
                                <span className="text-[10px] font-bold">ประวัติ</span>
                            </button>

                            {appMode === 'admin' ? (
                                <button onClick={() => setCurrentRoute('settings')} className={`flex flex-col items-center p-1.5 flex-1 transition-all ${currentRoute === 'settings' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                    <div className={`p-1.5 rounded-xl mb-0.5 flex items-center justify-center ${currentRoute === 'settings' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'settings' ? 'ph-gear ph-fill' : 'ph-gear'} text-[22px]`}></i></div>
                                    <span className="text-[10px] font-bold">ตั้งค่า</span>
                                </button>
                            ) : (
                                <button onClick={() => setShowInfoModal(true)} className="flex flex-col items-center p-1.5 flex-1 text-gray-500 transition-all">
                                    <div className="p-1.5 rounded-xl mb-0.5 flex items-center justify-center"><i className="ph ph-question text-[22px]"></i></div>
                                    <span className="text-[10px] font-bold">ช่วยเหลือ</span>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><ZoneCheckApp /></ErrorBoundary>);
    </script>
</body>
</html>
