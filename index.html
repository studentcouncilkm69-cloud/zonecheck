<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <title>ZoneCheck V2.1 | สภานักเรียนโรงเรียนคำม่วง</title>
    
    <!-- Tailwind CSS & React -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- PDF & Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;900&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        html, body { 
            font-family: 'Noto Sans Thai', sans-serif !important; 
            background-color: #E5E7EB;
            overscroll-behavior: none; 
            -webkit-overflow-scrolling: touch;
            -webkit-tap-highlight-color: transparent;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            color: #1F2937;
        }
        
        #root { height: 100dvh; width: 100%; display: flex; flex-direction: column; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .no-select { -webkit-user-select: none; user-select: none; }
        
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 1.5s linear infinite; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        .checkbox-custom:checked + div { background-color: #C8102E; border-color: #C8102E; }
        .checkbox-custom:checked + div svg { display: block; }

        /* PDF Export Styles */
        .pdf-export-wrapper {
            font-family: 'Sarabun', sans-serif !important;
            color: #333;
            background: white;
            box-sizing: border-box;
            width: 1123px !important; 
            max-width: 1123px !important;
            padding: 30px 40px !important;
            margin: 0 !important;
        }
        .pdf-table { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid #d8b4fe; margin-top: 5px; table-layout: fixed;}
        .pdf-table th { background-color: #8b5cf6 !important; color: white !important; padding: 8px 4px; border: 1px solid #d8b4fe; font-weight: bold; text-align: center; vertical-align: middle; }
        .pdf-table td { padding: 4.5px 4px; border: 1px solid #e9d5ff; text-align: center; color: #334155; vertical-align: middle; }
        .pdf-table tr:nth-child(even) td { background-color: #faf5ff !important; } 
        .pdf-table td.text-left { text-align: left; padding-left: 20px; } 
        .pdf-table tr, .pdf-row { page-break-inside: avoid !important; break-inside: avoid !important; }
        .pdf-table.detailed-table { font-size: 12px; }
        .pdf-table.detailed-table th { font-size: 12px; padding: 6px 2px; }
        .col-purple { color: #7c3aed !important; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ⚠️ สำคัญมาก: ใส่ URL ของ ZoneCheck Backend (REST API)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3CKwBAOiz6dJQWI-t8nabgSv-46yTcAI8QZHR2KFWtrGJSHuKHdnm7-sCDsfL26yu/exec"; 

        const HARDCODED_LOGO = "https://i.postimg.cc/wBN5btrp/rong-re-yn-kham-wng.png";
        const HARDCODED_NAME = "STUDENT COUNCIL • KHAMMUANG SCHOOL";

        const safeGetItem = (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } };
        const safeSetItem = (key, val) => { try { localStorage.setItem(key, val); } catch(e) {} };
        const safeRemoveItem = (key) => { try { localStorage.removeItem(key); } catch(e) {} };
        const safeParse = (data, fallback) => {
            if (!data) return fallback;
            try {
                const parsed = JSON.parse(data);
                if (Array.isArray(fallback) && !Array.isArray(parsed)) return fallback;
                return parsed;
            } catch (e) { return fallback; }
        };

        const generateId = (prefix) => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).substr(2, 5)}`;
        
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="h-[100dvh] bg-red-50 p-8 flex flex-col items-center justify-center text-center">
                            <i className="ph ph-warning-circle text-red-500 mb-4 text-6xl"></i>
                            <h1 className="text-3xl font-bold text-red-600 mb-2">⚠️ ระบบขัดข้อง</h1>
                            <p className="text-red-500 mb-4 text-sm font-medium">ตรวจพบข้อผิดพลาด กรุณากดปุ่มด้านล่างเพื่อเริ่มใหม่</p>
                            <button onClick={() => { 
                                safeRemoveItem('zc26_rooms'); safeRemoveItem('zc26_inspectors'); 
                                safeRemoveItem('zc26_inspections'); safeRemoveItem('zc26_settings'); 
                                window.location.reload(); 
                            }} className="mt-6 px-6 py-3 bg-[#C8102E] text-white font-medium rounded-xl shadow-lg">รีเซ็ตและโหลดใหม่</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const initialSettings = { 
            passcode: "1234", master_passcode: "9999", is_maintenance: "false", 
            app_logo_url: "", logo_url: "", school_logo_url: "", zone_map_url: "", room_map_url: "",
            banner_url: "", main_banner_url: "", popup_banner_url: "", 
            announcement_title: "", announcement_msg: "",
            visibility_main_banner: "public", visibility_popup_banner: "public", visibility_announce_banner: "public"
        };
        
        const ROOM_CRITERIA = [
            { id: 'c1', name: "โต๊ะ" }, { id: 'c2', name: "ขยะ" },
            { id: 'c3', name: "ไฟ/หน้าต่าง" }, { id: 'c4', name: "พื้น" }, { id: 'c5', name: "กระดาน" }
        ];

        const formatThaiDateForFile = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${String(d.getDate()).padStart(2,'0')}_${months[d.getMonth()]}_${d.getFullYear()+543}`;
        };

        const formatDateObj = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return 'วันที่ไม่ระบุ';
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
        };

        const formatMonthYearShort = (dateStr) => {
            if(!dateStr) return '';
            const parts = dateStr.split('-');
            if(parts.length !== 2) return dateStr;
            const [year, month] = parts;
            const monthsShort = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${monthsShort[parseInt(month)-1] || month} ${parseInt(year)+543}`;
        };
        
        const formatMonthYearThai = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            return `${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`;
        };

        function ZoneCheckApp() {
            const [appMode, setAppMode] = useState('guest'); 
            const [currentRoute, setCurrentRoute] = useState('dashboard'); 
            const [showSplash, setShowSplash] = useState(true); 
            const [toast, setToast] = useState('');
            const [isSyncing, setIsSyncing] = useState(false);

            const [logoTaps, setLogoTaps] = useState(0);
            const tapTimeoutRef = useRef(null);
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
            const [inputPasscode, setInputPasscode] = useState('');
            const [loginInspector, setLoginInspector] = useState(() => safeGetItem('zc26_last_user') || '');
            const [selectedLoginName, setSelectedLoginName] = useState(() => safeGetItem('zc26_last_user') || ''); 
            const [loginError, setLoginError] = useState('');
            const [currentUser, setCurrentUser] = useState(null);
            const [showLoginSuggestions, setShowLoginSuggestions] = useState(false);

            const loadDataSafe = (key, fallback) => {
                const data = safeGetItem(key);
                return safeParse(data, fallback);
            };

            const [rooms, setRooms] = useState(() => loadDataSafe('zc26_rooms', []));
            const [inspectors, setInspectors] = useState(() => loadDataSafe('zc26_inspectors', []));
            const [inspections, setInspections] = useState(() => loadDataSafe('zc26_inspections', []));
            const [settings, setSettings] = useState(() => loadDataSafe('zc26_settings', initialSettings));

            const [isSavingData, setIsSavingData] = useState(false);
            const [isImageProcessing, setIsImageProcessing] = useState(false);
            
            const [guestSearch, setGuestSearch] = useState('');
            const [guestFilterGroup, setGuestFilterGroup] = useState('all'); 
            const [guestFilterType, setGuestFilterType] = useState('all');
            const [guestAdvancedFilter, setGuestAdvancedFilter] = useState('all');
            
            const [dateMode, setDateMode] = useState('today'); 
            const [filterDate, setFilterDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [selectedMonth, setSelectedMonth] = useState(() => new Date().toISOString().slice(0, 7)); 
            
            const [leaderboardTab, setLeaderboardTab] = useState('all'); 
            
            const [exportSortOrder, setExportSortOrder] = useState('score'); 
            const [excelMode, setExcelMode] = useState('single'); 
            const [exportDestination, setExportDestination] = useState('local');

            const [historyViewMode, setHistoryViewMode] = useState('table'); 
            const [historyCalendarMonth, setHistoryCalendarMonth] = useState(() => new Date().toISOString().slice(0, 7));
            const [calendarTypeFilter, setCalendarTypeFilter] = useState('room');

            const [inspectSearchRoom, setInspectSearchRoom] = useState('');
            const [inspectModal, setInspectModal] = useState({ isOpen: false, room: null, type: 'room', date: new Date().toISOString().split('T')[0] });
            const [roomScores, setRoomScores] = useState({ c1: 2, c2: 2, c3: 2, c4: 2, c5: 2, noDuty: false });
            const [zoneScore, setZoneScore] = useState(10); 
            const [evalComment, setEvalComment] = useState('');
            const [isSkipped, setIsSkipped] = useState(false); 
            const [inspectImage, setInspectImage] = useState(null); 
            const fileInputRef = useRef(null);

            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, message: '', onConfirm: null, isAlert: false });
            const [viewDetailModal, setViewDetailModal] = useState(null);
            const [showInfoModal, setShowInfoModal] = useState(false);
            const [showAnnouncement, setShowAnnouncement] = useState(false);
            const [showZoneMap, setShowZoneMap] = useState(false); 
            const [showRoomMap, setShowRoomMap] = useState(false); 
            const [showMainBannerPopup, setShowMainBannerPopup] = useState(false);
            const [hideBannerFor7Days, setHideBannerFor7Days] = useState(false);
            const [printData, setPrintData] = useState({ isPreparing: false, format: null, mode: null, title: '', subtitle: '', dateText: '', data: [] });

            const [bulkRooms, setBulkRooms] = useState('');
            const [bulkInspectors, setBulkInspectors] = useState('');
            const [maintenanceToggle, setMaintenanceToggle] = useState(false);
            const [maintenanceMsg, setMaintenanceMsg] = useState('');
            const [appLogoInput, setAppLogoInput] = useState('');
            const [logoInput, setLogoInput] = useState('');
            const [schoolLogoInput, setSchoolLogoInput] = useState('');
            const [zoneMapInput, setZoneMapInput] = useState(''); 
            const [roomMapInput, setRoomMapInput] = useState(''); 
            const [mainBannerInput, setMainBannerInput] = useState(''); 
            const [popupBannerInput, setPopupBannerInput] = useState(''); 
            const [announceBannerInput, setAnnounceBannerInput] = useState(''); 
            const [announcementTitleInput, setAnnouncementTitleInput] = useState('');
            const [announcementInput, setAnnouncementInput] = useState('');
            const [visMainBanner, setVisMainBanner] = useState('public');
            const [visPopupBanner, setVisPopupBanner] = useState('public');
            const [visAnnounceBanner, setVisAnnounceBanner] = useState('public');
            const [sysPasscode, setSysPasscode] = useState('');
            const [sysMasterPasscode, setSysMasterPasscode] = useState('');

            useEffect(() => {
                if (settings) {
                    setMaintenanceToggle(String(settings.is_maintenance).toLowerCase() === 'true');
                    setMaintenanceMsg(settings.maintenance_msg || '⚠️ ระบบกำลังปิดปรับปรุงชั่วคราว\nขออภัยในความไม่สะดวกมา ณ ที่นี้');
                    setAppLogoInput(settings.app_logo_url || '');
                    setLogoInput(settings.logo_url || '');
                    setSchoolLogoInput(settings.school_logo_url || '');
                    setZoneMapInput(settings.zone_map_url || ''); 
                    setRoomMapInput(settings.room_map_url || ''); 
                    setMainBannerInput(settings.main_banner_url || '');
                    setPopupBannerInput(settings.popup_banner_url || '');
                    setAnnounceBannerInput(settings.announce_banner_url || settings.banner_url || '');
                    setAnnouncementTitleInput(settings.announcement_title || '');
                    setAnnouncementInput(settings.announcement_msg || '');
                    setVisMainBanner(settings.visibility_main_banner || 'public');
                    setVisPopupBanner(settings.visibility_popup_banner || 'public');
                    setVisAnnounceBanner(settings.visibility_announce_banner || 'public');
                    setSysPasscode(settings.passcode || '1234');
                    setSysMasterPasscode(settings.master_passcode || '9999');
                }
            }, [settings]);
            
            useEffect(() => {
                if (currentRoute === 'history') {
                    setExportSortOrder('room'); 
                    setExcelMode('single');
                    setHistoryViewMode('table'); 
                } else if (currentRoute === 'leaderboard') {
                    setExportSortOrder('score'); 
                }
            }, [currentRoute]);

            useEffect(() => { setGuestAdvancedFilter('all'); }, [guestFilterType]);

            useEffect(() => {
                if (currentRoute !== 'leaderboard' && excelMode === 'months') {
                    setExcelMode('single');
                }
            }, [currentRoute]);

            const canViewBanner = (visibilitySetting) => {
                if (visibilitySetting === 'public') return true;
                if (visibilitySetting === 'inspector' && (appMode === 'admin' || appMode === 'inspector')) return true;
                if (visibilitySetting === 'guest' && appMode === 'guest') return true;
                return false;
            };

            useEffect(() => {
                if (settings?.popup_banner_url && !showSplash) {
                    if (!canViewBanner(settings.visibility_popup_banner)) return;
                    const hiddenUntil = safeGetItem('zc26_hide_banner_until');
                    if (hiddenUntil) {
                        const now = new Date().getTime();
                        if (now < parseInt(hiddenUntil)) {
                            setShowMainBannerPopup(false);
                            return;
                        } else {
                            safeRemoveItem('zc26_hide_banner_until');
                        }
                    }
                    setTimeout(() => { setShowMainBannerPopup(true); }, 500);
                }
            }, [settings?.popup_banner_url, settings?.visibility_popup_banner, appMode, showSplash]);

            const handleCloseMainBannerPopup = () => {
                if (hideBannerFor7Days) {
                    const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
                    const expireTime = new Date().getTime() + sevenDaysInMs;
                    safeSetItem('zc26_hide_banner_until', expireTime.toString());
                }
                setShowMainBannerPopup(false);
            };

            const handleLogoClick = () => {
                if (appMode !== 'guest') return; 
                setLogoTaps(prev => {
                    const next = prev + 1;
                    if (next >= 5) {
                        setIsLoginModalOpen(true); 
                        setInputPasscode(''); 
                        setLoginError('');
                        return 0; 
                    }
                    return next;
                });
                if (tapTimeoutRef.current) clearTimeout(tapTimeoutRef.current);
                tapTimeoutRef.current = setTimeout(() => { setLogoTaps(0); }, 3000);
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault(); 
                if (!selectedLoginName) { setLoginError('กรุณาเลือกชื่อผู้ตรวจ'); return; }
                
                const validInspectors = Array.isArray(inspectors) ? inspectors : [];
                let userObj = validInspectors.find(u => u.name === selectedLoginName);
                if (!userObj) { userObj = { id: generateId('u'), name: selectedLoginName, avatar_url: '' }; }

                const isMaster = inputPasscode === (settings.master_passcode || '9999');
                const isStandard = inputPasscode === (settings.passcode || '1234');

                if (isMaster || isStandard) { 
                    setLoginError(''); 
                    setIsLoginModalOpen(false); 
                    if (isMaster) setAppMode('admin'); 
                    else setAppMode('inspector');
                    setCurrentUser(userObj);
                    setCurrentRoute('dashboard'); 
                    safeSetItem('zc26_last_user', selectedLoginName);
                    handleSync(); 
                    showToast(`เข้าสู่ระบบในชื่อ ${selectedLoginName}`);
                } else { setLoginError('รหัสผ่านไม่ถูกต้อง'); }
            };

            const filteredLoginInspectors = useMemo(() => {
                const validInspectors = Array.isArray(inspectors) ? inspectors : [];
                return validInspectors.filter(u => (u?.name || '').toLowerCase().includes((loginInspector || '').toLowerCase()));
            }, [inspectors, loginInspector]);

            const handleSync = async () => {
                setIsSyncing(true);
                try {
                    const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getInitialData`);
                    const json = await res.json();
                    
                    if (json && json.status === 'Success') {
                        setRooms(Array.isArray(json.rooms) ? json.rooms : []);
                        setInspectors(Array.isArray(json.inspectors) ? json.inspectors : []);
                        setInspections(Array.isArray(json.inspections) ? json.inspections : []);
                        setSettings(json.settings || initialSettings);
                        if(json.settings && String(json.settings.is_maintenance).toLowerCase() !== 'true' && !showSplash) showToast('อัปเดตข้อมูลล่าสุดแล้ว');
                    }
                } catch (err) {
                    if (!showSplash) showToast('เชื่อมต่อฐานข้อมูลล้มเหลว ตรวจสอบอินเทอร์เน็ต');
                } finally {
                    setIsSyncing(false);
                    setTimeout(() => setShowSplash(false), 800);
                }
            };

            useEffect(() => { handleSync(); }, []);

            useEffect(() => {
                try {
                    safeSetItem('zc26_rooms', JSON.stringify(rooms));
                    safeSetItem('zc26_inspectors', JSON.stringify(inspectors));
                    safeSetItem('zc26_inspections', JSON.stringify(inspections));
                    safeSetItem('zc26_settings', JSON.stringify(settings));
                } catch (error) { console.warn('LocalStorage Blocked'); }
            }, [rooms, inspectors, inspections, settings]);

            const syncToGASAsync = async (action, data) => {
                const payload = { action, data };
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const json = await res.json();
                    if (json.status !== 'Success') throw new Error(json.message || 'Unknown Error');
                    return json;
                } catch (err) {
                    throw new Error(err.message || 'Network Error');
                }
            };

            const uploadFileToGoogleDrive = async (fileName, base64Data, mimeType) => {
                const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
                const d = new Date();
                const currentMonthYear = `${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`;
                
                showToast(`☁️ กำลังเริ่มส่งไฟล์เข้า Google Drive...`);
                
                if (base64Data.length > 6000000) { 
                    showAlertMsg("❌ ไฟล์มีขนาดใหญ่เกินกว่าที่ระบบ Google Drive จะรับได้อัตโนมัติ\nกรุณาเลือกดาวน์โหลด 'ลงเครื่อง' แทนครับ");
                    return Promise.reject('File too large');
                }

                try {
                    const actionName = mimeType.startsWith('image/') ? 'saveImageToDrive' : 'saveFileToDrive';
                    const res = await syncToGASAsync(actionName, {
                        fileName, base64: base64Data, mimeType, monthYear: currentMonthYear
                    });

                    if(res && res.status === 'Success') {
                        showToast('✅ บันทึกไฟล์ลง Google Drive สำเร็จ!');
                        return res.url;
                    } else {
                        throw new Error(res.message || 'Unknown Server Error');
                    }
                } catch (error) {
                    showAlertMsg('❌ การเชื่อมต่อล้มเหลว!\nไม่สามารถส่งไฟล์ไปที่ Google Drive ได้\nError: ' + error.message);
                    throw error;
                }
            };

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 4500); };
            const showConfirm = (msg, onConfirmFn) => { setConfirmDialog({ isOpen: true, message: msg, onConfirm: onConfirmFn, isAlert: false }); };
            const showAlertMsg = (msg) => { setConfirmDialog({ isOpen: true, message: msg, onConfirm: () => {}, isAlert: true }); };

            const handleOpenInspect = (room, type) => {
                const targetDateStr = filterDate || new Date().toISOString().split('T')[0];
                const validInspections = Array.isArray(inspections) ? inspections : [];

                    {showAnnouncement && canViewBanner(settings?.visibility_announce_banner) && (
                        <div className="fixed inset-0 z-[9990] bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in" onClick={()=>setShowAnnouncement(false)}>
                            <div className="bg-white rounded-[2rem] w-full max-w-md shadow-2xl overflow-hidden animate-in zoom-in-95" onClick={e=>e.stopPropagation()}>
                                <div className="bg-gradient-to-r from-[#C8102E] to-red-800 p-4 flex items-center justify-between text-white">
                                    <div className="flex items-center gap-2 font-bold text-lg"><i className="ph ph-megaphone text-xl"></i> ประกาศสภาฯ</div>
                                    <button onClick={()=>setShowAnnouncement(false)} className="w-8 h-8 flex items-center justify-center bg-white/20 rounded-full hover:bg-white/30 transition-colors"><i className="ph ph-x"></i></button>
                                </div>
                                <div className="max-h-[60vh] overflow-y-auto p-6 space-y-4 custom-scrollbar">
                                    {settings?.announce_banner_url && <div className="w-full aspect-[16/9] rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50"><img src={settings.announce_banner_url} alt="Announcement Banner" className="w-full h-full object-cover" /></div>}
                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-100">
                                        {settings?.announcement_title && <h3 className="font-bold text-[#C8102E] mb-2">{settings?.announcement_title}</h3>}
                                        <div className="whitespace-pre-line text-gray-700 text-sm font-medium leading-relaxed">{settings?.announcement_msg}</div>
                                        {(!settings?.announcement_title && !settings?.announcement_msg) && <p className="text-gray-400 text-center text-sm font-medium">ยังไม่มีประกาศใหม่</p>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showZoneMap && (
                        <div className="fixed inset-0 z-[9999] bg-gray-900/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in" onClick={()=>setShowZoneMap(false)}>
                            <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[85vh] shadow-2xl overflow-hidden animate-in zoom-in-95 flex flex-col" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 flex items-center justify-between border-b border-gray-100 bg-white">
                                    <h3 className="font-bold text-gray-800 flex items-center gap-2"><i className="ph ph-map-pin text-[#C8102E]"></i> แผนผังเขตพื้นที่</h3>
                                    <button onClick={()=>setShowZoneMap(false)} className="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full hover:bg-gray-200 transition-colors"><i className="ph ph-x"></i></button>
                                </div>
                                <div className="flex-1 overflow-auto bg-gray-50 p-2 custom-scrollbar flex items-center justify-center">
                                    {settings?.zone_map_url ? (
                                        <img src={settings.zone_map_url} alt="Zone Map" className="w-full h-auto object-contain rounded-xl" crossOrigin="anonymous"/>
                                    ) : (
                                        <p className="text-gray-400 text-sm font-medium py-10">ยังไม่มีข้อมูลรูปภาพแผนผัง</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showRoomMap && (
                        <div className="fixed inset-0 z-[9999] bg-gray-900/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in" onClick={()=>setShowRoomMap(false)}>
                            <div className="bg-white rounded-[2rem] w-full max-w-2xl max-h-[85vh] shadow-2xl overflow-hidden animate-in zoom-in-95 flex flex-col" onClick={e=>e.stopPropagation()}>
                                <div className="p-4 flex items-center justify-between border-b border-gray-100 bg-white">
                                    <h3 className="font-bold text-gray-800 flex items-center gap-2"><i className="ph ph-buildings text-blue-500"></i> แผนผังห้องเรียน</h3>
                                    <button onClick={()=>setShowRoomMap(false)} className="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full hover:bg-gray-200 transition-colors"><i className="ph ph-x"></i></button>
                                </div>
                                <div className="flex-1 overflow-auto bg-gray-50 p-2 custom-scrollbar flex items-center justify-center">
                                    {settings?.room_map_url ? (
                                        <img src={settings.room_map_url} alt="Room Map" className="w-full h-auto object-contain rounded-xl" crossOrigin="anonymous"/>
                                    ) : (
                                        <p className="text-gray-400 text-sm font-medium py-10">ยังไม่มีข้อมูลรูปภาพแผนผัง</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showMainBannerPopup && settings?.popup_banner_url && canViewBanner(settings.visibility_popup_banner) && (
                        <div className="fixed inset-0 z-[9995] bg-gray-900/80 backdrop-blur-sm flex items-center justify-center p-6 animate-in fade-in">
                            <div className="bg-transparent w-full max-w-sm rounded-[2rem] relative flex flex-col items-center animate-in zoom-in-95">
                                <button onClick={handleCloseMainBannerPopup} className="absolute -top-12 right-0 w-10 h-10 bg-white/20 hover:bg-white/40 backdrop-blur-md rounded-full text-white flex items-center justify-center transition-all border border-white/30 z-10">
                                    <i className="ph ph-x text-lg"></i>
                                </button>
                                <div className="w-full rounded-3xl overflow-hidden shadow-2xl bg-white mb-4 flex items-center justify-center">
                                    <img src={settings.popup_banner_url} alt="Popup Campaign Banner" className="w-full h-auto object-cover block" />
                                </div>
                                <label className="flex items-center gap-3 cursor-pointer bg-black/40 backdrop-blur-md px-4 py-2.5 rounded-full border border-white/10 hover:bg-black/60 transition-colors">
                                    <div className="relative flex items-center">
                                        <input type="checkbox" checked={hideBannerFor7Days} onChange={(e) => setHideBannerFor7Days(e.target.checked)} className="checkbox-custom opacity-0 absolute w-full h-full cursor-pointer z-10" />
                                        <div className="w-5 h-5 bg-white/20 border-2 border-white/50 rounded flex items-center justify-center transition-all duration-200">
                                            <i className="ph ph-check text-white hidden pointer-events-none text-xs"></i>
                                        </div>
                                    </div>
                                    <span className="text-white text-xs font-medium">ไม่แสดงหน้านี้อีกใน 7 วัน</span>
                                </label>
                            </div>
                        </div>
                    )}

                    {showInfoModal && (
                        <div className="fixed inset-0 z-[9990] bg-gray-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 animate-in fade-in" onClick={()=>setShowInfoModal(false)}>
                            <div className="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-2xl animate-in slide-in-from-bottom-full sm:zoom-in-95 text-center relative" onClick={e=>e.stopPropagation()}>
                                <h2 className="text-xl font-black text-gray-800 mb-1 border-b border-gray-100 pb-3">ศูนย์ช่วยเหลือ</h2>
                                <p className="text-gray-500 text-[12px] mb-6 mt-3">หากลืมรหัสผ่าน หรือพบปัญหาการใช้งานระบบ สามารถกดติดต่อแอดมินผ่าน LINE ได้เลยครับ</p>
                                
                                <div className="flex flex-row items-center gap-4 text-left mb-6">
                                    <div className="w-20 h-20 rounded-full overflow-hidden border-2 border-gray-200 shadow-sm shrink-0 bg-gray-100 flex items-center justify-center">
                                        <i className="ph ph-user text-4xl text-gray-400"></i>
                                    </div>
                                    <div>
                                        <p className="font-bold text-gray-800 text-sm mb-1">นายภูธนากร หงษ์ทอง (พี่ภีม)</p>
                                        <p className="text-[11px] text-gray-500">เลขานุการสภานักเรียนโรงเรียนคำม่วง</p>
                                    </div>
                                </div>

                                <a href="https://line.me/ti/p/~470aijh" target="_blank" className="w-full flex items-center justify-center gap-2 py-3 bg-[#00B900] hover:bg-[#009900] text-white rounded-xl font-bold transition-all active:scale-95 text-sm shadow-md shadow-green-500/20 mb-4">
                                    <i className="ph ph-chat-circle-dots text-lg"></i> คุยผ่าน LINE
                                </a>

                                <button onClick={()=>setShowInfoModal(false)} className="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl font-bold transition-colors text-sm">ปิดหน้าต่าง</button>
                            </div>
                        </div>
                    )}

                    {isSavingData && (
                        <div className="fixed inset-0 z-[99999] bg-gray-900/80 backdrop-blur-sm flex flex-col items-center justify-center">
                            <i className="ph ph-spinner text-[#C8102E] text-6xl mb-4 animate-spin"></i>
                            <h2 className="text-2xl font-bold text-white mt-4 font-sarabun">กำลังบันทึกข้อมูล...</h2>
                        </div>
                    )}
                    
                    {toast && (
                        <div className="fixed bottom-28 md:bottom-8 left-1/2 transform -translate-x-1/2 z-[999999] bg-gray-800 text-white px-5 py-3 rounded-xl shadow-2xl animate-in slide-in-from-bottom-4 fade-in font-medium text-sm flex items-center gap-2 whitespace-nowrap">
                            <i className="ph ph-info"></i> {toast}
                        </div>
                    )}

                    {/* Bottom Nav สำหรับ Mobile */}
                    <div className="md:hidden fixed bottom-0 w-full z-50">
                        <div className="absolute inset-0 bg-white/90 backdrop-blur-xl border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]"></div>
                        <div className="relative flex justify-around items-center p-1.5 pb-safe">
                            <button onClick={() => setCurrentRoute('dashboard')} className={`flex flex-col items-center p-2 w-16 transition-all ${currentRoute === 'dashboard' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                <div className={`p-1.5 rounded-xl mb-1 flex items-center justify-center ${currentRoute === 'dashboard' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'dashboard' ? 'ph-house ph-fill' : 'ph-house'} text-[24px]`}></i></div>
                                <span className="text-[10px] font-medium truncate w-full text-center">หน้าแรก</span>
                            </button>
                            <button onClick={() => setCurrentRoute('leaderboard')} className={`flex flex-col items-center p-2 w-16 transition-all ${currentRoute === 'leaderboard' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                <div className={`p-1.5 rounded-xl mb-1 flex items-center justify-center ${currentRoute === 'leaderboard' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'leaderboard' ? 'ph-trophy ph-fill' : 'ph-trophy'} text-[24px]`}></i></div>
                                <span className="text-[10px] font-medium truncate w-full text-center">อันดับ</span>
                            </button>
                            <button onClick={() => setCurrentRoute('history')} className={`flex flex-col items-center p-2 w-16 transition-all ${currentRoute === 'history' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                <div className={`p-1.5 rounded-xl mb-1 flex items-center justify-center ${currentRoute === 'history' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'history' ? 'ph-clock-counter-clockwise ph-fill' : 'ph-clock-counter-clockwise'} text-[24px]`}></i></div>
                                <span className="text-[10px] font-medium truncate w-full text-center">ประวัติ</span>
                            </button>
                            
                            {(appMode === 'admin' || appMode === 'inspector') && (
                                <button onClick={() => setCurrentRoute('inspect')} className={`flex flex-col items-center p-2 w-16 transition-all ${currentRoute === 'inspect' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                    <div className={`p-1.5 rounded-xl mb-1 flex items-center justify-center ${currentRoute === 'inspect' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'inspect' ? 'ph-clipboard-text ph-fill' : 'ph-clipboard-text'} text-[24px]`}></i></div>
                                    <span className="text-[10px] font-medium truncate w-full text-center">ประเมิน</span>
                                </button>
                            )}
                            {appMode === 'admin' && (
                                <button onClick={() => setCurrentRoute('settings')} className={`flex flex-col items-center p-2 w-16 transition-all ${currentRoute === 'settings' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                    <div className={`p-1.5 rounded-xl mb-1 flex items-center justify-center ${currentRoute === 'settings' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'settings' ? 'ph-gear ph-fill' : 'ph-gear'} text-[24px]`}></i></div>
                                    <span className="text-[10px] font-medium truncate w-full text-center">ตั้งค่า</span>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><ZoneCheckApp /></ErrorBoundary>);
    </script>
</body>
</html>
