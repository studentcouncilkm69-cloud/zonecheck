<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <style>
        html, body { 
            font-family: 'Noto Sans Thai', sans-serif !important; 
            background-color: #E5E7EB;
            overscroll-behavior: none; 
            -webkit-overflow-scrolling: touch;
            -webkit-tap-highlight-color: transparent;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            color: #1F2937;
        }
        
        #root { height: 100dvh; width: 100%; display: flex; flex-direction: column; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .no-select { -webkit-user-select: none; user-select: none; }

        .animate-spin-slow { animation: spin-slow 1.5s linear infinite; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        .checkbox-custom:checked + div { background-color: #C8102E; border-color: #C8102E; }
        .checkbox-custom:checked + div svg { display: block; }

        /* PDF Export Styles */
        .pdf-export-wrapper {
            font-family: 'Sarabun', sans-serif !important;
            color: #333;
            background: white;
            box-sizing: border-box;
            width: 1123px !important;
            padding: 30px 40px !important;
        }
        .pdf-table { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid #cbd5e1; }
        .pdf-table th { background-color: #f8fafc !important; color: #334155 !important; padding: 8px 6px; border: 1px solid #cbd5e1; font-weight: bold; text-align: center; }
        .pdf-table td { padding: 7px 6px; border: 1px solid #cbd5e1; text-align: center; vertical-align: middle; }
        .pdf-table td.text-left { text-align: left; padding-left: 10px; }
        .col-purple { color: #7c3aed !important; font-weight: bold; }

        /* สไตล์สำหรับใบตรวจแบบกระดาษคำตอบ (OMR Answer Sheet - Single A4 Landscape) */
        .omr-sheet-wrapper, .omr-sheet-wrapper * {
            font-family: 'Sarabun', sans-serif !important;
        }
        .omr-sheet-wrapper {
            color: #111827;
            background: white;
            box-sizing: border-box;
            width: 1122px !important;
            height: 793px !important;
            max-width: 1122px !important;
            max-height: 793px !important;
            padding: 20px 38px !important;
            margin: 0 auto !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .omr-table { width: 100%; border-collapse: collapse; font-size: 9px; border: 1.5px solid #111827; table-layout: fixed; }
        .omr-table th { background-color: #f3f4f6 !important; color: #111827 !important; padding: 2.5px 1px; border: 1px solid #374151; font-weight: 700; text-align: center; vertical-align: middle; line-height: 1.1; white-space: nowrap; }
        .omr-table td { padding: 1px 0.5px; border: 1px solid #9ca3af; text-align: center; vertical-align: middle; color: #111827; height: 17px; }
        .omr-table tr:nth-child(even) td { background-color: #f8fafc !important; }
        .omr-bubble {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 13px;
            height: 13px;
            border: 1.2px solid #4b5563;
            border-radius: 9999px;
            font-size: 7.5px;
            font-weight: 600;
            color: #9ca3af;
            background: #ffffff;
            line-height: 1;
            margin: 0 auto;
        }
        .omr-corner-mark {
            width: 13px;
            height: 13px;
            background-color: #111827;
            border: 2px solid #111827;
        }
        .masked-pin-input {
            -webkit-text-security: disc !important;
            text-security: disc !important;
        }
        @page {
            size: A4 landscape;
            margin: 0;
        }
        @media print {
            html, body { width: 297mm; height: 210mm; margin: 0 !important; padding: 0 !important; background: #fff !important; overflow: visible !important; }
            body * { visibility: hidden; }
            #omr-print-area, #omr-print-area * { visibility: visible; }
            #omr-print-area { position: fixed; left: 0; top: 0; width: 297mm; height: 210mm; margin: 0 !important; padding: 0 !important; box-shadow: none !important; display: flex; align-items: center; justify-content: center; }
        }

        .nav-item { transition: all 0.2s ease; position: relative; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ⚠️ ลิงก์ Google Apps Script Backend
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxp7RJqJIajrEx8J9IVnJC75saIt_FeiQDUxNgxnP7vrYOy7xcYy77RqXljRUXv_xHm/exec";

        const HARDCODED_LOGO = "https://i.postimg.cc/wBN5btrp/rong-re-yn-kham-wng.png";
        const HARDCODED_NAME = "STUDENT COUNCIL • KHAMMUANG SCHOOL";
        const ADMIN_AVATAR_URL = "https://i.postimg.cc/K8nwK3rc/att-t8x-q-Ucw-G9JVKpv-Lq-G9t-GAMr-Hq-Ma-Gedads-WR6q-Lut-Yw.jpg";

        const safeGetItem = (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } };
        const safeSetItem = (key, val) => { try { localStorage.setItem(key, val); } catch(e) {} };
        const safeRemoveItem = (key) => { try { localStorage.removeItem(key); } catch(e) {} };
        const safeParse = (data, fallback) => {
            if (!data) return fallback;
            try {
                const parsed = JSON.parse(data);
                if (Array.isArray(fallback) && !Array.isArray(parsed)) return fallback;
                return parsed;
            } catch (e) { return fallback; }
        };

        const generateId = (prefix) => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).substr(2, 5)}`;
        
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="h-[100dvh] bg-red-50 p-8 flex flex-col items-center justify-center text-center">
                            <i className="ph ph-warning-circle text-red-500 mb-4 text-6xl"></i>
                            <h1 className="text-3xl font-bold text-red-600 mb-2">⚠️ ระบบขัดข้อง</h1>
                            <p className="text-red-500 mb-4 text-sm font-medium">ตรวจพบข้อผิดพลาด หรืออินเทอร์เน็ตไม่เสถียร<br/>กรุณากดปุ่มด้านล่างเพื่อเริ่มใหม่</p>
                            <button onClick={() => { 
                                safeRemoveItem('zc26_rooms'); safeRemoveItem('zc26_inspectors'); 
                                safeRemoveItem('zc26_inspections'); safeRemoveItem('zc26_settings'); 
                                window.location.reload(); 
                            }} className="mt-6 px-6 py-3 bg-[#C8102E] text-white font-medium rounded-xl shadow-lg">รีเซ็ตและโหลดใหม่</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const initialSettings = { 
            passcode: "1234", master_passcode: "9999", is_maintenance: "false", 
            app_logo_url: "", logo_url: "", school_logo_url: "", zone_map_url: "", room_map_url: "",
            banner_url: "", main_banner_url: "", popup_banner_url: "", 
            announcement_title: "", announcement_msg: "",
            visibility_main_banner: "public", visibility_popup_banner: "public", visibility_announce_banner: "public",
            admin_avatar_url: ADMIN_AVATAR_URL,
            admin_name: "นายภูธนากร หงษ์ทอง (พี่ภีม)",
            admin_role: "เลขานุการสภานักเรียนโรงเรียนคำม่วง",
            admin_line_url: "https://line.me/ti/p/~470aijh"
        };
        
        const ROOM_CRITERIA = [
            { id: 'c1', name: "โต๊ะ" }, { id: 'c2', name: "ขยะ" },
            { id: 'c3', name: "ไฟ/หน้าต่าง" }, { id: 'c4', name: "พื้น" }, { id: 'c5', name: "กระดาน" }
        ];

        const formatThaiDateForFile = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${String(d.getDate()).padStart(2,'0')}_${months[d.getMonth()]}_${d.getFullYear()+543}`;
        };

        const formatDateObj = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return 'วันที่ไม่ระบุ';
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
        };

        const formatMonthYearShort = (dateStr) => {
            if(!dateStr) return '';
            const parts = dateStr.split('-');
            if(parts.length !== 2) return dateStr;
            const [year, month] = parts;
            const monthsShort = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${monthsShort[parseInt(month)-1] || month} ${parseInt(year)+543}`;
        };
        
        const formatMonthYearThai = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            return `${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`;
        };

        function ZoneCheckApp() {
            const [appMode, setAppMode] = useState('guest'); 
            const [currentRoute, setCurrentRoute] = useState('dashboard'); 
            const [showSplash, setShowSplash] = useState(true); 
            const [toastObj, setToastObj] = useState({ msg: '', type: 'info' });
            const [isSyncing, setIsSyncing] = useState(false);

            // States ล็อกอิน & เพื่อนร่วมทีม
            const [logoTaps, setLogoTaps] = useState(0);
            const tapTimeoutRef = useRef(null);
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
            const [inputPasscode, setInputPasscode] = useState('');
            const [loginInspector, setLoginInspector] = useState(() => safeGetItem('zc26_last_user') || '');
            const [selectedLoginName, setSelectedLoginName] = useState(() => safeGetItem('zc26_last_user') || ''); 
            const [coInspectors, setCoInspectors] = useState([]);
            const [showCoInspectorPicker, setShowCoInspectorPicker] = useState(false);
            const [coInspectorSearch, setCoInspectorSearch] = useState('');
            const [loginError, setLoginError] = useState('');
            const [showPasscode, setShowPasscode] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [showLoginSuggestions, setShowLoginSuggestions] = useState(false);

            const loadDataSafe = (key, fallback) => {
                const data = safeGetItem(key);
                return safeParse(data, fallback);
            };

            const [rooms, setRooms] = useState(() => loadDataSafe('zc26_rooms', []));
            const [inspectors, setInspectors] = useState(() => loadDataSafe('zc26_inspectors', []));
            const [inspections, setInspections] = useState(() => loadDataSafe('zc26_inspections', []));
            const [settings, setSettings] = useState(() => loadDataSafe('zc26_settings', initialSettings));

            const [isSavingData, setIsSavingData] = useState(false);
            const [savingCountdown, setSavingCountdown] = useState(0);
            const [savingTotalTime, setSavingTotalTime] = useState(0);
            const [savingStatusText, setSavingStatusText] = useState('');
            const [isImageProcessing, setIsImageProcessing] = useState(false);
            
            const [guestSearch, setGuestSearch] = useState('');
            const [guestFilterGroup, setGuestFilterGroup] = useState('all'); 
            const [guestFilterType, setGuestFilterType] = useState('all');
            const [guestAdvancedFilter, setGuestAdvancedFilter] = useState('all');
            
            const [dateMode, setDateMode] = useState('today'); 
            const [filterDate, setFilterDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [selectedMonth, setSelectedMonth] = useState(() => new Date().toISOString().slice(0, 7)); 
            
            const [leaderboardTab, setLeaderboardTab] = useState('all'); 
            
            const [exportSortOrder, setExportSortOrder] = useState('score'); 
            const [excelMode, setExcelMode] = useState('single'); 
            const [exportDestination, setExportDestination] = useState('local');

            const [historyViewMode, setHistoryViewMode] = useState('table'); 
            const [historyCalendarMonth, setHistoryCalendarMonth] = useState(() => new Date().toISOString().slice(0, 7));
            const [calendarTypeFilter, setCalendarTypeFilter] = useState('room');

            // Inspection Modal State
            const [inspectSearchRoom, setInspectSearchRoom] = useState('');
            const [inspectModal, setInspectModal] = useState({ isOpen: false, room: null, type: 'room', date: new Date().toISOString().split('T')[0] });
            const [roomScores, setRoomScores] = useState({ c1: 2, c2: 2, c3: 2, c4: 2, c5: 2, noDuty: false });
            const [zoneScore, setZoneScore] = useState(10); 
            const [evalComment, setEvalComment] = useState('');
            const [isSkipped, setIsSkipped] = useState(false); 
            const [inspectImage, setInspectImage] = useState(null); 
            const fileInputRef = useRef(null);
            // Batch Inspection Modal State (ปุ่มใหญ่ตรวจรวดเดียว กรณีฉุกเฉิน)
            const [batchModal, setBatchModal] = useState({
                isOpen: false,
                type: 'room',
                isSkipped: false,
                roomScores: { c1: 2, c2: 2, c3: 2, c4: 2, c5: 2, noDuty: false },
                zoneScore: 10,
                gradeFilter: 'all',
                comment: ''
            });

            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, message: '', onConfirm: null, isAlert: false });
            const [viewDetailModal, setViewDetailModal] = useState(null);
            const [showInfoModal, setShowInfoModal] = useState(false);
            const [showAnnouncement, setShowAnnouncement] = useState(false);
            const [showZoneMap, setShowZoneMap] = useState(false); 
            const [showRoomMap, setShowRoomMap] = useState(false); 
            const [showMainBannerPopup, setShowMainBannerPopup] = useState(false);
            const [hideBannerFor7Days, setHideBannerFor7Days] = useState(false);
            const [printData, setPrintData] = useState({ isPreparing: false, format: null, mode: null, title: '', subtitle: '', dateText: '', data: [] });
            const [showPaperSheetModal, setShowPaperSheetModal] = useState(false);
            const [paperSheetGradeFilter, setPaperSheetGradeFilter] = useState('all');
            const [paperIncludeDate, setPaperIncludeDate] = useState(false);
            const [paperIncludeInspector, setPaperIncludeInspector] = useState(false);

            // OMR Scanner State (เครื่องตรวจกระดาษคำตอบ)
            const [omrScannerModal, setOmrScannerModal] = useState({
                isOpen: false,
                isScanning: false,
                imagePreview: null,
                annotatedPreview: null,
                sensitivity: 50,
                results: []
            });
            const omrFileInputRef = useRef(null);
            const omrRawImageRef = useRef(null);

            // Admin Settings Inputs
            const [bulkRooms, setBulkRooms] = useState('');
            const [bulkInspectors, setBulkInspectors] = useState('');
            const [maintenanceToggle, setMaintenanceToggle] = useState(false);
            const [maintenanceMsg, setMaintenanceMsg] = useState('');
            const [appLogoInput, setAppLogoInput] = useState('');
            const [logoInput, setLogoInput] = useState('');
            const [schoolLogoInput, setSchoolLogoInput] = useState('');
            const [zoneMapInput, setZoneMapInput] = useState(''); 
            const [roomMapInput, setRoomMapInput] = useState(''); 
            const [mainBannerInput, setMainBannerInput] = useState(''); 
            const [popupBannerInput, setPopupBannerInput] = useState(''); 
            const [announceBannerInput, setAnnounceBannerInput] = useState(''); 
            const [announcementTitleInput, setAnnouncementTitleInput] = useState('');
            const [announcementInput, setAnnouncementInput] = useState('');
            const [visMainBanner, setVisMainBanner] = useState('public');
            const [visPopupBanner, setVisPopupBanner] = useState('public');
            const [visAnnounceBanner, setVisAnnounceBanner] = useState('public');
            const [adminAvatarInput, setAdminAvatarInput] = useState(ADMIN_AVATAR_URL);
            const [adminNameInput, setAdminNameInput] = useState('นายภูธนากร หงษ์ทอง (พี่ภีม)');
            const [adminRoleInput, setAdminRoleInput] = useState('เลขานุการสภานักเรียนโรงเรียนคำม่วง');
            const [adminLineInput, setAdminLineInput] = useState('https://line.me/ti/p/~470aijh');
            const [sysPasscode, setSysPasscode] = useState('');
            const [sysMasterPasscode, setSysMasterPasscode] = useState('');

            useEffect(() => {
                if (settings) {
                    setMaintenanceToggle(String(settings.is_maintenance).toLowerCase() === 'true');
                    setMaintenanceMsg(settings.maintenance_msg || '⚠️ ระบบกำลังปิดปรับปรุงชั่วคราว\nขออภัยในความไม่สะดวกมา ณ ที่นี้');
                    setAppLogoInput(settings.app_logo_url || '');
                    setLogoInput(settings.logo_url || '');
                    setSchoolLogoInput(settings.school_logo_url || '');
                    setZoneMapInput(settings.zone_map_url || ''); 
                    setRoomMapInput(settings.room_map_url || ''); 
                    setMainBannerInput(settings.main_banner_url || '');
                    setPopupBannerInput(settings.popup_banner_url || '');
                    setAnnounceBannerInput(settings.announce_banner_url || settings.banner_url || '');
                    setAnnouncementTitleInput(settings.announcement_title || '');
                    setAnnouncementInput(settings.announcement_msg || '');
                    setVisMainBanner(settings.visibility_main_banner || 'public');
                    setVisPopupBanner(settings.visibility_popup_banner || 'public');
                    setVisAnnounceBanner(settings.visibility_announce_banner || 'public');
                    setAdminAvatarInput(settings.admin_avatar_url || ADMIN_AVATAR_URL);
                    setAdminNameInput(settings.admin_name || 'นายภูธนากร หงษ์ทอง (พี่ภีม)');
                    setAdminRoleInput(settings.admin_role || 'เลขานุการสภานักเรียนโรงเรียนคำม่วง');
                    setAdminLineInput(settings.admin_line_url || 'https://line.me/ti/p/~470aijh');
                    setSysPasscode(settings.passcode || '1234');
                    setSysMasterPasscode(settings.master_passcode || '9999');
                }
            }, [settings]);
            
            useEffect(() => {
                if (currentRoute === 'history') {
                    setExportSortOrder('room'); 
                    setExcelMode('single');
                    setHistoryViewMode('table'); 
                } else if (currentRoute === 'leaderboard') {
                    setExportSortOrder('score'); 
                }
            }, [currentRoute]);

            useEffect(() => { setGuestAdvancedFilter('all'); }, [guestFilterType]);

            useEffect(() => {
                if (currentRoute !== 'leaderboard' && excelMode === 'months') {
                    setExcelMode('single');
                }
            }, [currentRoute]);

            const canViewBanner = (visibilitySetting) => {
                if (!visibilitySetting || visibilitySetting === 'public') return true;
                if (visibilitySetting === 'inspector' && (appMode === 'admin' || appMode === 'inspector')) return true;
                if (visibilitySetting === 'guest' && appMode === 'guest') return true;
                return false;
            };

            useEffect(() => {
                if (settings?.popup_banner_url && !showSplash) {
                    if (!canViewBanner(settings.visibility_popup_banner)) return;
                    const hiddenUntil = safeGetItem('zc26_hide_banner_until');
                    if (hiddenUntil) {
                        const now = new Date().getTime();
                        if (now < parseInt(hiddenUntil)) {
                            setShowMainBannerPopup(false);
                            return;
                        } else {
                            safeRemoveItem('zc26_hide_banner_until');
                        }
                    }
                    setTimeout(() => { setShowMainBannerPopup(true); }, 500);
                }
            }, [settings?.popup_banner_url, settings?.visibility_popup_banner, appMode, showSplash]);

            const handleCloseMainBannerPopup = () => {
                if (hideBannerFor7Days) {
                    const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
                    const expireTime = new Date().getTime() + sevenDaysInMs;
                    safeSetItem('zc26_hide_banner_until', expireTime.toString());
                }
                setShowMainBannerPopup(false);
            };

            const showToast = (msg, type = 'info') => {
                let finalType = type;
                if (msg.includes('สำเร็จ') || msg.includes('เรียบร้อย') || msg.includes('เข้าสู่ระบบ')) finalType = 'success';
                else if (msg.includes('ล้มเหลว') || msg.includes('ผิดพลาด') || msg.includes('❌')) finalType = 'error';
                else if (msg.includes('⚠️') || msg.includes('อยู่แล้ว')) finalType = 'warning';
                setToastObj({ msg, type: finalType });

            }, [inspectors, selectedLoginName, loginInspector, coInspectorSearch]);

            const handleSync = async () => {
                setIsSyncing(true);
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                try {
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getInitialData&_t=${Date.now()}`, {
                        method: 'GET',
                        redirect: 'follow',
                        headers: { 'Accept': 'application/json' },
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    const textData = await response.text();
                    let json = null;
                    try {
                        json = JSON.parse(textData);
                    } catch (parseErr) {
                        throw new Error('รูปแบบข้อมูลจากเซิร์ฟเวอร์ไม่ถูกต้อง (โปรดตรวจสอบการ Deploy เป็น Anyone)');
                    }
                    
                    if (json && json.status === 'Success') {
                        setRooms(Array.isArray(json.rooms) ? json.rooms : []);
                        setInspectors(Array.isArray(json.inspectors) ? json.inspectors : []);
                        setInspections(Array.isArray(json.inspections) ? json.inspections : []);
                        setSettings(json.settings ? { ...initialSettings, ...json.settings } : initialSettings);
                        if (json.settings && String(json.settings.is_maintenance).toLowerCase() !== 'true' && !showSplash) {
                            showToast(`ซิงค์ข้อมูลสำเร็จ (${(json.rooms || []).length} ห้อง, ${(json.inspectors || []).length} ผู้ตรวจ)`, 'success');
                        }
                    } else if (json && json.status === 'Error') {
                        if (!showSplash) showToast(`หลังบ้านแจ้งเตือน: ${json.message}`, 'error');
                    }
                } catch (err) {
                    if (!showSplash) showToast('เชื่อมต่อฐานข้อมูลล้มเหลว กรุณาตรวจสอบลิงก์หรืออินเทอร์เน็ต', 'error');
                } finally {
                    clearTimeout(timeoutId);
                    setIsSyncing(false);
                    setShowSplash(false);
                }
            };

            useEffect(() => { 
                handleSync();

                return () => clearTimeout(splashSafetyTimer);
            }, []);

            useEffect(() => {
                try {

                    safeSetItem('zc26_inspectors', JSON.stringify(inspectors));
                    safeSetItem('zc26_inspections', JSON.stringify(inspections));
                    safeSetItem('zc26_settings', JSON.stringify(settings));
                } catch (error) { console.warn('LocalStorage Blocked'); }
            }, [rooms, inspectors, inspections, settings]);

            const syncToGASAsync = async (action, data) => {
                const payload = { action, data };
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const json = await res.json();
                    if (json.status !== 'Success') throw new Error(json.message || 'Unknown Error');
                    return json;
                } catch (err) {
                    throw new Error(err.message || 'Network Error');
                }
            };

            const uploadFileToGoogleDrive = async (fileName, base64Data, mimeType) => {
                const thaiMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
                const d = new Date();
                const currentMonthYear = `${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`;
                
                showToast(`กำลังส่งไฟล์เข้า Google Drive...`, 'info');
                
                if (base64Data.length > 6000000) { 
                    showAlertMsg("❌ ไฟล์มีขนาดใหญ่เกินกว่าที่ระบบ Google Drive จะรับได้อัตโนมัติ\nกรุณาเลือกดาวน์โหลด 'ลงเครื่อง' แทนครับ");
                    return Promise.reject('File too large');
                }

                try {
                    const actionName = mimeType.startsWith('image/') ? 'saveImageToDrive' : 'saveFileToDrive';
                    const res = await syncToGASAsync(actionName, {
                        fileName, base64: base64Data, mimeType, monthYear: currentMonthYear
                    });

                    if(res && res.status === 'Success') {
                        showToast('บันทึกไฟล์ลง Google Drive สำเร็จ!', 'success');
                        return res.url;
                    } else {
                        throw new Error(res.message || 'Unknown Server Error');
                    }
                } catch (error) {
                    showAlertMsg('❌ การเชื่อมต่อล้มเหลว!\nไม่สามารถส่งไฟล์ไปที่ Google Drive ได้\nError: ' + error.message);
                    throw error;
                }
            };

            const handleOpenInspect = (room, type) => {
                const targetDateStr = filterDate || new Date().toISOString().split('T')[0];
                const validInspections = Array.isArray(inspections) ? inspections : [];
                const existInsp = validInspections.find(i => i.roomId === room.id && i.type === type && i.date && String(i.date).startsWith(targetDateStr));
                
                if(existInsp) { 
                    showToast(`ห้องนี้มีผลตรวจของวันที่ ${formatDateObj(targetDateStr)} อยู่แล้วครับ`, 'warning'); 
                } else {
                    setEvalComment('');
                    setInspectImage(null);
                    setIsSkipped(false);
                    if(type === 'room') setRoomScores({ c1: 2, c2: 2, c3: 2, c4: 2, c5: 2, noDuty: false }); else setZoneScore(10);
                    setInspectModal({ isOpen: true, room: room, type: type, date: targetDateStr });
                }
            };

            const toggleRoomScore = (cId) => {
                if(isSkipped) return; 
                setRoomScores(prev => ({ ...prev, [cId]: prev[cId] === 0 ? 2 : 0 }));
            };
            
            const handleToggleNoDuty = () => { if(isSkipped) return; setRoomScores(prev => ({ ...prev, noDuty: !prev.noDuty })); };
            const handleToggleSkip = () => { setIsSkipped(!isSkipped); };

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                
                setIsImageProcessing(true);
                showToast("กำลังประมวลผลรูปลายน้ำ...", 'info');

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 1200; const MAX_HEIGHT = 1200;
                            let width = img.width; let height = img.height;
                            
                            if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                            else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                            
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            const roomName = inspectModal.room ? (inspectModal.room.name || '').replace('ม.', '') : 'ไม่ระบุ';
                            const now = new Date();
                            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                            const dateStr = `${String(now.getDate()).padStart(2, '0')} ${months[now.getMonth()]} ${now.getFullYear() + 543}`;
                            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} น.`;
                            
                            const text1 = `ห้อง: ม.${roomName}`;
                            const text2 = `${dateStr} | เวลา ${timeStr}`;

                            ctx.font = "bold 36px 'Noto Sans Thai', sans-serif";
                            const text1Width = ctx.measureText(text1).width;
                            ctx.font = "24px 'Noto Sans Thai', sans-serif";
                            const text2Width = ctx.measureText(text2).width;
                            
                            const padding = 20;
                            const boxWidth = Math.max(text1Width, text2Width) + (padding * 2);
                            const boxHeight = 110; 
                            
                            const boxX = 20; const boxY = height - boxHeight - 20;

                            ctx.fillStyle = "rgba(200, 16, 46, 0.75)";
                            ctx.beginPath();
                            if(ctx.roundRect) ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 14); 
                            else ctx.rect(boxX, boxY, boxWidth, boxHeight);
                            ctx.fill();

                            ctx.fillStyle = "#ffffff";
                            ctx.textAlign = "left"; ctx.textBaseline = "top";
                            ctx.font = "bold 36px 'Noto Sans Thai', sans-serif";
                            ctx.fillText(text1, boxX + padding, boxY + padding);
                            ctx.font = "22px 'Noto Sans Thai', sans-serif";
                            ctx.fillText(text2, boxX + padding, boxY + padding + 48);
                            
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                            let base64Only = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
                            
                            setInspectImage({ fileName: file.name, base64: base64Only, mimeType: 'image/jpeg', dataUrl: dataUrl });
                            showToast("สร้างลายน้ำสำเร็จ", 'success');
                        } catch (err) {
                            showAlertMsg("❌ เกิดข้อผิดพลาดในการสร้างลายน้ำ: " + err.message);
                        } finally {
                            setIsImageProcessing(false);
                        }
                    };
                    img.onerror = () => { setIsImageProcessing(false); showAlertMsg("❌ ไม่สามารถโหลดรูปภาพนี้ได้"); };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const removeImage = () => { setInspectImage(null); if(fileInputRef.current) fileInputRef.current.value = ''; };

            const handleSubmitInspection = async () => {
                if (isImageProcessing) return showToast('กรุณารอสักครู่ กำลังวาดลายน้ำ...', 'warning');
                const loc = inspectModal.room; const type = inspectModal.type; if(!loc) return;
                
                if (isSkipped && (!evalComment || !evalComment.trim())) return showToast('⚠️ กรุณาระบุ "หมายเหตุ" เมื่อเลือกข้ามการตรวจด้วยครับ', 'warning');

                let totalScore = 0; let breakdown = {};
                
                if (isSkipped) {
                    totalScore = null; breakdown = { status: 'ข้ามการตรวจ' };
                } else {
                    if (type === 'room') {
                        if (roomScores.noDuty) {
                            totalScore = -5; breakdown = { status: 'ไม่ปฏิบัติหน้าที่' };
                        } else {
                            totalScore = (roomScores.c1 + roomScores.c2 + roomScores.c3 + roomScores.c4 + roomScores.c5); 
                            breakdown = { c1: roomScores.c1, c2: roomScores.c2, c3: roomScores.c3, c4: roomScores.c4, c5: roomScores.c5 }; 
                        }
                    } else {
                        totalScore = zoneScore;
                        let sText = zoneScore === 10 ? 'ดีเยี่ยม' : zoneScore === 8 ? 'ดี' : zoneScore === 5 ? 'พอใช้' : zoneScore === 2 ? 'ปรับปรุง' : 'ไม่ปฏิบัติหน้าที่';
                        breakdown = { status: sText };
                    }
                }

                let finalDateISO = new Date().toISOString();
                if (inspectModal.date) {
                    const timePart = finalDateISO.split('T')[1];
                    finalDateISO = `${inspectModal.date}T${timePart}`;
                }

                setIsSavingData(true);
                try {
                    let photoUrl = '';
                    if (inspectImage && inspectImage.base64) {
                        showToast('กำลังอัปโหลดรูปภาพหลักฐานลง Google Drive...', 'info');
                        const targetMonthYear = formatMonthYearThai(inspectModal.date); 
                        const roomFileName = `${(loc.name||'').replace(/\//g,'-')}_${inspectModal.date}.jpg`;
                        
                        try {
                            const uploadRes = await syncToGASAsync('saveImageToDrive', {
                                fileName: roomFileName, base64: inspectImage.base64, mimeType: inspectImage.mimeType, monthYear: targetMonthYear
                            });
                            photoUrl = uploadRes.url;
                        } catch (err) {
                            showAlertMsg('❌ อัปโหลดรูปภาพไม่สำเร็จ (แต่จะบันทึกคะแนนให้ปกติ):\n' + err.message);
                        }
                    }

                    const newInsp = { 
                        id: generateId('insp'), roomId: loc.id, type: type, date: finalDateISO, 
                        inspector: getActiveInspectorTeamString(), scores: breakdown, totalScore, comment: evalComment, photoUrl: photoUrl 
                    };

                    await syncToGASAsync('saveInspection', newInsp);
                    const validInspections = Array.isArray(inspections) ? inspections : [];
                    setInspections([...validInspections, newInsp]); 
                    showToast(`บันทึกผลของวันที่ ${formatDateObj(inspectModal.date)} สำเร็จ!`, 'success'); 
                    setInspectModal({ isOpen: false, room: null, type: 'room', date: new Date().toISOString().split('T')[0] });
                } catch(e) { 
                    showToast('บันทึกไม่สำเร็จ กรุณาลองใหม่', 'error'); 
                } finally { 
                    setIsSavingData(false); 
                }
            };

            // คำนวณรายชื่อห้องที่ยังไม่ได้ตรวจสำหรับปุ่มใหญ่ "ตรวจรวดเดียว"
            const remainingRoomsForBatch = useMemo(() => {
                const targetDateStr = filterDate || new Date().toISOString().split('T')[0];
                const validRooms = Array.isArray(rooms) ? rooms : [];
                const validInspections = Array.isArray(inspections) ? inspections : [];

                return validRooms.filter(r => {
                    if (batchModal.type === 'zone' && r.hasZone === false) return false;
                    if (batchModal.gradeFilter !== 'all') {
                        const match = (r.name || '').match(/(\d+)/);
                        const gGrade = match ? match[1] : '';
                        if (gGrade !== batchModal.gradeFilter) return false;
                    }
                    const alreadyChecked = validInspections.some(
                        i => i.roomId === r.id && i.type === batchModal.type && i.date && String(i.date).startsWith(targetDateStr)
                    );
                    return !alreadyChecked;
                });
            }, [rooms, inspections, filterDate, batchModal.type, batchModal.gradeFilter]);

            const toggleBatchRoomScore = (cId) => {
                if (batchModal.isSkipped) return;
                setBatchModal(prev => ({
                    ...prev,
                    roomScores: { ...prev.roomScores, [cId]: prev.roomScores[cId] === 0 ? 2 : 0 }
                }));
            };

            const handleToggleBatchNoDuty = () => {
                if (batchModal.isSkipped) return;
                setBatchModal(prev => ({
                    ...prev,
                    roomScores: { ...prev.roomScores, noDuty: !prev.roomScores.noDuty }
                }));
            };

            const handleToggleBatchSkip = () => {
                setBatchModal(prev => ({ ...prev, isSkipped: !prev.isSkipped }));
            };

            const handleExecuteBatchInspect = () => {
                if (remainingRoomsForBatch.length === 0) {
                    return showToast('ไม่มีห้องที่ยังไม่ได้ตรวจในหมวดนี้ครับ', 'warning');
                }
                if (batchModal.isSkipped && !batchModal.comment.trim()) {
                    return showToast('กรุณาระบุหมายเหตุสำหรับการข้ามการตรวจด้วยครับ', 'warning');
                }

                const targetDateStr = filterDate || new Date().toISOString().split('T')[0];
                const typeLabel = batchModal.type === 'room' ? 'ห้องเรียน' : 'เขตพื้นที่';
                let scoreDesc = '';
                if (batchModal.isSkipped) {
                    scoreDesc = 'ข้ามการตรวจ (ไม่มีคะแนน)';
                } else if (batchModal.type === 'room') {
                    if (batchModal.roomScores.noDuty) {
                        scoreDesc = 'ไม่ปฏิบัติหน้าที่ (-5 คะแนน)';
                    } else {
                        const sum = batchModal.roomScores.c1 + batchModal.roomScores.c2 + batchModal.roomScores.c3 + batchModal.roomScores.c4 + batchModal.roomScores.c5;
                        scoreDesc = `คะแนนรวม ${sum > 0 ? '+' + sum : sum} คะแนน`;
                    }
                } else {
                    const zMap = { 10: 'ดีเยี่ยม (+10)', 8: 'ดี (+8)', 5: 'พอใช้ (+5)', 2: 'ปรับปรุง (+2)', '-5': 'ไม่ปฏิบัติหน้าที่ (-5)' };
                    scoreDesc = zMap[String(batchModal.zoneScore)] || `${batchModal.zoneScore} คะแนน`;
                }

                showConfirm(
                    `ยืนยันการตรวจรวดเดียว (กรณีฉุกเฉิน) จำนวน ${remainingRoomsForBatch.length} ห้อง?\nหมวด: ${typeLabel}\nผลการประเมิน: ${scoreDesc}\nประจำวันที่: ${formatDateObj(targetDateStr)}`,
                    async () => {
                        const estSeconds = Math.max(4, Math.min(15, Math.ceil(remainingRoomsForBatch.length * 0.18)));
                        setSavingTotalTime(estSeconds);
                        setSavingCountdown(estSeconds);
                        setSavingStatusText(`กำลังบันทึกข้อมูล ${remainingRoomsForBatch.length} ห้อง กรุณาอย่าเพิ่งกดออก...`);
                        setIsSavingData(true);

                        const countdownInterval = setInterval(() => {
                            setSavingCountdown(prev => (prev > 1 ? prev - 1 : 1));
                        }, 1000);

                        try {
                            const timePart = new Date().toISOString().split('T')[1];
                            const finalDateISO = `${targetDateStr}T${timePart}`;
                            const inspectorTeam = getActiveInspectorTeamString();

                            const newRecords = remainingRoomsForBatch.map(r => {
                                let totalScore = 10;
                                let breakdown = {};

                                    breakdown = { status: 'ข้ามการตรวจ' };
                                } else if (batchModal.type === 'room') {

                                        totalScore = batchModal.roomScores.c1 + batchModal.roomScores.c2 + batchModal.roomScores.c3 + batchModal.roomScores.c4 + batchModal.roomScores.c5;

                                            c3: batchModal.roomScores.c3,
                                            c4: batchModal.roomScores.c4,
                                            c5: batchModal.roomScores.c5
                                        };
                                    }
                                } else {
                                    totalScore = batchModal.zoneScore;
                                    const sText = batchModal.zoneScore === 10 ? 'ดีเยี่ยม' : batchModal.zoneScore === 8 ? 'ดี' : batchModal.zoneScore === 5 ? 'พอใช้' : batchModal.zoneScore === 2 ? 'ปรับปรุง' : 'ไม่ปฏิบัติหน้าที่';
                                    breakdown = { status: sText };

                                return {
                                    id: generateId('insp'),
                                    roomId: r.id,
                                    type: batchModal.type,
                                    date: finalDateISO,
                                    inspector: inspectorTeam,
                                    scores: breakdown,
                                    totalScore,
                                    comment: batchModal.comment.trim() || '',
                                    photoUrl: ''
                                };
                            });

                            try {
                                await syncToGASAsync('saveBatchInspections', newRecords);
                            } catch (batchErr) {
                                for (let idx = 0; idx < newRecords.length; idx++) {
                                    setSavingStatusText(`กำลังบันทึกห้องที่ ${idx + 1} จาก ${newRecords.length} ห้อง...`);
                                    setSavingCountdown(Math.max(1, newRecords.length - idx));
                                    await syncToGASAsync('saveInspection', newRecords[idx]);

                            const validInspections = Array.isArray(inspections) ? inspections : [];

            const processOmrImageWithSensitivity = (imgElement, sensValue = 50) => {
                if (!imgElement) return;
                try {
                    const W = 1122;
                    const H = 793;
                    const canvas = document.createElement('canvas');
                    canvas.width = W;
                    canvas.height = H;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(imgElement, 0, 0, W, H);
                    const imgData = ctx.getImageData(0, 0, W, H).data;

                    const getPixelDarkness = (x, y) => {
                        const px = Math.max(0, Math.min(W - 1, Math.round(x)));
                        const py = Math.max(0, Math.min(H - 1, Math.round(y)));
                        const idx = (py * W + px) * 4;
                        const lum = 0.299 * imgData[idx] + 0.587 * imgData[idx + 1] + 0.114 * imgData[idx + 2];
                        return 255 - lum;
                    };

                    // 1. ค้นหาจุดมาร์คสี่เหลี่ยมสีดำทั้ง 4 มุมอัตโนมัติ (Corner fiducial detection)
                    const findDarkestBlockInCorner = (startX, endX, startY, endY, defaultX, defaultY) => {
                        let bestX = defaultX;
                        let bestY = defaultY;
                        let maxScore = -1;
                        const step = 3;
                        for (let y = startY; y <= endY; y += step) {
                            for (let x = startX; x <= endX; x += step) {
                                let sum = 0;
                                for (let dy = -4; dy <= 4; dy += 2) {
                                    for (let dx = -4; dx <= 4; dx += 2) {
                                        sum += getPixelDarkness(x + dx, y + dy);
                                    }
                                }
                                if (sum > maxScore) {
                                    maxScore = sum;
                                    bestX = x;
                                    bestY = y;
                                }
                            }
                        }
                        // ถ้าความเข้มต่ำเกินไป (เช่น ภาพตัดขอบมาร์คหาย) ให้ใช้พิกัดมาตรฐานของกระดาษ
                        if (maxScore / 25 < 95) return { x: defaultX, y: defaultY, found: false };
                        return { x: bestX, y: bestY, found: true };
                    };

                    const tl = findDarkestBlockInCorner(8, Math.floor(W * 0.22), 8, Math.floor(H * 0.22), 44, 26);
                    const tr = findDarkestBlockInCorner(Math.floor(W * 0.78), W - 8, 8, Math.floor(H * 0.22), W - 44, 26);
                    const bl = findDarkestBlockInCorner(8, Math.floor(W * 0.22), Math.floor(H * 0.78), H - 8, 44, H - 26);
                    const br = findDarkestBlockInCorner(Math.floor(W * 0.78), W - 8, Math.floor(H * 0.78), H - 8, W - 44, H - 26);

                    // ฟังก์ชันแปลงสัดส่วนสัมพัทธ์ (u, v) ภายในกรอบมาร์ค 4 มุม เป็นพิกัด (X, Y) จริงบนรูป
                    const mapUV = (u, v) => {
                        const topX = tl.x + u * (tr.x - tl.x);
                        const topY = tl.y + u * (tr.y - tl.y);
                        const botX = bl.x + u * (br.x - bl.x);
                        const botY = bl.y + u * (br.y - bl.y);
                        return {
                            x: topX + v * (botX - topX),
                            y: topY + v * (botY - topY)
                        };
                    };

                    // วัดค่าหมึกทั้งแบบระบายทึบ ● และกากบาท ✕ เทียบกับพื้นกระดาษขาวรอบวงกลม (Local Contrast)
                    const evaluateBubbleScore = (cx, cy) => {
                        let bgSum = 0;
                        let bgCount = 0;
                        // วัดพื้นหลังสีขาวรอบนอกวงกลม (รัศมี 9-11 px)
                        for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                            bgSum += getPixelDarkness(cx + Math.cos(angle) * 10, cy + Math.sin(angle) * 10);
                            bgCount++;
                        }
                        const localBg = bgCount > 0 ? bgSum / bgCount : 20;

                        // วัดความเข้มด้านในวงกลม + เส้นทแยงมุมกากบาท (รัศมี 0-5 px)
                        let innerSum = 0;
                        let innerCount = 0;
                        let darkStrokePixels = 0;
                        for (let dy = -5; dy <= 5; dy++) {
                            for (let dx = -5; dx <= 5; dx++) {
                                if (dx * dx + dy * dy <= 28) {
                                    const d = Math.max(0, getPixelDarkness(cx + dx, cy + dy) - localBg);
                                    innerSum += d;
                                    innerCount++;
                                    if (d > 42) darkStrokePixels++;
                                }
                            }
                        }
                        const avgContrast = innerCount > 0 ? innerSum / innerCount : 0;
                        const strokeRatio = innerCount > 0 ? (darkStrokePixels / innerCount) * 100 : 0;
                        // ผสมคะแนนทั้งความทึบเฉลี่ยและจำนวนพิกเซลเส้นกากบาท
                        return (avgContrast * 0.55) + (strokeRatio * 0.75);
                    };

                    // วาดกรอบจุดมาร์ค 4 มุมบนภาพ Preview
                    ctx.lineWidth = 2;
                    [tl, tr, bl, br].forEach(pt => {
                        ctx.strokeStyle = pt.found ? '#10b981' : '#f59e0b';
                        ctx.strokeRect(pt.x - 8, pt.y - 8, 16, 16);
                    });

                    const validRooms = Array.isArray(rooms) ? rooms : [];
                    const half = Math.ceil(Math.max(validRooms.length, 1) / 2);

                    // สัดส่วนตำแหน่งวงกลมทั้ง 13 คอลัมน์เทียบภายในตารางแต่ละฝั่ง
                    const colRelativeCenters = [
                        0.220, 0.280, 0.340, 0.400, 0.465, 0.530, 0.588, // ห้องเรียน 7 วง: โต๊ะ, ขยะ, ไฟ, พื้น, กระดาน, ไม่ทำ, ข้าม
                        0.650, 0.712, 0.772, 0.842, 0.910, 0.970         // เขตพื้นที่ 6 วง: 10, 8, 5, 2, -5, ข้าม
                    ];

                    // เกณฑ์ความไวแสง (ปรับตามแถบเลื่อน Sensitivity 10-90)
                    const markThreshold = Math.max(12, 48 - (sensValue * 0.42));

                    const scannedResults = validRooms.map((r, i) => {
                        const isRightCol = i >= half;
                        const rowIdx = isRightCol ? (i - half) : i;

                        // สัดส่วนแนวตั้ง v ของแถวที่ rowIdx เทียบกับกรอบจุดมาร์คบน-ล่าง
                        const vStart = 0.212;
                        const vEnd = 0.932;
                        const vRow = vStart + ((rowIdx + 0.5) / Math.max(half, 1)) * (vEnd - vStart);

                        // สัดส่วนแนวนอน u ของตารางฝั่งซ้าย (0.000 - 0.493) และตารางฝั่งขวา (0.507 - 1.000)
                        const uTableLeft = isRightCol ? 0.507 : 0.000;
                        const uTableWidth = 0.493;

                        const bubbleScores = colRelativeCenters.map(colRel => {
                            const uBubble = uTableLeft + (colRel * uTableWidth);
                            const pt = mapUV(uBubble, vRow);
                            const score = evaluateBubbleScore(pt.x, pt.y);
                            return { x: pt.x, y: pt.y, score };
                        });

                        const roomBubbles = bubbleScores.slice(0, 7);
                        const zoneBubbles = bubbleScores.slice(7, 13);

                        // ประมวลผลหมวดห้องเรียน (7 วง)
                        const markedRoom = roomBubbles.map(b => b.score >= markThreshold);
                        const anyRoomMarked = markedRoom.some(Boolean);

                        let c1 = 2, c2 = 2, c3 = 2, c4 = 2, c5 = 2, noDuty = false, skip = false;
                        if (anyRoomMarked) {
                            if (markedRoom[6]) {
                                skip = true;
                            } else if (markedRoom[5]) {
                                noDuty = true;
                            } else {
                                c1 = markedRoom[0] ? 2 : 0;
                                c2 = markedRoom[1] ? 2 : 0;
                                c3 = markedRoom[2] ? 2 : 0;
                                c4 = markedRoom[3] ? 2 : 0;
                                c5 = markedRoom[4] ? 2 : 0;
                            }
                        }

                        // วาดวงกลมแสดงผลที่ตรวจจับได้ลงบนภาพ (Visual Feedback)
                        roomBubbles.forEach((b, bIdx) => {
                            const isHit = markedRoom[bIdx];
                            ctx.beginPath();
                            ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                            ctx.strokeStyle = isHit ? (bIdx === 5 ? '#ef4444' : '#10b981') : 'rgba(59, 130, 246, 0.35)';
                            ctx.lineWidth = isHit ? 2 : 1;
                            ctx.stroke();
                        });

                        // ประมวลผลหมวดเขตพื้นที่ (6 วง เลือกวงที่เข้มที่สุดที่เกินเกณฑ์)
                        const zoneValues = [10, 8, 5, 2, -5, null];
                        let zScore = 10;
                        let zSkip = false;
                        let maxZIdx = -1;
                        if (r.hasZone !== false) {
                            let maxZVal = -1;
                            zoneBubbles.forEach((b, idx) => {
                                if (b.score > maxZVal) {
                                    maxZVal = b.score;
                                    maxZIdx = idx;
                                }
                            });
                            if (maxZVal >= markThreshold && maxZIdx !== -1) {
                                if (zoneValues[maxZIdx] === null) zSkip = true;
                                else zScore = zoneValues[maxZIdx];
                            } else {
                                maxZIdx = -1;
                            }

                            zoneBubbles.forEach((b, bIdx) => {
                                const isHit = bIdx === maxZIdx;
                                ctx.beginPath();
                                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                                ctx.strokeStyle = isHit ? '#d946ef' : 'rgba(217, 70, 239, 0.35)';
                                ctx.lineWidth = isHit ? 2 : 1;
                                ctx.stroke();
                            });
                        }

                        return {
                            room: r,
                            index: i + 1,
                            includeRoom: true,
                            includeZone: r.hasZone !== false,
                            roomScores: { c1, c2, c3, c4, c5, noDuty, skip },
                            zoneScore: zScore,
                            zoneSkip: zSkip
                        };
                    });

                    const annotatedUrl = canvas.toDataURL('image/jpeg', 0.85);
                    setOmrScannerModal(prev => ({
                        ...prev,
                        isScanning: false,
                        annotatedPreview: annotatedUrl,
                        results: scannedResults
                    }));
                } catch (err) {
                    setOmrScannerModal(prev => ({ ...prev, isScanning: false }));
                    showToast('อ่านภาพเสร็จสิ้น กรุณาตรวจสอบคะแนนด้านล่าง', 'info');
                }
            };

                    {/* Loading Overlay (พร้อมตัวนับเวลาถอยหลังและแถบเปอร์เซ็นต์) */}
                    {isSavingData && (
                        <div className="fixed inset-0 z-[99999] bg-gray-900/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
                            <div className="relative w-24 h-24 flex items-center justify-center mb-4">
                                <i className="ph ph-spinner text-[#C8102E] text-7xl animate-spin"></i>
                                {savingCountdown > 0 && (
                                    <span className="absolute text-white font-black text-xl">{savingCountdown}s</span>
                                )}
                            </div>
                            <h2 className="text-xl sm:text-2xl font-black text-white mt-1">
                                {savingStatusText || 'กำลังบันทึกข้อมูล...'}
                            </h2>
                            {savingCountdown > 0 && (
                                <div className="w-full max-w-xs mt-4 space-y-2">
                                    <div className="w-full bg-white/15 h-2.5 rounded-full overflow-hidden">
                                        <div
                                            className="bg-gradient-to-r from-[#C8102E] to-amber-400 h-full rounded-full transition-all duration-500"
                                            style={{ width: `${Math.min(95, Math.max(10, Math.round(((savingTotalTime - savingCountdown + 1) / Math.max(savingTotalTime, 1)) * 100)))}%` }}
                                        ></div>
                                    </div>
                                    <p className="text-xs font-bold text-amber-300">
                                        เหลือเวลาประมาณ {savingCountdown} วินาที • กรุณาอย่าเพิ่งปิดหรือออกจากหน้านี้
                                    </p>
                                </div>
                            )}
                        </div>
                    )}
                    
                    {/* Top-Right Modern Toast Notification */}
                    {toastObj.msg && (
                        <div className="fixed top-4 right-4 left-4 sm:left-auto sm:w-auto sm:min-w-[300px] z-[999999] animate-in slide-in-from-top-4 fade-in duration-200 pointer-events-none flex justify-end">
                            <div className={`px-4 py-3.5 rounded-2xl shadow-xl border backdrop-blur-xl flex items-center gap-3 text-xs sm:text-sm font-bold ${
                                toastObj.type === 'success' ? 'bg-white/95 border-emerald-200 text-emerald-700' :
                                toastObj.type === 'error' ? 'bg-white/95 border-red-200 text-red-600' :
                                toastObj.type === 'warning' ? 'bg-white/95 border-amber-200 text-amber-700' :
                                'bg-white/95 border-gray-200 text-gray-800'
                            }`}>
                                <div className={`w-7 h-7 rounded-full flex items-center justify-center shrink-0 ${
                                    toastObj.type === 'success' ? 'bg-emerald-100 text-emerald-600' :
                                    toastObj.type === 'error' ? 'bg-red-100 text-red-600' :
                                    toastObj.type === 'warning' ? 'bg-amber-100 text-amber-600' :
                                    'bg-red-50 text-[#C8102E]'
                                }`}>
                                    <i className={`ph ${
                                        toastObj.type === 'success' ? 'ph-check-circle ph-fill' :
                                        toastObj.type === 'error' ? 'ph-x-circle ph-fill' :
                                        toastObj.type === 'warning' ? 'ph-warning ph-fill' :
                                        'ph-bell-ringing ph-fill'
                                    } text-base`}></i>
                                </div>
                                <span>{toastObj.msg}</span>
                            </div>
                        </div>
                    )}

                    {/* Bottom Nav สำหรับ Mobile */}
                    <div className="md:hidden fixed bottom-0 w-full z-50">
                        <div className="absolute inset-0 bg-white/95 backdrop-blur-xl border-t border-gray-200 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]"></div>
                        <div className="relative flex justify-around items-center px-2 py-1.5 pb-safe">
                            <button onClick={() => setCurrentRoute('dashboard')} className={`flex flex-col items-center p-1.5 flex-1 transition-all ${currentRoute === 'dashboard' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                <div className={`p-1.5 rounded-xl mb-0.5 flex items-center justify-center ${currentRoute === 'dashboard' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'dashboard' ? 'ph-house ph-fill' : 'ph-house'} text-[22px]`}></i></div>
                                <span className="text-[10px] font-bold">หน้าแรก</span>
                            </button>
                            <button onClick={() => setCurrentRoute('leaderboard')} className={`flex flex-col items-center p-1.5 flex-1 transition-all ${currentRoute === 'leaderboard' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                <div className={`p-1.5 rounded-xl mb-0.5 flex items-center justify-center ${currentRoute === 'leaderboard' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'leaderboard' ? 'ph-trophy ph-fill' : 'ph-trophy'} text-[22px]`}></i></div>
                                <span className="text-[10px] font-bold">อันดับ</span>
                            </button>

                            {/* ปุ่มประเมินสีแดงกลมตรงกลาง (เฉพาะตอนล็อกอินแล้ว) */}
                            {(appMode === 'admin' || appMode === 'inspector') && (
                                <button onClick={() => setCurrentRoute('inspect')} className="flex flex-col items-center justify-center flex-1 py-1">
                                    <div className={`w-11 h-11 rounded-full flex items-center justify-center shadow-md transition-transform active:scale-95 ${currentRoute === 'inspect' ? 'bg-[#C8102E] text-white ring-4 ring-red-100' : 'bg-[#C8102E] text-white'}`}>
                                        <i className="ph ph-clipboard-text ph-fill text-[22px]"></i>
                                    </div>
                                    <span className={`text-[10px] font-bold mt-0.5 ${currentRoute === 'inspect' ? 'text-[#C8102E]' : 'text-gray-600'}`}>ประเมิน</span>
                                </button>
                            )}

                            <button onClick={() => setCurrentRoute('history')} className={`flex flex-col items-center p-1.5 flex-1 transition-all ${currentRoute === 'history' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                <div className={`p-1.5 rounded-xl mb-0.5 flex items-center justify-center ${currentRoute === 'history' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'history' ? 'ph-clock-counter-clockwise ph-fill' : 'ph-clock-counter-clockwise'} text-[22px]`}></i></div>
                                <span className="text-[10px] font-bold">ประวัติ</span>
                            </button>

                            {appMode === 'admin' ? (
                                <button onClick={() => setCurrentRoute('settings')} className={`flex flex-col items-center p-1.5 flex-1 transition-all ${currentRoute === 'settings' ? 'text-[#C8102E]' : 'text-gray-500'}`}>
                                    <div className={`p-1.5 rounded-xl mb-0.5 flex items-center justify-center ${currentRoute === 'settings' ? 'bg-[#FDECEF]' : 'bg-transparent'}`}><i className={`ph ${currentRoute === 'settings' ? 'ph-gear ph-fill' : 'ph-gear'} text-[22px]`}></i></div>
                                    <span className="text-[10px] font-bold">ตั้งค่า</span>
                                </button>
                            ) : (
                                <button onClick={() => setShowInfoModal(true)} className="flex flex-col items-center p-1.5 flex-1 text-gray-500 transition-all">
                                    <div className="p-1.5 rounded-xl mb-0.5 flex items-center justify-center"><i className="ph ph-question text-[22px]"></i></div>
                                    <span className="text-[10px] font-bold">ช่วยเหลือ</span>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><ZoneCheckApp /></ErrorBoundary>);
    </script>
</body>
</html>
