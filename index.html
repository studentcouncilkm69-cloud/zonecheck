<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZoneCheck - ระบบตรวจความสะอาดและเขตพื้นที่ สภานักเรียนโรงเรียนคำม่วง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', 'Sarabun', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* OMR Answer Sheet Styles */
        .omr-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Sarabun', sans-serif;
            table-layout: fixed;
        }
        .omr-table th, .omr-table td {
            border: 1px solid #374151;
            padding: 0;
            text-align: center;
            vertical-align: middle;
        }
        .omr-table thead th {
            font-size: 8.5px;
            font-weight: 800;
            height: 15px;
            background-color: #f8fafc;
            color: #111827;
            line-height: 1.05;
        }
        .omr-table tbody tr {
            height: 15.2px;
        }
        .omr-bubble {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 12.5px;
            height: 12.5px;
            border-radius: 9999px;
            border: 1.1px solid #cbd5e1;
            color: #cbd5e1;
            font-size: 7px;
            font-weight: 700;
            line-height: 1;
            margin: 0 auto;
            background-color: #ffffff;
            user-select: none;
        }
        @media print {
            body * {
                visibility: hidden !important;
            }
            #printable-omr-sheet, #printable-omr-sheet * {
                visibility: visible !important;
            }
            #printable-omr-sheet {
                position: fixed !important;
                left: 0 !important;
                top: 0 !important;
                width: 297mm !important;
                height: 210mm !important;
                margin: 0 !important;
                padding: 5mm 7mm !important;
                box-shadow: none !important;
                border: none !important;
                background: #ffffff !important;
                z-index: 999999 !important;
            }
            @page {
                size: A4 landscape;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbz_ZoneCheck_API/exec";
        const HARDCODED_LOGO = "https://ui-avatars.com/api/?name=KM&background=C8102E&color=fff&bold=true&size=128";
        const HARDCODED_NAME = "สภานักเรียนโรงเรียนคำม่วง จ.กาฬสินธุ์";
        const ADMIN_AVATAR_URL = "https://ui-avatars.com/api/?name=Admin&background=111827&color=fff&bold=true";

        const INITIAL_ROOMS = [
            "ม.1/1", "ม.1/2", "ม.1/3", "ม.1/4", "ม.1/5", "ม.1/Sp", "ม.1/Sm",
            "ม.2/5", "ม.2/2", "ม.2/1", "ม.2/3", "ม.2/4", "ม.2/6", "ม.2/Sp", "ม.2/Sm",
            "ม.3/1", "ม.3/2", "ม.3/5", "ม.3/4", "ม.3/3", "ม.3/6", "ม.3/Sp", "ม.3/Sm",
            "ม.4/1", "ม.4/2", "ม.4/3", "ม.4/4", "ม.4/5", "ม.4/6 (ICP)", "ม.4/7", "ม.4/Sm", "ม.4/Sp",
            "ม.5/1", "ม.5/2", "ม.5/3", "ม.5/4", "ม.5/5", "ม.5/6", "ม.5/7", "ม.5/Sm",
            "ม.6/1", "ม.6/2", "ม.6/3", "ม.6/4", "ม.6/5", "ม.6/6", "ม.6/7", "ม.6/Sm"
        ].map((name, idx) => ({
            id: `r_${idx + 1}`,
            name: name,
            hasZone: name !== "ม.5/1"
        }));

        const INITIAL_INSPECTORS = [
            { id: 'u_1', name: 'นายภูธนากร หงษ์ทอง (พี่ภีม)', avatar_url: '' },
            { id: 'u_2', name: 'คณะกรรมการสภานักเรียน ทีม A', avatar_url: '' },
            { id: 'u_3', name: 'คณะกรรมการสภานักเรียน ทีม B', avatar_url: '' }
        ];

        const safeParse = (str, fallback) => {
            if (!str) return fallback;
            try { return JSON.parse(str); } catch (e) { return fallback; }
        };

        function App() {
            const [apiUrl, setApiUrl] = useState(() => localStorage.getItem('zc_api_url') || DEFAULT_API_URL);
            const [rooms, setRooms] = useState(() => safeParse(localStorage.getItem('zc_rooms'), INITIAL_ROOMS));
            const [inspectors, setInspectors] = useState(() => safeParse(localStorage.getItem('zc_inspectors'), INITIAL_INSPECTORS));
            const [inspections, setInspections] = useState(() => safeParse(localStorage.getItem('zc_inspections'), []));
            const [settings, setSettings] = useState(() => safeParse(localStorage.getItem('zc_settings'), {
                app_title: 'ZoneCheck',
                app_version: 'V3.0',
                app_logo_url: HARDCODED_LOGO,
                school_logo_url: HARDCODED_LOGO,
                announcement_title: 'แจ้งเตือนคณะกรรมการตรวจเวรประจำวัน',
                announcement_msg: 'สามารถพิมพ์ใบประเมิน A4 แนวนอนไปเดินตรวจ แล้วถ่ายรูปสแกนเข้าสู่ระบบได้ทันที!',
                passcode: '1234',
                master_passcode: '9999',
                admin_name: 'นายภูธนากร หงษ์ทอง (พี่ภีม)',
                admin_role: 'เลขานุการสภานักเรียนโรงเรียนคำม่วง',
                admin_line_url: 'https://line.me/ti/p/~470aijh'
            }));

            const [activeTab, setActiveTab] = useState('inspect'); // 'inspect' | 'paper' | 'history' | 'ranking' | 'admin'
            const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().slice(0, 10));
            const [selectedInspector, setSelectedInspector] = useState(() => localStorage.getItem('zc_last_inspector') || INITIAL_INSPECTORS[0].name);
            const [gradeFilter, setGradeFilter] = useState('all');
            const [searchRoom, setSearchRoom] = useState('');
            const [toast, setToast] = useState(null);
            const [isLoadingSync, setIsLoadingSync] = useState(false);

            // Paper OMR Sheet Print Config
            const [paperSheetModalOpen, setPaperSheetModalOpen] = useState(false);
            const [paperSheetShowDate, setPaperSheetShowDate] = useState(true);
            const [paperSheetShowInspector, setPaperSheetShowInspector] = useState(true);
            const [paperSheetTypeFilter, setPaperSheetTypeFilter] = useState('both'); // 'both' | 'room' | 'zone'
            const [paperSheetGradeFilter, setPaperSheetGradeFilter] = useState('all'); // 'all' | '1'..'6' | 'custom'
            const [paperCustomRoomIds, setPaperCustomRoomIds] = useState(() => INITIAL_ROOMS.map(r => r.id));
            const [paperPickerGradeDropdown, setPaperPickerGradeDropdown] = useState('1');

            // OMR Scanner Modal & 4-Corner Drag State
            const [omrScannerModal, setOmrScannerModal] = useState({
                isOpen: false,
                isScanning: false,
                imagePreview: null,
                annotatedPreview: null,
                sensitivity: 50,
                scanTypeFilter: 'both', // 'both' | 'room' | 'zone'
                scanGradeFilter: 'all',
                scanCustomRoomIds: INITIAL_ROOMS.map(r => r.id),
                showRoomPicker: false,
                onlySaveMarked: true,
                results: []
            });
            const [omrPickerGradeDropdown, setOmrPickerGradeDropdown] = useState('1');
            const [omrCorners, setOmrCorners] = useState(null);
            const [draggingOmrCorner, setDraggingOmrCorner] = useState(null);
            const [omrZoomPreviewUrl, setOmrZoomPreviewUrl] = useState(null);
            const omrFileInputRef = useRef(null);
            const omrRawImageRef = useRef(null);
            const omrPreviewImgRef = useRef(null);
            const omrZoomImgRef = useRef(null);

            // Quick single-room inspect modal
            const [inspectModal, setInspectModal] = useState({
                isOpen: false,
                room: null,
                roomScores: { full: true, c1: 2, c2: 2, c3: 2, c4: 2, c5: 2, noDuty: false, skip: false },
                zoneScore: 10,
                zoneSkip: false,
                comment: ''
            });

            // Admin Settings Inputs
            const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
            const [passcodeInput, setPasscodeInput] = useState('');
            const [maintenanceToggle, setMaintenanceToggle] = useState(false);
            const [maintenanceMsg, setMaintenanceMsg] = useState('');
            const [appLogoInput, setAppLogoInput] = useState(HARDCODED_LOGO);
            const [logoInput, setLogoInput] = useState(HARDCODED_LOGO);
            const [schoolLogoInput, setSchoolLogoInput] = useState(HARDCODED_LOGO);
            const [zoneMapInput, setZoneMapInput] = useState('');
            const [roomMapInput, setRoomMapInput] = useState('');
            const [mainBannerInput, setMainBannerInput] = useState('');
            const [popupBannerInput, setPopupBannerInput] = useState('');
            const [announceBannerInput, setAnnounceBannerInput] = useState('');
            const [announcementTitleInput, setAnnouncementTitleInput] = useState('');
            const [announcementInput, setAnnouncementInput] = useState('');
            const [visMainBanner, setVisMainBanner] = useState('public');
            const [visPopupBanner, setVisPopupBanner] = useState('public');
            const [visAnnounceBanner, setVisAnnounceBanner] = useState('public');
            const [adminAvatarInput, setAdminAvatarInput] = useState(ADMIN_AVATAR_URL);
            const [adminNameInput, setAdminNameInput] = useState('นายภูธนากร หงษ์ทอง (พี่ภีม)');
            const [adminRoleInput, setAdminRoleInput] = useState('เลขานุการสภานักเรียนโรงเรียนคำม่วง');
            const [adminLineInput, setAdminLineInput] = useState('https://line.me/ti/p/~470aijh');
            const [appTitleInput, setAppTitleInput] = useState('ZoneCheck');
            const [appVersionInput, setAppVersionInput] = useState('V3.0');
            const [sysPasscode, setSysPasscode] = useState('1234');
            const [sysMasterPasscode, setSysMasterPasscode] = useState('9999');
            const [newRoomName, setNewRoomName] = useState('');
            const [newInspectorName, setNewInspectorName] = useState('');

            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3800);
            };

            useEffect(() => {
                if (settings) {
                    setMaintenanceToggle(String(settings.is_maintenance).toLowerCase() === 'true');
                    setMaintenanceMsg(settings.maintenance_msg || '⚠️ ระบบกำลังปิดปรับปรุงชั่วคราว\nขออภัยในความไม่สะดวกมา ณ ที่นี้');
                    setAppLogoInput(settings.app_logo_url || HARDCODED_LOGO);
                    setLogoInput(settings.logo_url || HARDCODED_LOGO);
                    setSchoolLogoInput(settings.school_logo_url || HARDCODED_LOGO);
                    setZoneMapInput(settings.zone_map_url || '');
                    setRoomMapInput(settings.room_map_url || '');
                    setMainBannerInput(settings.main_banner_url || '');
                    setPopupBannerInput(settings.popup_banner_url || '');
                    setAnnounceBannerInput(settings.announce_banner_url || settings.banner_url || '');
                    setAnnouncementTitleInput(settings.announcement_title || '');
                    setAnnouncementInput(settings.announcement_msg || '');
                    setVisMainBanner(settings.visibility_main_banner || 'public');
                    setVisPopupBanner(settings.visibility_popup_banner || 'public');
                    setVisAnnounceBanner(settings.visibility_announce_banner || 'public');
                    setAdminAvatarInput(settings.admin_avatar_url || ADMIN_AVATAR_URL);
                    setAdminNameInput(settings.admin_name || 'นายภูธนากร หงษ์ทอง (พี่ภีม)');
                    setAdminRoleInput(settings.admin_role || 'เลขานุการสภานักเรียนโรงเรียนคำม่วง');
                    setAdminLineInput(settings.admin_line_url || 'https://line.me/ti/p/~470aijh');
                    setAppTitleInput((settings.app_title || 'ZoneCheck').trim() || 'ZoneCheck');
                    setAppVersionInput((settings.app_version ?? 'V3.0').trim());
                    setSysPasscode(settings.passcode || '1234');
                    setSysMasterPasscode(settings.master_passcode || '9999');
                }
            }, [settings]);

            useEffect(() => {
                localStorage.setItem('zc_rooms', JSON.stringify(rooms));
            }, [rooms]);

            useEffect(() => {
                localStorage.setItem('zc_inspectors', JSON.stringify(inspectors));
            }, [inspectors]);

            useEffect(() => {
                localStorage.setItem('zc_inspections', JSON.stringify(inspections));
            }, [inspections]);

            useEffect(() => {
                localStorage.setItem('zc_settings', JSON.stringify(settings));
            }, [settings]);

            const fetchFromCloud = async () => {
                if (!apiUrl || apiUrl.includes('AKfycbz_ZoneCheck_API')) {
                    showToast('ขณะนี้ทำงานในโหมดบันทึกในเครื่อง (สามารถใส่ URL Google Sheet ได้ที่หน้าตั้งค่า)', 'info');
                    return;
                }
                setIsLoadingSync(true);
                try {
                    const res = await fetch(`${apiUrl}?action=getInitialData`);
                    const json = await res.json();
                    if (json.status === 'Success') {
                        if (Array.isArray(json.rooms) && json.rooms.length > 0) setRooms(json.rooms);
                        if (Array.isArray(json.inspectors) && json.inspectors.length > 0) setInspectors(json.inspectors);
                        if (json.settings) setSettings(prev => ({ ...prev, ...json.settings }));
                        if (Array.isArray(json.inspections)) setInspections(json.inspections);
                        showToast('ซิงค์ข้อมูลจาก Google Sheets สำเร็จ!', 'success');
                    }
                } catch (err) {
                    showToast('ใช้งานข้อมูลออฟไลน์ในเครื่องเรียบร้อย', 'info');
                } finally {
                    setIsLoadingSync(false);
                }
            };

            const postToCloud = async (action, data) => {
                if (!apiUrl || apiUrl.includes('AKfycbz_ZoneCheck_API')) return;
                try {
                    await fetch(apiUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action, data })
                    });
                } catch (e) {}
            };

            const buildOmrInitialResults = (typeFilter = 'both', gradeF = 'all', customIds = []) => {
                const validRooms = Array.isArray(rooms) ? rooms : [];
                const filtered = validRooms.filter(r => {
                    if (typeFilter === 'zone' && r.hasZone === false) return false;
                    if (gradeF === 'custom') return customIds.includes(r.id);
                    if (gradeF !== 'all') {
                        const match = (r.name || '').match(/(\d+)/);
                        return match && match[1] === gradeF;
                    }
                    return true;
                });
                return filtered.map((r, idx) => ({
                    room: r,
                    index: idx + 1,
                    selectedForSave: false,
                    hasDetectedMark: false,
                    includeRoom: typeFilter === 'both' || typeFilter === 'room',
                    includeZone: (typeFilter === 'both' || typeFilter === 'zone') && r.hasZone !== false,
                    roomScores: { full: false, c1: 2, c2: 2, c3: 2, c4: 2, c5: 2, noDuty: false, skip: false },
                    zoneScore: 10,
                    zoneSkip: false
                }));
            };

            const paperSheetFilteredRooms = useMemo(() => {
                const validRooms = Array.isArray(rooms) ? rooms : [];
                return validRooms.filter(r => {
                    if (paperSheetTypeFilter === 'zone' && r.hasZone === false) return false;
                    if (paperSheetGradeFilter === 'custom') return paperCustomRoomIds.includes(r.id);
                    if (paperSheetGradeFilter !== 'all') {
                        const match = (r.name || '').match(/(\d+)/);
                        return match && match[1] === paperSheetGradeFilter;
                    }
                    return true;
                });
            }, [rooms, paperSheetTypeFilter, paperSheetGradeFilter, paperCustomRoomIds]);

            const paperSheetSplitColumns = useMemo(() => {
                const list = paperSheetFilteredRooms.map((room, idx) => ({ room, num: idx + 1 }));
                const half = Math.ceil(Math.max(list.length, 1) / 2);
                return {
                    left: list.slice(0, half),
                    right: list.slice(half)
                };
            }, [paperSheetFilteredRooms]);

            // Inspections on selectedDate
            const dayInspectionsMap = useMemo(() => {
                const map = {};
                rooms.forEach(r => { map[r.id] = { room: null, zone: null }; });
                inspections.forEach(item => {
                    if (!item || !item.date) return;
                    const dStr = String(item.date).slice(0, 10);
                    if (dStr === selectedDate && map[item.roomId]) {
                        if (item.type === 'room') map[item.roomId].room = item;
                        if (item.type === 'zone') map[item.roomId].zone = item;
                    }
                });
                return map;
            }, [inspections, rooms, selectedDate]);

            const inspectProgress = useMemo(() => {
                let doneCount = 0;
                rooms.forEach(r => {
                    const entry = dayInspectionsMap[r.id];
                    if (entry && (entry.room || entry.zone)) doneCount++;
                });
                return {
                    done: doneCount,
                    total: rooms.length,
                    pct: rooms.length > 0 ? Math.round((doneCount / rooms.length) * 100) : 0
                };
            }, [rooms, dayInspectionsMap]);

            const displayedRooms = useMemo(() => {
                return rooms.filter(r => {
                    if (gradeFilter !== 'all') {
                        const m = (r.name || '').match(/(\d+)/);
                        if (!m || m[1] !== gradeFilter) return false;
                    }
                    if (searchRoom.trim()) {
                        return r.name.toLowerCase().includes(searchRoom.trim().toLowerCase());
                    }
                    return true;
                });
            }, [rooms, gradeFilter, searchRoom]);

            const handleOpenOmrScanner = () => {
                const initType = paperSheetTypeFilter || 'both';
                const initGrade = paperSheetGradeFilter || 'all';
                const initCustom = Array.isArray(paperCustomRoomIds) && paperCustomRoomIds.length > 0
                    ? [...paperCustomRoomIds]
                    : rooms.map(r => r.id);
                const initialResults = buildOmrInitialResults(initType, initGrade, initCustom);
                omrRawImageRef.current = null;
                setOmrCorners(null);
                setDraggingOmrCorner(null);
                setOmrScannerModal({
                    isOpen: true,
                    isScanning: false,
                    imagePreview: null,
                    annotatedPreview: null,
                    sensitivity: 50,
                    scanTypeFilter: initType,
                    scanGradeFilter: initGrade,
                    scanCustomRoomIds: initCustom,
                    showRoomPicker: false,
                    onlySaveMarked: true,
                    results: initialResults
                });
            };

            const handleUpdateOmrFilterConfig = (nextType, nextGrade, nextCustomIds) => {
                const rebuilt = buildOmrInitialResults(nextType, nextGrade, nextCustomIds);
                setOmrScannerModal(prev => ({
                    ...prev,
                    scanTypeFilter: nextType,
                    scanGradeFilter: nextGrade,
                    scanCustomRoomIds: nextCustomIds,
                    results: rebuilt
                }));
                if (omrRawImageRef.current) {
                    setTimeout(() => {
                        processOmrImageWithSensitivity(
                            omrRawImageRef.current,
                            omrScannerModal.sensitivity,
                            nextType,
                            nextGrade,
                            nextCustomIds,
                            omrCorners
                        );
                    }, 50);
                }
            };

            const processOmrImageWithSensitivity = (imgElement, sensValue = 50, overrideType = null, overrideGrade = null, overrideCustomIds = null, customCorners = null) => {
                if (!imgElement) return;
                try {
                    const activeType = overrideType ?? omrScannerModal.scanTypeFilter ?? 'both';
                    const activeGrade = overrideGrade ?? omrScannerModal.scanGradeFilter ?? 'all';
                    const activeCustomIds = overrideCustomIds ?? omrScannerModal.scanCustomRoomIds ?? [];

                    const W = 1122;
                    const H = 793;
                    const canvas = document.createElement('canvas');
                    canvas.width = W;
                    canvas.height = H;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(imgElement, 0, 0, W, H);
                    const imgData = ctx.getImageData(0, 0, W, H).data;

                    const getPixelDarkness = (x, y) => {
                        const px = Math.max(0, Math.min(W - 1, Math.round(x)));
                        const py = Math.max(0, Math.min(H - 1, Math.round(y)));
                        const idx = (py * W + px) * 4;
                        const r = imgData[idx];
                        const g = imgData[idx + 1];
                        const b = imgData[idx + 2];
                        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                        const colorSpread = Math.max(r, g, b) - Math.min(r, g, b);
                        return Math.min(255, (255 - lum) + (colorSpread * 0.65));
                    };

                    const findFiducialCornerMark = (startX, endX, startY, endY, defaultX, defaultY) => {
                        let bestX = defaultX;
                        let bestY = defaultY;
                        let bestScore = -1;
                        const step = 2;
                        for (let y = startY; y <= endY; y += step) {
                            for (let x = startX; x <= endX; x += step) {
                                let centerSum = 0;
                                let centerCnt = 0;
                                for (let dy = -4; dy <= 4; dy += 2) {
                                    for (let dx = -4; dx <= 4; dx += 2) {
                                        centerSum += getPixelDarkness(x + dx, y + dy);
                                        centerCnt++;
                                    }
                                }
                                const centerDarkness = centerSum / centerCnt;
                                if (centerDarkness < 120) continue;

                                let ringSum = 0;
                                let ringCnt = 0;
                                const ringOffsets = [
                                    [-13, -13], [0, -13], [13, -13],
                                    [-13, 0],             [13, 0],
                                    [-13, 13],  [0, 13],  [13, 13]
                                ];
                                for (let k = 0; k < ringOffsets.length; k++) {
                                    ringSum += getPixelDarkness(x + ringOffsets[k][0], y + ringOffsets[k][1]);
                                    ringCnt++;
                                }
                                const ringDarkness = ringSum / ringCnt;
                                const contrastScore = centerDarkness - ringDarkness;

                                if (ringDarkness < 75 && contrastScore > bestScore) {
                                    bestScore = contrastScore;
                                    bestX = x;
                                    bestY = y;
                                }
                            }
                        }
                        if (bestScore < 80) return { x: defaultX, y: defaultY, found: false };
                        return { x: bestX, y: bestY, found: true };
                    };

                    let tl, tr, bl, br;
                    if (customCorners && customCorners.tl && customCorners.tr && customCorners.bl && customCorners.br) {
                        tl = { ...customCorners.tl, found: true };
                        tr = { ...customCorners.tr, found: true };
                        bl = { ...customCorners.bl, found: true };
                        br = { ...customCorners.br, found: true };
                    } else {
                        tl = findFiducialCornerMark(15, Math.floor(W * 0.18), 10, Math.floor(H * 0.18), 43, 23);
                        tr = findFiducialCornerMark(Math.floor(W * 0.82), W - 15, 10, Math.floor(H * 0.18), W - 43, 23);
                        bl = findFiducialCornerMark(15, Math.floor(W * 0.18), Math.floor(H * 0.75), H - 10, 43, H - 27);
                        br = findFiducialCornerMark(Math.floor(W * 0.82), W - 15, Math.floor(H * 0.75), H - 10, W - 43, H - 27);

                        if (!tl.found && bl.found) { tl.x = bl.x; tl.y = Math.max(18, bl.y - 742); }
                        if (!tr.found && br.found) { tr.x = br.x; tr.y = Math.max(18, br.y - 742); }
                        setOmrCorners({ tl, tr, bl, br });
                    }

                    const mapUV = (u, v) => {
                        const topX = tl.x + u * (tr.x - tl.x);
                        const topY = tl.y + u * (tr.y - tl.y);
                        const botX = bl.x + u * (br.x - bl.x);
                        const botY = bl.y + u * (br.y - bl.y);
                        return {
                            x: topX + v * (botX - topX),
                            y: topY + v * (botY - topY)
                        };
                    };

                    const evaluateBubbleScore = (cx, cy) => {
                        let bgSamples = [];
                        for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                            bgSamples.push(getPixelDarkness(cx + Math.cos(angle) * 8.5, cy + Math.sin(angle) * 8.5));
                        }
                        bgSamples.sort((a, b) => a - b);
                        const localBg = bgSamples[2] || 10;

                        let innerSum = 0;
                        let innerCount = 0;
                        let heavyInkPixels = 0;
                        for (let dy = -4; dy <= 4; dy++) {
                            for (let dx = -4; dx <= 4; dx++) {
                                if (dx * dx + dy * dy <= 20) {
                                    const netDark = Math.max(0, getPixelDarkness(cx + dx, cy + dy) - localBg);
                                    innerSum += netDark;
                                    innerCount++;
                                    if (netDark > 65) heavyInkPixels++;
                                }
                            }
                        }
                        const avgNetDarkness = innerCount > 0 ? innerSum / innerCount : 0;
                        const inkCoveragePct = innerCount > 0 ? (heavyInkPixels / innerCount) * 100 : 0;
                        return (avgNetDarkness * 0.45) + (inkCoveragePct * 0.85);
                    };

                    // Draw dashed green alignment box connecting the 4 fiducial corners
                    ctx.save();
                    ctx.strokeStyle = 'rgba(16, 185, 129, 0.7)';
                    ctx.lineWidth = 2.2;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath();
                    ctx.moveTo(tl.x, tl.y);
                    ctx.lineTo(tr.x, tr.y);
                    ctx.lineTo(br.x, br.y);
                    ctx.lineTo(bl.x, bl.y);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.restore();

                    [
                        { pt: tl, label: 'TL' },
                        { pt: tr, label: 'TR' },
                        { pt: bl, label: 'BL' },
                        { pt: br, label: 'BR' }
                    ].forEach(({ pt, label }) => {
                        ctx.strokeStyle = pt.found ? '#10b981' : '#f59e0b';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(pt.x - 13, pt.y - 13, 26, 26);
                        ctx.beginPath();
                        ctx.moveTo(pt.x - 18, pt.y); ctx.lineTo(pt.x + 18, pt.y);
                        ctx.moveTo(pt.x, pt.y - 18); ctx.lineTo(pt.x, pt.y + 18);
                        ctx.stroke();
                        ctx.fillStyle = pt.found ? '#059669' : '#d97706';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.fillText(label, pt.x + 15, pt.y + 4);
                    });

                    const validRooms = Array.isArray(rooms) ? rooms : [];
                    const targetRooms = validRooms.filter(r => {
                        if (activeType === 'zone' && r.hasZone === false) return false;
                        if (activeGrade === 'custom') return activeCustomIds.includes(r.id);
                        if (activeGrade !== 'all') {
                            const match = (r.name || '').match(/(\d+)/);
                            return match && match[1] === activeGrade;
                        }
                        return true;
                    });

                    const half = Math.ceil(Math.max(targetRooms.length, 1) / 2);

                    // คอลัมน์: ที่ (6%) + ห้อง (13%) = 19%
                    // หมวดห้องเรียน 8 ช่อง (เต็ม, โต๊ะ, ขยะ, ไฟ, พื้น, บอร์ด, ไม่ทำ, ข้าม) = 46%
                    // หมวดเขตพื้นที่ 6 ช่อง (ดีเยี่ยม, ดี, พอใช้, ปรับปรุง, ไม่ทำ, ข้าม) = 35%
                    let colRelativeCenters = [];
                    if (activeType === 'both') {
                        const roomCols = Array.from({ length: 8 }, (_, idx) => 0.19 + ((idx + 0.5) * (0.46 / 8)));
                        const zoneCols = Array.from({ length: 6 }, (_, idx) => 0.65 + ((idx + 0.5) * (0.35 / 6)));
                        colRelativeCenters = [...roomCols, ...zoneCols];
                    } else if (activeType === 'room') {
                        colRelativeCenters = Array.from({ length: 8 }, (_, idx) => 0.19 + ((idx + 0.5) * (0.81 / 8)));
                    } else {
                        colRelativeCenters = Array.from({ length: 6 }, (_, idx) => 0.19 + ((idx + 0.5) * (0.81 / 6)));
                    }

                    const markThreshold = Math.max(22, 54 - (sensValue * 0.48));
                    const tableTopV = 0.1555;
                    const rowStepV = 0.02142;

                    const scannedResults = targetRooms.map((r, i) => {
                        const isRightCol = i >= half;
                        const rowIdx = isRightCol ? (i - half) : i;
                        const vRow = tableTopV + ((rowIdx + 0.5) * rowStepV);

                        const uTableLeft = isRightCol ? 0.5055 : -0.0055;
                        const uTableWidth = 0.5035;

                        const bubbleScores = colRelativeCenters.map(colRel => {
                            const uBubble = uTableLeft + (colRel * uTableWidth);
                            const pt = mapUV(uBubble, vRow);
                            const score = evaluateBubbleScore(pt.x, pt.y);
                            return { x: pt.x, y: pt.y, score };
                        });

                        let roomBubbles = [];
                        let zoneBubbles = [];
                        if (activeType === 'both') {
                            roomBubbles = bubbleScores.slice(0, 8);
                            zoneBubbles = bubbleScores.slice(8, 14);
                        } else if (activeType === 'room') {
                            roomBubbles = bubbleScores;
                        } else {
                            zoneBubbles = bubbleScores;
                        }

                        // [0]=เต็ม(10), [1]=โต๊ะ, [2]=ขยะ, [3]=ไฟ, [4]=พื้น, [5]=บอร์ด, [6]=ไม่ทำ(-5), [7]=ข้าม(-)
                        let full = false, c1 = 2, c2 = 2, c3 = 2, c4 = 2, c5 = 2, noDuty = false, skip = false;
                        let anyRoomMarked = false;
                        if (roomBubbles.length > 0) {
                            const markedRoom = roomBubbles.map(b => b.score >= markThreshold);
                            anyRoomMarked = markedRoom.some(Boolean);
                            if (anyRoomMarked) {
                                if (markedRoom[7]) {
                                    skip = true;
                                } else if (markedRoom[6]) {
                                    noDuty = true;
                                } else {
                                    full = markedRoom[0];
                                    c1 = markedRoom[1] ? 0 : 2;
                                    c2 = markedRoom[2] ? 0 : 2;
                                    c3 = markedRoom[3] ? 0 : 2;
                                    c4 = markedRoom[4] ? 0 : 2;
                                    c5 = markedRoom[5] ? 0 : 2;
                                }
                            }
                            roomBubbles.forEach((b, bIdx) => {
                                const isHit = markedRoom[bIdx];
                                ctx.beginPath();
                                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                                ctx.strokeStyle = isHit ? (bIdx === 0 ? '#10b981' : (bIdx === 7 ? '#6b7280' : '#ef4444')) : 'rgba(59, 130, 246, 0.38)';
                                ctx.lineWidth = isHit ? 2.2 : 1;
                                ctx.stroke();
                            });
                        }

                        const zoneValues = [10, 8, 5, 2, -5, null];
                        let zScore = 10;
                        let zSkip = false;
                        let anyZoneMarked = false;
                        if (zoneBubbles.length > 0 && r.hasZone !== false) {
                            let maxZVal = -1;
                            let maxZIdx = -1;
                            zoneBubbles.forEach((b, idx) => {
                                if (b.score > maxZVal) {
                                    maxZVal = b.score;
                                    maxZIdx = idx;
                                }
                            });
                            if (maxZVal >= markThreshold && maxZIdx !== -1) {
                                anyZoneMarked = true;
                                if (zoneValues[maxZIdx] === null) zSkip = true;
                                else zScore = zoneValues[maxZIdx];
                            } else {
                                maxZIdx = -1;
                            }

                            zoneBubbles.forEach((b, bIdx) => {
                                const isHit = bIdx === maxZIdx;
                                ctx.beginPath();
                                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                                ctx.strokeStyle = isHit ? '#d946ef' : 'rgba(217, 70, 239, 0.38)';
                                ctx.lineWidth = isHit ? 2.2 : 1;
                                ctx.stroke();
                            });
                        }

                        const hasAnyMark = anyRoomMarked || anyZoneMarked;

                        return {
                            room: r,
                            index: i + 1,
                            selectedForSave: hasAnyMark,
                            hasDetectedMark: hasAnyMark,
                            includeRoom: (activeType === 'both' || activeType === 'room') && anyRoomMarked,
                            includeZone: (activeType === 'both' || activeType === 'zone') && r.hasZone !== false && anyZoneMarked,
                            roomScores: { full, c1, c2, c3, c4, c5, noDuty, skip },
                            zoneScore: zScore,
                            zoneSkip: zSkip
                        };
                    });

                    const annotatedUrl = canvas.toDataURL('image/jpeg', 0.9);
                    setOmrScannerModal(prev => ({
                        ...prev,
                        isScanning: false,
                        annotatedPreview: annotatedUrl,
                        results: scannedResults
                    }));
                    if (omrZoomPreviewUrl) {
                        setOmrZoomPreviewUrl(annotatedUrl);
                    }
                } catch (err) {
                    setOmrScannerModal(prev => ({ ...prev, isScanning: false }));
                    showToast('อ่านภาพเสร็จสิ้น กรุณาตรวจสอบคะแนนด้านล่าง', 'info');
                }
            };

            const getImageRelativeCoords = (e, imgEl) => {
                if (!imgEl) return null;
                const rect = imgEl.getBoundingClientRect();
                const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
                const x = Math.max(8, Math.min(1114, ((clientX - rect.left) / rect.width) * 1122));
                const y = Math.max(8, Math.min(785, ((clientY - rect.top) / rect.height) * 793));
                return { x, y };
            };

            const handleStartDragOmrCorner = (e, imgEl) => {
                if (!omrCorners || !imgEl) return;
                const pt = getImageRelativeCoords(e, imgEl);
                if (!pt) return;
                let nearestKey = null;
                let minDist = 52;
                ['tl', 'tr', 'bl', 'br'].forEach(key => {
                    const c = omrCorners[key];
                    if (c) {
                        const d = Math.hypot(pt.x - c.x, pt.y - c.y);
                        if (d < minDist) {
                            minDist = d;
                            nearestKey = key;
                        }
                    }
                });
                if (nearestKey) {
                    if (e.cancelable) e.preventDefault();
                    setDraggingOmrCorner(nearestKey);
                }
            };

            const handleMoveDragOmrCorner = (e, imgEl) => {
                if (!draggingOmrCorner || !omrCorners || !imgEl) return;
                if (e.cancelable) e.preventDefault();
                const pt = getImageRelativeCoords(e, imgEl);
                if (!pt) return;
                const nextCorners = {
                    ...omrCorners,
                    [draggingOmrCorner]: { x: pt.x, y: pt.y, found: true }
                };
                setOmrCorners(nextCorners);
                if (omrRawImageRef.current) {
                    processOmrImageWithSensitivity(
                        omrRawImageRef.current,
                        omrScannerModal.sensitivity,
                        omrScannerModal.scanTypeFilter,
                        omrScannerModal.scanGradeFilter,
                        omrScannerModal.scanCustomRoomIds,
                        nextCorners
                    );
                }
            };

            const handleEndDragOmrCorner = () => {
                if (draggingOmrCorner) {
                    setDraggingOmrCorner(null);
                }
            };

            const handleResetOmrAutoCorners = () => {
                setOmrCorners(null);
                if (omrRawImageRef.current) {
                    processOmrImageWithSensitivity(
                        omrRawImageRef.current,
                        omrScannerModal.sensitivity,
                        omrScannerModal.scanTypeFilter,
                        omrScannerModal.scanGradeFilter,
                        omrScannerModal.scanCustomRoomIds,
                        null
                    );
                    showToast('รีเซ็ตจุดมาร์ค 4 มุมอัตโนมัติเรียบร้อย', 'info');
                }
            };

            const handleOmrImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const dataUrl = ev.target.result;
                    setOmrCorners(null);
                    setOmrScannerModal(prev => ({ ...prev, isScanning: true, imagePreview: dataUrl }));
                    showToast('กำลังค้นหาจุดมาร์ค 4 มุมและอ่านค่าวงกลม...', 'info');

                    const img = new Image();
                    img.onload = () => {
                        omrRawImageRef.current = img;
                        setTimeout(() => {
                            processOmrImageWithSensitivity(img, omrScannerModal.sensitivity, null, null, null, null);
                            showToast('สแกนเสร็จสิ้น! สามารถใช้นิ้วลากจุดมุมสีเขียว TL, TR, BL, BR เพื่อปรับให้ตรงได้ทันที', 'success');
                        }, 250);
                    };
                    img.src = dataUrl;
                };
                reader.readAsDataURL(file);
            };

            const toggleOmrResultCriterion = (roomId, key) => {
                setOmrScannerModal(prev => ({
                    ...prev,
                    results: prev.results.map(item => {
                        if (item.room.id !== roomId) return item;
                        const rs = { ...item.roomScores };
                        if (key === 'full') {
                            rs.full = true;
                            rs.skip = false;
                            rs.noDuty = false;
                            rs.c1 = 2; rs.c2 = 2; rs.c3 = 2; rs.c4 = 2; rs.c5 = 2;
                        } else if (key === 'skip') {
                            rs.skip = !rs.skip;
                            if (rs.skip) { rs.noDuty = false; rs.full = false; }
                        } else if (key === 'noDuty') {
                            rs.noDuty = !rs.noDuty;
                            if (rs.noDuty) { rs.skip = false; rs.full = false; }
                        } else {
                            rs.skip = false;
                            rs.noDuty = false;
                            rs.full = false;
                            rs[key] = rs[key] === 2 ? 0 : 2;
                        }
                        return { ...item, hasDetectedMark: true, selectedForSave: true, includeRoom: true, roomScores: rs };
                    })
                }));
            };

            const setOmrResultZone = (roomId, val) => {
                setOmrScannerModal(prev => ({
                    ...prev,
                    results: prev.results.map(item => {
                        if (item.room.id !== roomId) return item;
                        if (val === 'skip') return { ...item, zoneSkip: !item.zoneSkip, hasDetectedMark: true, selectedForSave: true, includeZone: true };
                        return { ...item, zoneSkip: false, zoneScore: val, hasDetectedMark: true, selectedForSave: true, includeZone: true };
                    })
                }));
            };

            const handleSaveOmrBatchResults = async () => {
                const chosen = omrScannerModal.results.filter(item => item.selectedForSave);
                if (chosen.length === 0) {
                    showToast('กรุณาติ๊กเลือกห้องที่ต้องการบันทึกอย่างน้อย 1 ห้อง', 'error');
                    return;
                }
                const batchRecords = [];
                const nowIso = `${selectedDate}T${new Date().toTimeString().slice(0, 8)}`;

                chosen.forEach(item => {
                    if (omrScannerModal.scanTypeFilter === 'both' || omrScannerModal.scanTypeFilter === 'room') {
                        const rs = item.roomScores;
                        let totalRoom = 10;
                        if (rs.skip) totalRoom = null;
                        else if (rs.noDuty) totalRoom = -5;
                        else if (rs.full) totalRoom = 10;
                        else totalRoom = (rs.c1 || 0) + (rs.c2 || 0) + (rs.c3 || 0) + (rs.c4 || 0) + (rs.c5 || 0);

                        batchRecords.push({
                            id: `insp_r_${item.room.id}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                            roomId: item.room.id,
                            roomName: item.room.name,
                            type: 'room',
                            date: nowIso,
                            inspector: selectedInspector,
                            totalScore: totalRoom,
                            details: rs,
                            comment: 'สแกนจากใบตรวจ OMR'
                        });
                    }
                    if ((omrScannerModal.scanTypeFilter === 'both' || omrScannerModal.scanTypeFilter === 'zone') && item.room.hasZone !== false) {
                        batchRecords.push({
                            id: `insp_z_${item.room.id}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                            roomId: item.room.id,
                            roomName: item.room.name,
                            type: 'zone',
                            date: nowIso,
                            inspector: selectedInspector,
                            totalScore: item.zoneSkip ? null : item.zoneScore,
                            comment: 'สแกนจากใบตรวจ OMR'
                        });
                    }
                });

                setInspections(prev => {
                    const filteredPrev = prev.filter(old => {
                        const oldDate = String(old.date || '').slice(0, 10);
                        if (oldDate !== selectedDate) return true;
                        const isOverwritten = batchRecords.some(nw => nw.roomId === old.roomId && nw.type === old.type);
                        return !isOverwritten;
                    });
                    return [...filteredPrev, ...batchRecords];
                });

                await postToCloud('saveBatchInspections', batchRecords);
                setOmrScannerModal(prev => ({ ...prev, isOpen: false }));
                showToast(`บันทึกผลสแกนเรียบร้อย ${chosen.length} ห้อง!`, 'success');
            };

            const openQuickInspectModal = (room) => {
                const existing = dayInspectionsMap[room.id] || {};
                const rData = existing.room?.details || { full: true, c1: 2, c2: 2, c3: 2, c4: 2, c5: 2, noDuty: false, skip: false };
                const zScore = existing.zone ? (existing.zone.totalScore ?? 10) : 10;
                const zSkip = existing.zone ? existing.zone.totalScore === null : false;
                setInspectModal({
                    isOpen: true,
                    room,
                    roomScores: { ...rData },
                    zoneScore: zScore,
                    zoneSkip: zSkip,
                    comment: existing.room?.comment || existing.zone?.comment || ''
                });
            };

            const handleSaveSingleRoomInspect = async () => {
                const r = inspectModal.room;
                if (!r) return;
                const rs = inspectModal.roomScores;
                let rTotal = 10;
                if (rs.skip) rTotal = null;
                else if (rs.noDuty) rTotal = -5;
                else if (rs.full) rTotal = 10;
                else rTotal = (rs.c1 || 0) + (rs.c2 || 0) + (rs.c3 || 0) + (rs.c4 || 0) + (rs.c5 || 0);

                const nowIso = `${selectedDate}T${new Date().toTimeString().slice(0, 8)}`;

                    {

                    }

                if (r.hasZone !== false) {

                    return [...rest, ...newRecords];

                await postToCloud('saveBatchInspections', newRecords);
                setInspectModal(prev => ({ ...prev, isOpen: false }));
                showToast(`บันทึกคะแนนห้อง ${r.name} เรียบร้อยแล้ว`, 'success');
            };

            const handleSaveMegaphoneAndLogo = async () => {
                const updated = {
                    ...settings,
                    app_title: appTitleInput.trim() || 'ZoneCheck',
                    app_version: appVersionInput.trim(),
                    app_logo_url: appLogoInput.trim() || HARDCODED_LOGO,

                    announcement_msg: announcementInput,

                };
                setSettings(updated);
                localStorage.setItem('zc_api_url', apiUrl);
                await postToCloud('updateMultipleSettings', [
                    { key: 'app_title', val: updated.app_title },

                    { key: 'app_logo_url', val: updated.app_logo_url },
                    { key: 'announcement_title', val: updated.announcement_title },
                    { key: 'announcement_msg', val: updated.announcement_msg }
                ]);
                showToast('บันทึกการตั้งค่าระบบและเลขเวอร์ชันเรียบร้อยแล้ว!', 'success');
            };

            const handleExportOmrSheetAsImage = async () => {
                const el = document.getElementById('printable-omr-sheet');
                if (!el) return;
                showToast('กำลังสร้างไฟล์รูปภาพความละเอียดสูง...', 'info');
                const canvas = await html2canvas(el, { scale: 2, useCORS: true });
                const link = document.createElement('a');

                link.href = canvas.toDataURL('image/png');

                showToast('ดาวน์โหลดรูปภาพใบประเมินสำเร็จ!', 'success');
            };

            const handleExportOmrSheetAsPdf = async () => {
                const el = document.getElementById('printable-omr-sheet');
                if (!el) return;
                showToast('กำลังสร้างไฟล์ PDF แนวนอน A4...', 'info');
                const canvas = await html2canvas(el, { scale: 2, useCORS: true });
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

            };

            const handleLogoClick = () => {
